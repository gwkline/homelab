# k3s configuration, installed by bootstrap.sh as /etc/rancher/k3s/config.yaml
# on every node. Agents ignore the server-only keys (k3s logs "Unknown flag ...
# skipping"). Edit here and re-run bootstrap.sh; never hand-edit the node copy.
# Host-specific values (tls-san) go in config.yaml.d/, also written by
# bootstrap.sh.

# Every LoadBalancer uses the Tailscale class, so servicelb only adds svclb
# DaemonSet pods.
disable:
  - traefik
  - servicelb

# AES-CBC encryption of Secrets in the datastore. An existing cluster needs
# the `k3s secrets-encrypt` steps in docs/runbook-server-cluster.md as well.
secrets-encryption: true

kube-apiserver-arg:
  - audit-policy-file=/etc/rancher/k3s/audit-policy.yaml
  - audit-log-path=/var/lib/rancher/k3s/server/logs/audit.log
  - audit-log-maxage=30
  - audit-log-maxbackup=10
  - audit-log-maxsize=100

kubelet-arg:
  # The default image GC thresholds (85/80) sit at the eviction line, so pulls
  # raced eviction on a full disk. Start GC at 70% used, stop at 50%.
  - image-gc-high-threshold=70
  - image-gc-low-threshold=50
  # Without reservations allocatable equals capacity and pods can starve the
  # k3s process (API server, datastore, kubelet) and sshd.
  - system-reserved=cpu=500m,memory=1Gi
  - kube-reserved=cpu=1,memory=2Gi
  # Setting eviction-hard replaces every default threshold, so all signals are
  # listed.
  - eviction-hard=memory.available<500Mi,nodefs.available<10%,nodefs.inodesFree<5%,imagefs.available<10%,imagefs.inodesFree<5%
  # A fork bomb in one pod must not exhaust the node's PID space.
  - pod-max-pids=4096
  # RuntimeDefault for every container that doesn't name a profile.
  - seccomp-default=true
  # Graceful node shutdown: regular pods (Postgres) get 60s to stop, then
  # critical pods get 30s.
  - shutdown-grace-period=90s
  - shutdown-grace-period-critical-pods=30s

kube-controller-manager-arg:
  # Finished pods are garbage-collected once more than 200 exist, which covers
  # Jobs without ttlSecondsAfterFinished and Evicted pods.
  - terminated-pod-gc-threshold=200
