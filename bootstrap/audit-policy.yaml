# API server audit policy, installed by bootstrap.sh as
# /etc/rancher/k3s/audit-policy.yaml on servers. The first matching rule wins.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # Probes and discovery.
  - level: None
    nonResourceURLs:
      - /healthz*
      - /livez*
      - /readyz*
      - /metrics
      - /version
      - /openapi/*
      - /api
      - /api/*
      - /apis
      - /apis/*

  # Steady pollers: the control plane, the kubelet, and the metrics and log
  # collectors. Their writes are still logged.
  - level: None
    users:
      - system:apiserver
      - system:kube-controller-manager
      - system:kube-scheduler
      - system:kube-proxy
      - system:k3s-controller
      - system:serviceaccount:agents:alloy
      - system:serviceaccount:agents:kube-state-metrics
      - system:serviceaccount:agents:victoriametrics
    verbs: [get, list, watch]
  - level: None
    userGroups: ["system:nodes"]
    verbs: [get, list, watch]
  - level: None
    userGroups: ["system:nodes"]
    resources:
      - group: ""
        resources: [nodes/status, pods/status]

  # Heartbeats and events.
  - level: None
    resources:
      - group: coordination.k8s.io
        resources: [leases]
      - group: ""
        resources: [events]
      - group: events.k8s.io
        resources: [events]

  # Request bodies here carry credentials, so only who touched what is logged.
  # Logging Secret bodies would put every credential in plaintext in this log
  # and in Loki.
  - level: Metadata
    resources:
      - group: ""
        resources: [secrets, configmaps, serviceaccounts/token]
      - group: authentication.k8s.io
        resources: [tokenreviews]

  # RBAC changes in full: what was granted and to whom.
  - level: RequestResponse
    verbs: [create, update, patch, delete, deletecollection]
    resources:
      - group: rbac.authorization.k8s.io

  - level: Metadata
