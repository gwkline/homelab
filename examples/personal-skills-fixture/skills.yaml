# Canonical skills manifest — the trust registry of a personal-skills
# repository (ADR-003, homelab#69).
#
# Rules:
# - One entry per skill directory under skills/; every directory must be
#   registered here (scripts/check-personal-skills.sh enforces both ways).
# - allow: false (the default) means "not reviewed yet" — installers skip it.
#   Flipping to allow: true is the human review gate and happens via PR.
# - files: lists every non-markdown file in the skill dir that a human has
#   reviewed for execution safety. Any unlisted file makes the whole skill
#   un-installable (fetched code never ships without review).
# - This public fixture seeds the private skills repository (human gate in
#   #69): the operator copies this directory to create the private repo.
#   Personal skills are never committed to the public homelab repo.
skills:
  - name: tailnet-etiquette
    description: Naming and phrasing etiquette for tailnet services
    allow: true
    files: []
