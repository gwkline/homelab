# Skills manifest: the trust registry of a personal-skills repository
# (docs/adr/adr-007-personal-skills-injection.md). Copy this directory to
# seed the private repo; personal skills never live in this public one.
#
# - Every directory under skills/ has exactly one entry here
#   (scripts/check-personal-skills.sh enforces both ways).
# - allow: false (the default) means unreviewed; installers skip it.
#   Flipping to true is the human review gate.
# - files: lists every reviewed non-markdown file. Any unlisted file makes
#   the whole skill uninstallable.
skills:
  - name: tailnet-etiquette
    description: Naming and phrasing etiquette for tailnet services
    allow: true
    files: []
