name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly full rebuild: t3code floats its agent CLIs on npm dist-tags and
  # every image picks up base-image security updates.
  schedule:
    - cron: "0 10 * * 1"

# Main runs queue rather than overlap, so `latest` only ever moves forward.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx ultracite check
      - run: npx oxfmt --check .
      - run: npm run typecheck
      - name: ESM only
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.js' \
              --exclude-dir=node_modules --exclude-dir=dist \
              -E '(^|[^.\w])(require\(|module\.exports)' apps examples scripts; then
            echo "::error::CommonJS found; the repo is ESM-only"
            exit 1
          fi
      - run: npm run build -w apps/panel
      - run: npm test
      - name: Knowledge retrieval eval (deterministic subset)
        run: npm run eval -w apps/knowledge -- --json --subset

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history for the gitleaks mainline scan below.
          fetch-depth: 0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: ./scripts/verify.sh
      - name: Secret scan (git history, first-parent mainline)
        run: |
          (
            cd /tmp
            curl -fsSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
            curl -fsSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
            grep 'gitleaks_8.30.1_linux_x64.tar.gz' gitleaks_8.30.1_checksums.txt | sha256sum -c --strict -
            # -C BEFORE the member name, or GNU tar treats it as another member
            # and the binary lands in cwd ("gitleaks: command not found").
            tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
            gitleaks version
          )
          gitleaks git --log-opts=--first-parent --config .gitleaks.toml --redact
      - name: Shell fixture tests
        run: |
          for t in apps/*/tests/*.test.sh apps/factory/*/tests/*.test.sh; do
            echo "==> $t"
            sh "$t"
          done

  # Panel against a real API server as its production ServiceAccount
  # (docs/panel-e2e.md); the script reuses this kind cluster.
  panel-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: panel-e2e
      - name: Panel list-and-launch e2e against the real Kubernetes API
        run: ./scripts/panel-e2e-smoke.sh

  # Rendered manifests against a real API server (issue #16): RoleBinding
  # roleRef resolution, referenced ServiceAccounts, permission probes, and a
  # running sandbox Job. Node image pinned to the production Kubernetes
  # version (k3s v1.36.4+k3s1, docs/rebuild-runbook.md).
  manifest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: manifest-smoke
          # Pinned to the production Kubernetes version (k3s v1.36.4+k3s1).
          version: v0.33.0
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          kubectl_version: v1.36.4
      - name: Smoke the rendered manifests against the API server
        run: ./scripts/manifest-smoke.sh

  # Images whose build inputs changed: the image's directory plus every
  # path its Dockerfile COPYs. On main the diff starts at the last green
  # run, so a failed build is retried by the next push. Scheduled and manual
  # runs rebuild everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE="${PR_BASE:-$(gh run list --workflow ci.yaml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')}"
          all=false
          case "$GITHUB_EVENT_NAME" in schedule | workflow_dispatch) all=true ;; esac
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || all=true
          for df in apps/*/Dockerfile apps/factory/*/Dockerfile images/*/Dockerfile; do
            dir="${df%/Dockerfile}"
            srcs="$(awk '/^COPY/ && !/--from/ { for (i = 2; i < NF; i++) if ($i !~ /^--/) print $i }' "$df")"
            # shellcheck disable=SC2086 # srcs is a word list of pathspecs
            if $all || ! git diff --quiet "$BASE" HEAD -- "$dir" $srcs; then
              echo "$dir"
            fi
          done | jq -Rnc '[inputs | {dir: ., name: sub("^(apps|images)/"; "")}]' > images.json
          cat images.json
          echo "images=$(cat images.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: [changes, check, validate, panel-e2e]
    if: needs.changes.outputs.images != '[]'
    name: build ${{ matrix.image.name }}
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        env:
          IMAGE_NAME: ${{ github.repository }}/${{ matrix.image.name }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          file: ${{ matrix.image.dir }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # t3code and factory/worker float their agent CLIs on dist-tags; a
          # unique CACHEBUST per run keeps the GHA cache from replaying a
          # stale resolution layer (apps/shared/install-agent-clis.sh).
          # Other images don't declare the ARG, so it is ignored there.
          build-args: |
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      # Every advertised coding CLI answers, non-root holds, pinned skills
      # match their sha. Same CACHEBUST, so this rebuild is a cache hit.
      - name: Smoke test factory/worker image
        if: matrix.image.name == 'factory/worker'
        run: |
          docker buildx build --load --build-arg CACHEBUST=${{ github.run_id }} -t factory-worker-smoke -f apps/factory/worker/Dockerfile .
          docker run --rm --entrypoint /usr/local/bin/smoke-test factory-worker-smoke

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      # `latest` moves only after the digest is signed, so the deployer never
      # resolves it to an image admission would reject.
      - name: Sign and tag latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image.name }}
        run: |
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"

  # The single required status check: green only when every job above
  # succeeded or was legitimately skipped.
  ci:
    if: always()
    needs: [check, validate, panel-e2e, manifest-smoke, changes, build]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
