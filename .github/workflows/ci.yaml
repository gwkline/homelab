name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly full rebuild: t3code floats its agent CLIs on npm dist-tags and
  # every image picks up base-image security updates.
  schedule:
    - cron: "0 10 * * 1"

# Main runs queue rather than overlap, so `latest` only ever moves forward.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # Lint/format/typecheck are hard blockers: nothing builds unless this is
  # green. Ultracite (oxlint + oxfmt) runs at max strictness — every rule is
  # error-or-off, so there are no warnings to wave through (#115).
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install toolchain
        run: npm ci --no-audit --no-fund
      - name: Install panel deps (tsc typecheck needs panel @types/node)
        run: npm ci --no-audit --no-fund
        working-directory: apps/panel
      - name: Install factory github-app deps (tsc typecheck needs @types/node)
        run: npm ci --no-audit --no-fund
        working-directory: apps/factory/github-app
      - name: Install factory collector deps (tsc typecheck needs @types/node)
        run: npm ci --no-audit --no-fund
        working-directory: apps/factory/collector
      - name: oxlint (ultracite core preset, 0 errors 0 warnings)
        run: npx ultracite check
      - name: oxfmt --check (refuse unformatted files)
        run: npx oxfmt --check .
      - name: tsc --noEmit (max-strict tsconfigs, panel + factory github-app + collector)
        run: npm run typecheck
      - name: No CommonJS anywhere (require/module.exports)
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.js' \
              --exclude-dir=node_modules --exclude-dir=dist \
              -E '(^|[^.\w])(require\(|module\.exports)' apps examples scripts 2>/dev/null; then
            echo "::error::CommonJS found — the repo is ESM-only (#115)"
            exit 1
          fi

  # Panel smoke test: build the web bundle, serve it, and prove index + an
  # asset answer 200 through vite preview.
  panel-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install panel deps
        working-directory: apps/panel
        run: npm ci --no-audit --no-fund
      - name: Build web bundle
        working-directory: apps/panel
        run: npm run build:web
      - name: vite preview smoke test (index + asset answer 200)
        working-directory: apps/panel
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4173/ | grep -q '<div id="root">' \
            || { echo "::error::index.html missing #root"; kill $PREVIEW_PID; exit 1; }
          ASSET=$(curl -s http://127.0.0.1:4173/ | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$ASSET" || { echo "::error::no JS asset in index.html"; kill $PREVIEW_PID; exit 1; }
          curl -sf -o /dev/null -w "asset %{http_code}\n" "http://127.0.0.1:4173${ASSET}" \
            || { echo "::error::asset $ASSET did not answer 200"; kill $PREVIEW_PID; exit 1; }
          kill $PREVIEW_PID

  # Panel unit/integration tests (node --test against the built server):
  # npm ci installs strictly from the committed apps/panel/package-lock.json,
  # and the npm cache is keyed on that same lockfile, so lockfile drift always
  # busts the cache instead of being papered over by stale packages (#18).
  # verify.sh deliberately does not run this suite: it is bash-only (and must
  # stay untouched by dash-gated worker edits, see the validate job below), so
  # CI owns the panel test path and documents the split here — every other
  # check CI runs still lives in verify.sh.
  panel-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install panel deps
        working-directory: apps/panel
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: apps/panel
        run: npm run build
      - name: Test
        working-directory: apps/panel
        run: npm test

  # Panel list-and-launch e2e (#27): the panel runs inside a disposable kind
  # cluster as its production ServiceAccount (`panel`) with the mounted
  # cluster CA, and the suite drives the real HTTP API — /api/state listing
  # seeded Jobs/CronJobs, POST /api/jobs creating a locked-down Job that
  # reaches Complete, and 400s for invalid input. TLS trust or RBAC drift
  # fails loudly with diagnostics. scripts/panel-e2e-smoke.sh reuses the
  # kind cluster this job creates (name panel-e2e) and cleans up after.
  panel-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: panel-e2e
      - name: Panel list-and-launch e2e against the real Kubernetes API
        run: ./scripts/panel-e2e-smoke.sh

  # Knowledge retrieval eval (#59): the cheap deterministic subset runs on
  # every PR — fully offline, no paid API — and the threshold gate blocks
  # obvious retrieval regressions via non-zero exit code.
  knowledge-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/knowledge/package-lock.json
      - name: Install knowledge deps
        working-directory: apps/knowledge
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/knowledge
        run: npm run typecheck
      - name: Unit tests (fusion + eval harness)
        working-directory: apps/knowledge
        run: npm test
      - name: Retrieval eval gate (deterministic subset, machine-readable)
        working-directory: apps/knowledge
        run: npm run eval -- --json --subset

  # Knowledge ingest service tests (#58 + the retrieval issues): the queue's
  # idempotency/lease contracts and the real extract → chunk → embed → upsert
  # pipeline handler, all offline (deterministic fake embeddings, memory
  # store; the live-DB integration suite skips without DATABASE_URL). The
  # service typechecks against apps/knowledge sources (relative imports), so
  # the knowledge lib deps are installed first.
  knowledge-ingest-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/knowledge/package-lock.json
            apps/knowledge-ingest/package-lock.json
      - name: Install knowledge lib deps (typecheck @types)
        working-directory: apps/knowledge
        run: npm ci --no-audit --no-fund
      - name: Install ingest deps
        working-directory: apps/knowledge-ingest
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/knowledge-ingest
        run: npm run typecheck
      - name: Test (queue contracts + pipeline handler)
        working-directory: apps/knowledge-ingest
        run: npm test

  # Knowledge retrieval service tests: API surface (health, auth, search,
  # ingest passthrough) on the memory store plus the Postgres store's SQL
  # construction and mapping against a fake pg client — offline by design.
  knowledge-retrieval-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/knowledge-retrieval/package-lock.json
      - name: Install retrieval deps
        working-directory: apps/knowledge-retrieval
        run: npm ci --no-audit --no-fund
      # The retrieval tsconfig compiles the shared knowledge lib's channel
      # modules too; their `pg` imports resolve from the knowledge app's
      # node_modules (same pattern as the ingest job).
      - name: Install knowledge lib deps (typecheck @types)
        working-directory: apps/knowledge
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/knowledge-retrieval
        run: npm run typecheck
      - name: Test (API surface + pg store)
        working-directory: apps/knowledge-retrieval
        run: npm test

  # GitHub App token service (#70): integration tests with mocked JWT/token
  # exchange (no network, no real App needed).
  github-app-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/factory/github-app/package-lock.json
      - name: Install deps
        working-directory: apps/factory/github-app
        run: npm ci --no-audit --no-fund
      - name: Test (mocked JWT/token exchange)
        working-directory: apps/factory/github-app
        run: npm test

  # Issue collector (#78): behavior tests against a fake GitHub server/client
  # (no network): pagination, conditional requests, rate limits, duplicate-run
  # guarantees.
  collector-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/factory/collector/package-lock.json
      - name: Install deps
        working-directory: apps/factory/collector
        run: npm ci --no-audit --no-fund
      - name: Test (fake GitHub server/client)
        working-directory: apps/factory/collector
        run: npm test

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Verify (lint, manifests, secrets, image refs)
        run: ./scripts/verify.sh
      # Skills-sync fixture tests (#81): a local fixture repo proves
      # pinned-commit verification, allowlist enforcement, idempotent
      # install, obsolete-file removal, private>public precedence, and
      # credential-free Git config. Run beside verify.sh, not inside it:
      # verify.sh itself is bash and must stay untouched by dash-gated
      # worker edits.
      - name: Skills-sync fixture tests
        run: sh apps/shared/tests/skills-sync.test.sh
      - name: Reclaimer fixture test
        run: sh apps/factory/orchestrator/tests/reclaimer.test.sh
      # Stalled-PR sweeper (#242): three seeded PRs (green+old, ci-red fresh,
      # ci-red stale) take distinct correct actions; a stateful gh shim makes
      # the re-run prove idempotency (no duplicate issues/pings/comments).
      - name: Sweeper fixture test
        run: sh apps/factory/reviewer/tests/sweeper.test.sh
      # Medic fixture tests (#239): red→green convergence via a real local
      # bare remote, plus the write-guard and stuck-escalation paths.
      - name: Medic fixture test
        run: sh apps/factory/medic/tests/medic.test.sh

  # Images whose build inputs changed: the image's directory plus every
  # path its Dockerfile COPYs. On main the diff starts at the last green
  # run, so a failed build is retried by the next push. Scheduled and manual
  # runs rebuild everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE="${PR_BASE:-$(gh run list --workflow ci.yaml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')}"
          all=false
          case "$GITHUB_EVENT_NAME" in schedule | workflow_dispatch) all=true ;; esac
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || all=true
          for df in apps/*/Dockerfile apps/factory/*/Dockerfile images/*/Dockerfile; do
            dir="${df%/Dockerfile}"
            srcs="$(awk '/^COPY/ && !/--from/ { for (i = 2; i < NF; i++) if ($i !~ /^--/) print $i }' "$df")"
            # shellcheck disable=SC2086 # srcs is a word list of pathspecs
            if $all || ! git diff --quiet "$BASE" HEAD -- "$dir" $srcs; then
              echo "$dir"
            fi
          done | jq -Rnc '[inputs | {dir: ., name: sub("^(apps|images)/"; "")}]' > images.json
          cat images.json
          echo "images=$(cat images.json)" >> "$GITHUB_OUTPUT"

  build:
    needs:
      [
        changes,
        validate,
        lint,
        panel-smoke,
        panel-test,
        panel-e2e,
        knowledge-eval,
        knowledge-ingest-test,
        knowledge-retrieval-test,
        github-app-test,
        collector-test,
      ]
    if: needs.changes.outputs.images != '[]'
    name: build ${{ matrix.image.name }}
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        env:
          IMAGE_NAME: ${{ github.repository }}/${{ matrix.image.name }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          file: ${{ matrix.image.dir }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # t3code floats its CLIs on dist-tags; a unique CACHEBUST per run
          # keeps the GHA cache from replaying a stale resolution layer
          # (see apps/t3code/Dockerfile). Other images don't declare the
          # ARG, so it is ignored there.
          build-args: |
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      # #74: the worker image must be smoke-tested before it is trusted —
      # every advertised coding CLI answers, non-root holds, pinned skills
      # match their recorded sha. Rebuilds from cache, so it is cheap.
      - name: Smoke test factory/worker image
        if: matrix.image.name == 'factory/worker'
        run: |
          docker buildx build --load -t factory-worker-smoke -f apps/factory/worker/Dockerfile .
          docker run --rm --entrypoint /usr/local/bin/smoke-test factory-worker-smoke

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      # `latest` moves only after the digest is signed, so the deployer never
      # resolves it to an image admission would reject.
      - name: Sign and tag latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image.name }}
        run: |
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"

  # The single required status check: green only when every job above
  # succeeded or was legitimately skipped.
  ci:
    if: always()
    needs:
      [
        lint,
        validate,
        panel-smoke,
        panel-test,
        panel-e2e,
        knowledge-eval,
        knowledge-ingest-test,
        knowledge-retrieval-test,
        github-app-test,
        collector-test,
        changes,
        build,
      ]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
