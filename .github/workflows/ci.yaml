name: ci

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "deploy/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/ci.yaml"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Lint/format/typecheck are hard blockers: nothing builds unless this is
  # green. Ultracite (oxlint + oxfmt) runs at max strictness — every rule is
  # error-or-off, so there are no warnings to wave through (#115).
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install toolchain
        run: npm ci --no-audit --no-fund
      - name: Install panel deps (tsc typecheck needs panel @types/node)
        run: npm ci --no-audit --no-fund
        working-directory: apps/panel
      - name: oxlint (ultracite core preset, 0 errors 0 warnings)
        run: npx ultracite check
      - name: oxfmt --check (refuse unformatted files)
        run: npx oxfmt --check .
      - name: tsc --noEmit (max-strict panel tsconfig)
        run: npx tsc -p apps/panel --noEmit
      - name: No CommonJS anywhere (require/module.exports)
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.js' \
              -E '(^|[^.\w])(require\(|module\.exports)' apps examples scripts 2>/dev/null; then
            echo "::error::CommonJS found — the repo is ESM-only (#115)"
            exit 1
          fi

  # Panel smoke test: build the web bundle, serve it, and prove index + an
  # asset answer 200 through vite preview.
  panel-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install panel deps
        working-directory: apps/panel
        run: npm ci --no-audit --no-fund
      - name: Build web bundle
        working-directory: apps/panel
        run: npm run build:web
      - name: vite preview smoke test (index + asset answer 200)
        working-directory: apps/panel
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4173/ | grep -q '<div id="root">' \
            || { echo "::error::index.html missing #root"; kill $PREVIEW_PID; exit 1; }
          ASSET=$(curl -s http://127.0.0.1:4173/ | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$ASSET" || { echo "::error::no JS asset in index.html"; kill $PREVIEW_PID; exit 1; }
          curl -sf -o /dev/null -w "asset %{http_code}\n" "http://127.0.0.1:4173${ASSET}" \
            || { echo "::error::asset $ASSET did not answer 200"; kill $PREVIEW_PID; exit 1; }
          kill $PREVIEW_PID

  # Panel unit/integration tests (node --test against the built server).
  panel-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install panel deps
        working-directory: apps/panel
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: apps/panel
        run: npm run build
      - name: Test
        working-directory: apps/panel
        run: npm test

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Verify (lint, manifests, secrets, image refs)
        run: ./scripts/verify.sh

  build:
    needs: [validate, lint, panel-smoke, panel-test]
    strategy:
      matrix:
        include:
          - app: t3code
          - app: loop-agent
          - app: hermes
          - app: panel
          - app: factory/worker
          - app: factory/security
          - app: factory/orchestrator
          - app: factory/reviewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        env:
          IMAGE_NAME: ${{ github.repository }}/${{ matrix.app }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
        run: |
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
