name: ci

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "deploy/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/ci.yaml"
  pull_request:
  workflow_dispatch:
  # Weekly agent-CLI freshness (2026-10-05): apps/t3code floats t3/codex/
  # claude-code on npm dist-tags, so each build resolves whatever is
  # current. Without a code change nothing ever rebuilds, so run the
  # pipeline every Monday 06:00 ET; the repin-t3code-image job below
  # rolls the freshly published digest out via an automerging manifest
  # PR. (Schedule events run on the default branch; the push.paths filter
  # applies only to pushes.)
  schedule:
    - cron: "0 10 * * 1"

env:
  REGISTRY: ghcr.io

jobs:
  # Lint/format/typecheck are hard blockers: nothing builds unless this is
  # green. Ultracite (oxlint + oxfmt) runs at max strictness — every rule is
  # error-or-off, so there are no warnings to wave through (#115).
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install toolchain
        run: npm ci --no-audit --no-fund
      - name: Install panel deps (tsc typecheck needs panel @types/node)
        run: npm ci --no-audit --no-fund
        working-directory: apps/panel
      - name: Install factory github-app deps (tsc typecheck needs @types/node)
        run: npm ci --no-audit --no-fund
        working-directory: apps/factory/github-app
      - name: oxlint (ultracite core preset, 0 errors 0 warnings)
        run: npx ultracite check
      - name: oxfmt --check (refuse unformatted files)
        run: npx oxfmt --check .
      - name: tsc --noEmit (max-strict tsconfigs, panel + factory github-app)
        run: npm run typecheck
      - name: No CommonJS anywhere (require/module.exports)
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.js' \
              --exclude-dir=node_modules --exclude-dir=dist \
              -E '(^|[^.\w])(require\(|module\.exports)' apps examples scripts 2>/dev/null; then
            echo "::error::CommonJS found — the repo is ESM-only (#115)"
            exit 1
          fi

  # Panel smoke test: build the web bundle, serve it, and prove index + an
  # asset answer 200 through vite preview.
  panel-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install panel deps
        working-directory: apps/panel
        run: npm ci --no-audit --no-fund
      - name: Build web bundle
        working-directory: apps/panel
        run: npm run build:web
      - name: vite preview smoke test (index + asset answer 200)
        working-directory: apps/panel
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4173/ | grep -q '<div id="root">' \
            || { echo "::error::index.html missing #root"; kill $PREVIEW_PID; exit 1; }
          ASSET=$(curl -s http://127.0.0.1:4173/ | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$ASSET" || { echo "::error::no JS asset in index.html"; kill $PREVIEW_PID; exit 1; }
          curl -sf -o /dev/null -w "asset %{http_code}\n" "http://127.0.0.1:4173${ASSET}" \
            || { echo "::error::asset $ASSET did not answer 200"; kill $PREVIEW_PID; exit 1; }
          kill $PREVIEW_PID

  # Panel unit/integration tests (node --test against the built server):
  # npm ci installs strictly from the committed apps/panel/package-lock.json,
  # and the npm cache is keyed on that same lockfile, so lockfile drift always
  # busts the cache instead of being papered over by stale packages (#18).
  # verify.sh deliberately does not run this suite: it is bash-only (and must
  # stay untouched by dash-gated worker edits, see the validate job below), so
  # CI owns the panel test path and documents the split here — every other
  # check CI runs still lives in verify.sh.
  panel-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install panel deps
        working-directory: apps/panel
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: apps/panel
        run: npm run build
      - name: Test
        working-directory: apps/panel
        run: npm test

  # Knowledge retrieval eval (#59): the cheap deterministic subset runs on
  # every PR — fully offline, no paid API — and the threshold gate blocks
  # obvious retrieval regressions via non-zero exit code.
  knowledge-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/knowledge/package-lock.json
      - name: Install knowledge deps
        working-directory: apps/knowledge
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/knowledge
        run: npm run typecheck
      - name: Unit tests (fusion + eval harness)
        working-directory: apps/knowledge
        run: npm test
      - name: Retrieval eval gate (deterministic subset, machine-readable)
        working-directory: apps/knowledge
        run: npm run eval -- --json --subset

  # GitHub App token service (#70): integration tests with mocked JWT/token
  # exchange (no network, no real App needed).
  github-app-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/factory/github-app/package-lock.json
      - name: Install deps
        working-directory: apps/factory/github-app
        run: npm ci --no-audit --no-fund
      - name: Test (mocked JWT/token exchange)
        working-directory: apps/factory/github-app
        run: npm test

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Verify (lint, manifests, secrets, image refs)
        run: ./scripts/verify.sh
      # Immutable digests for homelab image refs (issue #91): admission
      # signature verification (deploy/image-policy/base) binds to digests,
      # so every deployed homelab ref must be digest-pinned. Runs beside
      # verify.sh, not inside it, for the same reason as the tests above.
      - name: Homelab image digest pins
        run: sh scripts/check-image-pins.sh
      # Skills-sync fixture tests (#81): a local fixture repo proves
      # pinned-commit verification, allowlist enforcement, idempotent
      # install, obsolete-file removal, private>public precedence, and
      # credential-free Git config. Run beside verify.sh, not inside it:
      # verify.sh itself is bash and must stay untouched by dash-gated
      # worker edits.
      - name: Skills-sync fixture tests
        run: sh apps/shared/tests/skills-sync.test.sh
      - name: Reclaimer fixture test
        run: sh apps/factory/orchestrator/tests/reclaimer.test.sh
      # Stalled-PR sweeper (#242): three seeded PRs (green+old, ci-red fresh,
      # ci-red stale) take distinct correct actions; a stateful gh shim makes
      # the re-run prove idempotency (no duplicate issues/pings/comments).
      - name: Sweeper fixture test
        run: sh apps/factory/reviewer/tests/sweeper.test.sh
      # Medic fixture tests (#239): red→green convergence via a real local
      # bare remote, plus the write-guard and stuck-escalation paths.
      - name: Medic fixture test
        run: sh apps/factory/medic/tests/medic.test.sh
      # Factory image single source of truth: run.sh resolves the worker
      # image from the profile ConfigMap (never a second hardcoded digest),
      # the pin helper stamps every copy, and pins agree repo-wide.
      - name: Factory image pin test
        run: sh apps/factory/orchestrator/tests/profile-image.test.sh
      # Backup-secret input regression (#10): a stub kubectl proves the
      # emergency fallback captures interactive credentials byte-exactly
      # (no leading/trailing newline), keeps prompts and visual newlines on
      # stderr, stays non-interactive for env input, and refuses empty
      # values before applying. Run beside verify.sh, not inside it, for
      # the same reason as the skills-sync tests above.
      - name: Backup-secret input regression test
        run: sh scripts/tests/create-backup-secret.test.sh

  build:
    needs:
      [validate, lint, panel-smoke, panel-test, knowledge-eval, github-app-test]
    strategy:
      matrix:
        include:
          - app: t3code
          - app: loop-agent
          - app: hermes
          - app: panel
          - app: factory/worker
          - app: factory/security
          - app: factory/orchestrator
          - app: factory/reviewer
          - app: factory/collector
          - app: pg-textsearch
            dockerfile: images/pg-textsearch/Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        env:
          IMAGE_NAME: ${{ github.repository }}/${{ matrix.app }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          file: ${{ matrix.dockerfile || format('apps/{0}/Dockerfile', matrix.app) }}
          push: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # t3code floats its CLIs on dist-tags; a unique CACHEBUST per run
          # keeps the GHA cache from replaying a stale resolution layer
          # (see apps/t3code/Dockerfile). Other images don't declare the
          # ARG, so it is ignored there.
          build-args: |
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # #74: the worker image must be smoke-tested before it is trusted —
      # every advertised coding CLI answers, non-root holds, pinned skills
      # match their recorded sha. Rebuilds from cache, so it is cheap.
      - name: Smoke test factory/worker image
        if: matrix.app == 'factory/worker'
        run: |
          docker buildx build --load -t factory-worker-smoke -f apps/factory/worker/Dockerfile .
          docker run --rm --entrypoint /usr/local/bin/smoke-test factory-worker-smoke

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless)
        # Same condition as push: above — scheduled main builds publish and
        # must sign, or signature-verifying admission rejects the rollout.
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
        run: |
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # Floating-CLI rollout loop (2026-10-05). t3code builds resolve current
  # npm dist-tags, but the StatefulSets pin digests (issue #35) and git is
  # the only source of what runs — a fresh image alone changes nothing in
  # the cluster. After any publishing main-line build (merge or weekly
  # schedule), pin the t3code/work-t3code manifests to the just-published
  # digest via a PR the auto-deploy watcher then applies. Idempotent: when
  # the manifests already carry the digest (unchanged CLI resolutions),
  # the job exits without a PR. Known limitation: pushes with GITHUB_TOKEN
  # do not trigger CI (GitHub event suppression), so the PR's required
  # checks will not start and it needs an admin/bypass merge — dropping a
  # PAT into a repo secret and using it here would make the loop fully
  # autonomous.
  repin-t3code-image:
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      # depth 2: the gate below diffs HEAD~1..HEAD to see whether
      # apps/t3code changed; a depth-1 clone would make HEAD~1 vanish and
      # the gate would silently skip every run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published t3code digest
        id: digest
        run: |
          d="$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}/t3code:latest" --format '{{.Manifest.Digest}}')"
          test -n "$d"
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - name: Update manifest pins (no-op when current)
        id: update
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Repin only when it can matter. Every main build re-resolves the
          # floating dist-tags (CACHEBUST), so unrelated merges mint new
          # digests too; without this gate each one would spawn a repin PR
          # awaiting an admin merge. Act only on the weekly schedule or
          # when apps/t3code itself changed (a deploy-relevant rebuild).
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            t3_changes="$(git diff --name-only HEAD~1 HEAD -- apps/t3code || true)"
            if [ -z "${t3_changes}" ]; then
              echo "not scheduled and apps/t3code unchanged — skipping repin"
              exit 0
            fi
          fi
          if grep -q "t3code@${DIGEST}" deploy/t3code/base/statefulset.yaml \
             && grep -q "t3code@${DIGEST}" deploy/work-t3code/base/statefulset.yaml; then
            echo "manifests already pin ${DIGEST} — nothing to do"
            exit 0
          fi
          sed -i "s#t3code@sha256:[a-f0-9]\\{64\\}#t3code@${DIGEST}#g" \
            deploy/t3code/base/statefulset.yaml \
            deploy/work-t3code/base/statefulset.yaml
          kubectl kustomize deploy/t3code/base >/dev/null
          kubectl kustomize deploy/work-t3code/base >/dev/null
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Open repin PR (automerge when possible)
        if: steps.update.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          open="$(gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -c '^repin/t3code' || true)"
          if [ "$open" != "0" ]; then
            echo "a repin PR is already open — skipping (it will carry the newest digest)"
            exit 0
          fi
          branch="repin/t3code-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Re-pin t3code/work-t3code to ${DIGEST}"
          git push origin "$branch"
          gh pr create --fill-first --title "Re-pin t3code images to the latest floating build"
          # GitHub suppresses workflow events caused by GITHUB_TOKEN, so this
          # bot PR's required checks will not start on their own and true
          # auto-merge cannot fire. Enable it anyway (free if a PAT-driven
          # variant lands later); otherwise the PR waits for an admin merge.
          if ! gh pr merge "$branch" --auto --squash --delete-branch; then
            echo "auto-merge not enabled for this PR — it awaits an admin merge"
          fi
