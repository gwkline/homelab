name: ci

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "bootstrap/**"
      - "deploy/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/ci.yaml"
  pull_request:
  workflow_dispatch:
  # Weekly agent-CLI freshness (2026-10-05): apps/t3code floats t3/codex/
  # claude-code on npm dist-tags, so each build resolves whatever is
  # current. Without a code change nothing ever rebuilds, so run the
  # pipeline every Monday 06:00 ET; the repin-t3code-image job below
  # rolls the freshly published digest out via an automerging manifest
  # PR. (Schedule events run on the default branch; the push.paths filter
  # applies only to pushes.)
  schedule:
    - cron: "0 10 * * 1"

env:
  REGISTRY: ghcr.io

jobs:
  # Lint/format/typecheck are hard blockers: nothing builds unless this is
  # green. Ultracite (oxlint + oxfmt) runs at max strictness — every rule is
  # error-or-off, so there are no warnings to wave through (#115).
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install toolchain
        run: npm ci --no-audit --no-fund
      - name: Install panel deps (tsc typecheck needs panel @types/node)
        run: npm ci --no-audit --no-fund
        working-directory: apps/panel
      - name: Install factory github-app deps (tsc typecheck needs @types/node)
        run: npm ci --no-audit --no-fund
        working-directory: apps/factory/github-app
      - name: Install factory collector deps (tsc typecheck needs @types/node)
        run: npm ci --no-audit --no-fund
        working-directory: apps/factory/collector
      - name: oxlint (ultracite core preset, 0 errors 0 warnings)
        run: npx ultracite check
      - name: oxfmt --check (refuse unformatted files)
        run: npx oxfmt --check .
      - name: tsc --noEmit (max-strict tsconfigs, panel + factory github-app + collector)
        run: npm run typecheck
      - name: No CommonJS anywhere (require/module.exports)
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.js' \
              --exclude-dir=node_modules --exclude-dir=dist \
              -E '(^|[^.\w])(require\(|module\.exports)' apps examples scripts 2>/dev/null; then
            echo "::error::CommonJS found — the repo is ESM-only (#115)"
            exit 1
          fi

  # Panel smoke test: build the web bundle, serve it, and prove index + an
  # asset answer 200 through vite preview.
  panel-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install panel deps
        working-directory: apps/panel
        run: npm ci --no-audit --no-fund
      - name: Build web bundle
        working-directory: apps/panel
        run: npm run build:web
      - name: vite preview smoke test (index + asset answer 200)
        working-directory: apps/panel
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4173/ | grep -q '<div id="root">' \
            || { echo "::error::index.html missing #root"; kill $PREVIEW_PID; exit 1; }
          ASSET=$(curl -s http://127.0.0.1:4173/ | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$ASSET" || { echo "::error::no JS asset in index.html"; kill $PREVIEW_PID; exit 1; }
          curl -sf -o /dev/null -w "asset %{http_code}\n" "http://127.0.0.1:4173${ASSET}" \
            || { echo "::error::asset $ASSET did not answer 200"; kill $PREVIEW_PID; exit 1; }
          kill $PREVIEW_PID

  # Panel unit/integration tests (node --test against the built server):
  # npm ci installs strictly from the committed apps/panel/package-lock.json,
  # and the npm cache is keyed on that same lockfile, so lockfile drift always
  # busts the cache instead of being papered over by stale packages (#18).
  # verify.sh deliberately does not run this suite: it is bash-only (and must
  # stay untouched by dash-gated worker edits, see the validate job below), so
  # CI owns the panel test path and documents the split here — every other
  # check CI runs still lives in verify.sh.
  panel-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - name: Install panel deps
        working-directory: apps/panel
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: apps/panel
        run: npm run build
      - name: Test
        working-directory: apps/panel
        run: npm test

  # Panel list-and-launch e2e (#27): the panel runs inside a disposable kind
  # cluster as its production ServiceAccount (`panel`) with the mounted
  # cluster CA, and the suite drives the real HTTP API — /api/state listing
  # seeded Jobs/CronJobs, POST /api/jobs creating a locked-down Job that
  # reaches Complete, and 400s for invalid input. TLS trust or RBAC drift
  # fails loudly with diagnostics. scripts/panel-e2e-smoke.sh reuses the
  # kind cluster this job creates (name panel-e2e) and cleans up after.
  panel-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: panel-e2e
      - name: Panel list-and-launch e2e against the real Kubernetes API
        run: ./scripts/panel-e2e-smoke.sh

  # Knowledge retrieval eval (#59): the cheap deterministic subset runs on
  # every PR — fully offline, no paid API — and the threshold gate blocks
  # obvious retrieval regressions via non-zero exit code.
  knowledge-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/knowledge/package-lock.json
      - name: Install knowledge deps
        working-directory: apps/knowledge
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/knowledge
        run: npm run typecheck
      - name: Unit tests (fusion + eval harness)
        working-directory: apps/knowledge
        run: npm test
      - name: Retrieval eval gate (deterministic subset, machine-readable)
        working-directory: apps/knowledge
        run: npm run eval -- --json --subset

  # Knowledge ingest service tests (#58 + the retrieval issues): the queue's
  # idempotency/lease contracts and the real extract → chunk → embed → upsert
  # pipeline handler, all offline (deterministic fake embeddings, memory
  # store; the live-DB integration suite skips without DATABASE_URL). The
  # service typechecks against apps/knowledge sources (relative imports), so
  # the knowledge lib deps are installed first.
  knowledge-ingest-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/knowledge/package-lock.json
            apps/knowledge-ingest/package-lock.json
      - name: Install knowledge lib deps (typecheck @types)
        working-directory: apps/knowledge
        run: npm ci --no-audit --no-fund
      - name: Install ingest deps
        working-directory: apps/knowledge-ingest
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/knowledge-ingest
        run: npm run typecheck
      - name: Test (queue contracts + pipeline handler)
        working-directory: apps/knowledge-ingest
        run: npm test

  # Knowledge retrieval service tests: API surface (health, auth, search,
  # ingest passthrough) on the memory store plus the Postgres store's SQL
  # construction and mapping against a fake pg client — offline by design.
  knowledge-retrieval-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/knowledge-retrieval/package-lock.json
      - name: Install retrieval deps
        working-directory: apps/knowledge-retrieval
        run: npm ci --no-audit --no-fund
      # The retrieval tsconfig compiles the shared knowledge lib's channel
      # modules too; their `pg` imports resolve from the knowledge app's
      # node_modules (same pattern as the ingest job).
      - name: Install knowledge lib deps (typecheck @types)
        working-directory: apps/knowledge
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/knowledge-retrieval
        run: npm run typecheck
      - name: Test (API surface + pg store)
        working-directory: apps/knowledge-retrieval
        run: npm test

  # Knowledge MCP adapter tests (#64): tool registration + passthrough over
  # the in-memory transport, contract bounds, and error shaping — offline.
  knowledge-mcp-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/knowledge-mcp/package-lock.json
      - name: Install mcp deps
        working-directory: apps/knowledge-mcp
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/knowledge-mcp
        run: npm run typecheck
      - name: Test (tool registration + client contract)
        working-directory: apps/knowledge-mcp
        run: npm test

  # GitHub App token service (#70): integration tests with mocked JWT/token
  # exchange (no network, no real App needed).
  github-app-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/factory/github-app/package-lock.json
      - name: Install deps
        working-directory: apps/factory/github-app
        run: npm ci --no-audit --no-fund
      - name: Test (mocked JWT/token exchange)
        working-directory: apps/factory/github-app
        run: npm test

  # Issue collector (#78): behavior tests against a fake GitHub server/client
  # (no network): pagination, conditional requests, rate limits, duplicate-run
  # guarantees.
  collector-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/factory/collector/package-lock.json
      - name: Install deps
        working-directory: apps/factory/collector
        run: npm ci --no-audit --no-fund
      - name: Test (fake GitHub server/client)
        working-directory: apps/factory/collector
        run: npm test

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Verify (lint, manifests, secrets, image refs)
        run: ./scripts/verify.sh
      # Immutable digests for homelab image refs (issue #91): admission
      # signature verification (deploy/image-policy/base) binds to digests,
      # so every deployed homelab ref must be digest-pinned. Runs beside
      # verify.sh, not inside it, for the same reason as the tests above.
      - name: Homelab image digest pins
        run: sh scripts/check-image-pins.sh
      # Skills-sync fixture tests (#81): a local fixture repo proves
      # pinned-commit verification, allowlist enforcement, idempotent
      # install, obsolete-file removal, private>public precedence, and
      # credential-free Git config. Run beside verify.sh, not inside it:
      # verify.sh itself is bash and must stay untouched by dash-gated
      # worker edits.
      - name: Skills-sync fixture tests
        run: sh apps/shared/tests/skills-sync.test.sh
      - name: Reclaimer fixture test
        run: sh apps/factory/orchestrator/tests/reclaimer.test.sh
      # Stalled-PR sweeper (#242): three seeded PRs (green+old, ci-red fresh,
      # ci-red stale) take distinct correct actions; a stateful gh shim makes
      # the re-run prove idempotency (no duplicate issues/pings/comments).
      - name: Sweeper fixture test
        run: sh apps/factory/reviewer/tests/sweeper.test.sh
      # Medic fixture tests (#239): red→green convergence via a real local
      # bare remote, plus the write-guard and stuck-escalation paths.
      - name: Medic fixture test
        run: sh apps/factory/medic/tests/medic.test.sh
      # Factory image single source of truth: run.sh resolves the worker
      # image from the profile ConfigMap (never a second hardcoded digest),
      # the pin helper stamps every copy, and pins agree repo-wide.
      - name: Factory image pin test
        run: sh apps/factory/orchestrator/tests/profile-image.test.sh
      # Backup-secret input regression (#10): a stub kubectl proves the
      # emergency fallback captures interactive credentials byte-exactly
      # (no leading/trailing newline), keeps prompts and visual newlines on
      # stderr, stays non-interactive for env input, and refuses empty
      # values before applying. Run beside verify.sh, not inside it, for
      # the same reason as the skills-sync tests above.
      - name: Backup-secret input regression test
        run: sh scripts/tests/create-backup-secret.test.sh

  build:
    needs:
      [
        validate,
        lint,
        panel-smoke,
        panel-test,
        panel-e2e,
        knowledge-eval,
        knowledge-ingest-test,
        knowledge-retrieval-test,
        knowledge-mcp-test,
        github-app-test,
        github-app-test,
        collector-test,
      ]
    strategy:
      matrix:
        include:
          - app: t3code
          - app: loop-agent
          - app: hermes
          - app: panel
          - app: factory/worker
          - app: factory/security
          - app: factory/orchestrator
          - app: factory/reviewer
          - app: factory/collector
          - app: knowledge-ingest
          - app: knowledge-retrieval
          - app: pg-textsearch
            dockerfile: images/pg-textsearch/Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        env:
          IMAGE_NAME: ${{ github.repository }}/${{ matrix.app }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          file: ${{ matrix.dockerfile || format('apps/{0}/Dockerfile', matrix.app) }}
          push: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # t3code floats its CLIs on dist-tags; a unique CACHEBUST per run
          # keeps the GHA cache from replaying a stale resolution layer
          # (see apps/t3code/Dockerfile). Other images don't declare the
          # ARG, so it is ignored there.
          build-args: |
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # #74: the worker image must be smoke-tested before it is trusted —
      # every advertised coding CLI answers, non-root holds, pinned skills
      # match their recorded sha. Rebuilds from cache, so it is cheap.
      - name: Smoke test factory/worker image
        if: matrix.app == 'factory/worker'
        run: |
          docker buildx build --load -t factory-worker-smoke -f apps/factory/worker/Dockerfile .
          docker run --rm --entrypoint /usr/local/bin/smoke-test factory-worker-smoke

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless)
        # Same condition as push: above — scheduled main builds publish and
        # must sign, or signature-verifying admission rejects the rollout.
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
        run: |
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # Floating-CLI rollout loop (2026-10-05). t3code builds resolve current
  # npm dist-tags, but the StatefulSets pin digests (issue #35) and git is
  # the only source of what runs — a fresh image alone changes nothing in
  # the cluster. After any publishing main-line build (merge or weekly
  # schedule), pin the t3code/work-t3code manifests to the just-published
  # digest via a PR the auto-deploy watcher then applies. Idempotent: when
  # the manifests already carry the digest (unchanged CLI resolutions),
  # the job exits without a PR. Known limitation: pushes with GITHUB_TOKEN
  # do not trigger CI (GitHub event suppression), so the PR's required
  # checks will not start and it needs an admin/bypass merge — dropping a
  # PAT into a repo secret and using it here would make the loop fully
  # autonomous.
  repin-t3code-image:
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      # depth 2: the gate below diffs HEAD~1..HEAD to see whether
      # apps/t3code changed; a depth-1 clone would make HEAD~1 vanish and
      # the gate would silently skip every run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published t3code digest
        id: digest
        run: |
          d="$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}/t3code:latest" --format '{{.Manifest.Digest}}')"
          test -n "$d"
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - name: Update manifest pins (no-op when current)
        id: update
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Repin only when it can matter. Every main build re-resolves the
          # floating dist-tags (CACHEBUST), so unrelated merges mint new
          # digests too; without this gate each one would spawn a repin PR
          # awaiting an admin merge. Act only on the weekly schedule or
          # when apps/t3code itself changed (a deploy-relevant rebuild).
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            t3_changes="$(git diff --name-only HEAD~1 HEAD -- apps/t3code || true)"
            if [ -z "${t3_changes}" ]; then
              echo "not scheduled and apps/t3code unchanged — skipping repin"
              exit 0
            fi
          fi
          if grep -q "t3code@${DIGEST}" deploy/t3code/base/statefulset.yaml \
             && grep -q "t3code@${DIGEST}" deploy/work-t3code/base/statefulset.yaml; then
            echo "manifests already pin ${DIGEST} — nothing to do"
            exit 0
          fi
          sed -i "s#t3code@sha256:[a-f0-9]\\{64\\}#t3code@${DIGEST}#g" \
            deploy/t3code/base/statefulset.yaml \
            deploy/work-t3code/base/statefulset.yaml
          kubectl kustomize deploy/t3code/base >/dev/null
          kubectl kustomize deploy/work-t3code/base >/dev/null
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Open repin PR (automerge when possible)
        if: steps.update.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          open="$(gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -c '^repin/t3code' || true)"
          if [ "$open" != "0" ]; then
            echo "a repin PR is already open — skipping (it will carry the newest digest)"
            exit 0
          fi
          branch="repin/t3code-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Re-pin t3code/work-t3code to ${DIGEST}"
          git push origin "$branch"
          gh pr create --fill-first --title "Re-pin t3code images to the latest floating build"
          # GitHub suppresses workflow events caused by GITHUB_TOKEN, so this
          # bot PR's required checks will not start on their own and true
          # auto-merge cannot fire. Enable it anyway (free if a PAT-driven
          # variant lands later); otherwise the PR waits for an admin merge.
          if ! gh pr merge "$branch" --auto --squash --delete-branch; then
            echo "auto-merge not enabled for this PR — it awaits an admin merge"
          fi

  # Auto-deploy loop (2026-10-06): merge to main → build publishes fresh
  # images (the `build` job above) → THIS job pins them into the workload
  # manifests → the auto-deploy watcher applies the merged manifests on its
  # next 300s pass. No human step between merge and cluster rollout.
  # Covers the watchlisted apps repin-t3code-image does not (that job owns
  # the t3code/work-t3code pair).
  #
  # REPIN_TOKEN is a PAT (the same credential the factory bots push/merge
  # with) because GITHUB_TOKEN pushes do not trigger CI — a PR pushed with
  # the workflow token never satisfies required checks, so it can never
  # auto-merge. Without the secret the job exits non-zero as a loud signal
  # instead of silently reverting to a manual-merge PR.
  repin-app-images:
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.REPIN_TOKEN }}
    steps:
      # depth 2: the changed-dirs gate diffs HEAD~1..HEAD; depth 1 would make
      # HEAD~1 vanish and the gate would silently skip every run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — PAT present
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::REPIN_TOKEN secret is not set — the repin PR could not trigger CI without it. Set it to the factory PAT."
            exit 1
          fi

      - name: Repin changed app images (no-op when current)
        id: repin
        run: |
          set -eu
          # app → every manifest that pins its image (single source of truth
          # per component; factory apps fan out across cronjobs + profiles).
          files_for() {
            case "$1" in
              panel)               echo "deploy/panel/base/deployment.yaml" ;;
              hermes)              echo "deploy/hermes/base/statefulset.yaml" ;;
              knowledge-ingest)    echo "deploy/knowledge/base/deployment-knowledge-ingest.yaml" ;;
              knowledge-retrieval) echo "deploy/knowledge/base/deployment-knowledge-retrieval.yaml" ;;
              factory/orchestrator) echo "deploy/factory/base/orchestrator-cronjob.yaml deploy/factory/base/orchestrator-launchpad-cronjob.yaml deploy/factory/base/reclaimer-cronjob.yaml" ;;
              factory/reviewer)     echo "deploy/factory/base/reviewer-cronjob.yaml deploy/factory/base/reviewer-launchpad-cronjob.yaml deploy/factory/base/medic-cronjob.yaml deploy/factory/base/sweeper-cronjob.yaml deploy/factory/base/profile-reviewer.yaml" ;;
              factory/security)    echo "deploy/factory/base/security-cronjob.yaml deploy/factory/base/profile-security.yaml" ;;
              factory/worker)      echo "deploy/factory/base/profile-code-pr.yaml deploy/factory/base/profile-medic.yaml" ;;
              factory/collector)   echo "deploy/factory/base/collector-cronjob.yaml" ;;
              loop-agent)          echo "deploy/factory/base/reconciler-cronjob.yaml" ;;
            esac
          }
          # source dir whose change means a deploy-relevant rebuild. For the
          # factory/reviewer image this includes medic + sweeper sources (they
          # ride the reviewer image; their scripts live in apps/factory/*).
          srcdirs_for() {
            case "$1" in
              factory/reviewer) echo "apps/factory/reviewer apps/factory/medic" ;;
              *)                 echo "apps/${1}" ;;
            esac
          }
          REPINNED=""
          for app in panel hermes knowledge-ingest knowledge-retrieval \
                     factory/orchestrator factory/reviewer factory/security factory/worker factory/collector loop-agent; do
            files="$(files_for "$app")"
            if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
              # Deploy-relevant change only: the app's source or one of its
              # pin files. Unrelated merges also mint new digests (every
              # build re-pushes :latest), so without this gate each merge
              # would spawn a churn PR for every app. A repin commit itself
              # trips the file gate, finds the digest already pinned, and
              # no-ops.
              srcdirs="$(srcdirs_for "$app")"
              diffs="$(git diff --name-only HEAD~1 HEAD -- ${srcdirs} ${files} || true)"
              if [ -z "${diffs}" ]; then
                echo "${app}: unchanged — skip"
                continue
              fi
            fi
            digest="$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}/${app}:latest" --format '{{.Manifest.Digest}}')"
            if grep -q "/${app}@${digest}" ${files}; then
              echo "${app}: already pinned to ${digest}"
              continue
            fi
            sed -i "s#/${app}@sha256:[a-f0-9]\\{64\\}#/${app}@${digest}#g" ${files}
            REPINNED="${REPINNED} ${app}"
            echo "${app}: repinned -> ${digest}"
          done
          if [ -n "${REPINNED}" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
            echo "repinned=${REPINNED# }" >> "$GITHUB_OUTPUT"
          fi

      - name: Open repin PR and merge when green
        if: steps.repin.outputs.changed == '1'
        run: |
          set -eu
          open="$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json headRefName --jq '.[].headRefName' | grep -c '^repin/apps' || true)"
          if [ "$open" != "0" ]; then
            echo "a repin/apps PR is already open — skipping (it carries the newest digests)"
            exit 0
          fi
          branch="repin/apps-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Re-pin app images: ${{ steps.repin.outputs.repinned }}"
          # PAT push (template URL — the token never lands in a file):
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --head "$branch" --title "chore(deploy): auto re-pin ${{ steps.repin.outputs.repinned }}" \
            --body "Auto-generated by the repin-app-images job: pins the images CI published for this merge into the workload manifests. The auto-deploy watcher applies them to the cluster within one 300s pass after merge."
          # Merge when required checks go green (builds take ~15-20 min).
          # mergeStateStatus is server-side truth; gh pr checks output can be
          # stale immediately after push. DIRTY leaves the PR for a human.
          for i in $(seq 1 60); do
            st="$(gh pr view "$branch" -R "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)"
            case "$st" in
              CLEAN)
                gh pr merge "$branch" -R "$GITHUB_REPOSITORY" --squash --delete-branch
                echo "merged ${branch}"
                exit 0
                ;;
              DIRTY)
                echo "PR conflicts with main — leaving open for a human rebase"
                exit 0
                ;;
              BLOCKED)
                sleep 50
                ;;
              *)
                echo "PR state ${st} — leaving open for follow-up"
                exit 0
                ;;
            esac
          done
          echo "checks did not go green within the budget — PR left open"
