# Core set, in dependency order. Applied after these server-side/helm
# pre-applies (CRDs too large for client-side apply; see
# docs/rebuild-runbook.md): ESO (deploy/eso/base), CNPG (deploy/cnpg/base)
# plus its Barman Cloud plugin (deploy/cnpg/barman), policy-controller.
# tailscale-operator is helm-installed after this root.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../deploy/namespaces
  - ../../../deploy/policies/base
  - ../../../deploy/image-policy/base
  - ../../../deploy/github-tokens/base
  - ../../../deploy/tailscale
  - ../../../deploy/postgres/base
  - ../../../deploy/t3code/base
  - ../../../deploy/hermes/base
  - ../../../deploy/homepage/base
  - ../../../deploy/panel/base
  - ../../../deploy/headlamp/base
  - ../../../deploy/loki/base
  - ../../../deploy/victoriametrics/base
  - ../../../deploy/grafana/base
  - ../../../deploy/factory/base
  - ../../../deploy/deployer
  - ../../../deploy/work-t3code/base
  - ../../../deploy/chaos/base
  - ../../../deploy/node-cleanup/base
