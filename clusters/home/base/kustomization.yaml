# Core set, in dependency order. Applied after these server-side/helm
# pre-applies (CRDs too large for client-side apply; see
# docs/rebuild-runbook.md): ESO (deploy/eso/base), CNPG (deploy/cnpg/base),
# policy-controller. tailscale-operator is helm-installed after this root.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../deploy/namespaces/base
  - ../../../deploy/policies/base
  - ../../../deploy/image-policy/base
  - ../../../deploy/github-tokens/base
  - ../../../deploy/tailscale/base
  - ../../../deploy/postgres/base
  - ../../../deploy/cloudbeaver/base
  - ../../../deploy/t3code/base
  - ../../../deploy/hermes/base
  - ../../../deploy/panel/base
  - ../../../deploy/headlamp/base
  - ../../../deploy/loki/base
  - ../../../deploy/victoriametrics/base
  - ../../../deploy/grafana/base
  - ../../../deploy/factory/base
  - ../../../deploy/deployer/base
  - ../../../deploy/work-docker-vm/base
  - ../../../deploy/work-t3code/base

# This target is in a sibling base of policies, so replace after composition.
replacements:
  - source:
      kind: ConfigMap
      name: homelab-node
      fieldPath: data.ip
    targets:
      - select:
          kind: ConfigMap
          name: work-docker-endpoint
        fieldPaths:
          - data.host
