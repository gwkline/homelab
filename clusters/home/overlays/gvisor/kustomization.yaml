apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Opt-in overlay: the full normal set (../../base) with the loop-agent
# CronJob running under gVisor — same RuntimeClass + patch as
# deploy/gvisor/base (whose loop-agent manifests must NOT be referenced here:
# base already carries them and duplicate resource IDs fail the build). The
# standalone apply-just-this variant remains `kubectl apply -k
# deploy/gvisor/base`.
#
#   kubectl apply -k clusters/home/overlays/gvisor
resources:
  - ../../base
  - runtimeclass.yaml
patches:
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: loop-example
    patch: |
      - op: add
        path: /spec/jobTemplate/spec/template/spec/runtimeClassName
        value: gvisor
