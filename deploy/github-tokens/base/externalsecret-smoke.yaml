# Connection smoke test for the 1Password SDK provider (issue #41): syncs a
# harmless, non-sensitive item from the dedicated homelab vault into a real
# Kubernetes Secret, proving store auth + vault reachability end to end.
#
# 1Password item contract (vault `homelab`):
#   item: eso-smoke   field: password   (any non-sensitive literal)
# Until the item exists this ExternalSecret stays Ready=False and retries —
# the expected state (same pattern as the optional github-token-writer).
#
# This is the designated drill target for the delete/recreate test (see
# deploy/eso/base/README.md): deleting Secret `eso-smoke-output` must be
# undone by ESO on the next reconcile. Never drill against a real credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-smoke
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: eso-smoke-output
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Trim guards against a trailing newline in the 1Password field
        # (same guarantee github-token.yaml applies).
        password: "{{ .password | trim }}"
  data:
    - secretKey: password
      remoteRef:
        key: eso-smoke/password
