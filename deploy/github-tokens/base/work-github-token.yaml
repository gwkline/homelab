# The only GitHub credential in `work`. The PAT's repository scoping is the
# isolation boundary; `repos` (clone URLs) stays out of this public repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: work-github-token
  namespace: work
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: work-github-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token | trim }}"
        repos: "{{ .repos | trim }}"
  data:
    - secretKey: token
      remoteRef:
        key: work-github-writer/token
    - secretKey: repos
      remoteRef:
        key: work-github-writer/repos
