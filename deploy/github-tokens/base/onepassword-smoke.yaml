# Harmless end-to-end proof of the 1Password SDK provider connection
# (issue #41): syncs one dedicated non-sensitive vault item into a throwaway
# Secret, without touching any real credential.
#
# 1Password item contract:
#   vault:  homelab
#   item:   eso-smoke   field: password (text, any harmless value)
# Until the item exists this ExternalSecret stays Ready=False and keeps
# retrying — the expected state (same as github-token-writer without its
# optional item).
#
# Verification drill (issue #41):
#   1. kubectl -n agents get secretstore onepassword           # Ready=True
#   2. kubectl -n agents get externalsecret onepassword-smoke  # Ready=True
#   3. kubectl -n agents delete secret onepassword-smoke-output
#   4. ESO restores it from the vault on the next reconcile — force it
#      immediately and watch it flip back to Ready:
#        kubectl -n agents annotate externalsecret onepassword-smoke \
#          external-secrets.io/force-sync="$(date +%s)" --overwrite
# Lives here (not deploy/eso/base) because the `onepassword` SecretStores it
# exercises are declared in this directory, so no extra copy of the
# bootstrap token is needed anywhere.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-smoke
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: onepassword-smoke-output
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        # 1Password SDK secret-reference syntax: <item>/<field>
        key: eso-smoke/password
