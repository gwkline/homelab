# Optional: without the github-writer item this stays Ready=False, and every
# consumer mounts the Secret with optional: true.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token-writer
  namespace: sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-token-writer
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token | trim }}"
  data:
    - secretKey: token
      remoteRef:
        key: github-writer/token
