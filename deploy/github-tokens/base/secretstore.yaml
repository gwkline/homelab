# The only 1Password store. Its token Secret lives in external-secrets, where
# only the ESO controller runs, so no workload namespace holds a credential
# that reads the whole vault. ExternalSecrets in any namespace not listed are
# refused; adding a namespace here is a deliberate widening.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          namespace: external-secrets
          name: onepassword-service-account
          key: token
  conditions:
    - namespaces:
        - agents
        - sandbox
        - tailscale
        - work
