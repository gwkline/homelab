# Namespace-scoped SecretStores for the dedicated homelab 1Password vault
# (one store per vault — see issue #41 for the ESO install + bootstrap of the
# service-account token, the only manually created secret for this provider).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
  namespace: agents
spec:
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          key: token
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
  namespace: sandbox
spec:
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          key: token
