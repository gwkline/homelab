# CloudNativePG operator 1.30.0 (issue #49).
#
# `upstream.yaml` is the verbatim operator bundle from the official v1.30.0
# release (https://github.com/cloudnative-pg/cloudnative-pg/releases/tag/v1.30.0,
# asset cnpg-1.30.0.yaml; same bytes as
# https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.30.0/releases/cnpg-1.30.0.yaml).
# Do NOT hand-edit it — refresh it from the next release instead (see
# ../README.md "Upgrading").
#
# The local mutations are (repo convention, issue #91):
#   1. the digest pin below: the operator Deployment image resolves to
#      ghcr.io/cloudnative-pg/cloudnative-pg:1.30.0 pinned to the multi-arch
#      manifest digest, and OPERATOR_IMAGE_NAME is set to the same reference
#      so anything the operator spawns from that env var pulls immutable
#      bytes too. The tag portion is kept so any tag-parsing logic keeps
#      working.
#   2. pod-security labels on the cnpg-system namespace (platform convention:
#      operator namespaces carry the same baseline PSA as external-secrets,
#      deploy/eso/base/namespace.yaml).
#   3. the standard prometheus.io/* pod annotations: the discovery contract
#      the ADR-003 metrics stack (single-node VictoriaMetrics, kubernetes_sd)
#      scrapes — see ../README.md "Metrics".
#   4. explicit resource bounds on the manager, matching upstream's own
#      values, so a future upstream.yaml refresh cannot silently change the
#      reviewed footprint (ADR-003 D1 budget).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - upstream.yaml

images:
  - name: ghcr.io/cloudnative-pg/cloudnative-pg
    newTag: 1.30.0
    digest: sha256:a2701eb97cdd2a34b1fdb2cb51987f544b706e40bec72ae7146cd8580efefebb

patches:
  # Baseline PSA, same as the external-secrets operator namespace
  # (deploy/eso/base/namespace.yaml). The manager pod already satisfies
  # restricted (non-root 10001, all capabilities dropped, read-only root
  # filesystem, RuntimeDefault seccomp); baseline is the platform convention
  # for operator namespaces and leaves room for upstream helpers.
  - target:
      version: v1
      kind: Namespace
      name: cnpg-system
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cnpg-system
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: baseline
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cnpg-controller-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cnpg-controller-manager
        namespace: cnpg-system
      spec:
        template:
          metadata:
            annotations:
              # Metrics discovery (ADR-003): the controller-manager serves
              # Prometheus text on the container's "metrics" port (8080).
              prometheus.io/scrape: "true"
              prometheus.io/port: "8080"
          spec:
            containers:
              - name: manager
                env:
                  - name: OPERATOR_IMAGE_NAME
                    value: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.0@sha256:a2701eb97cdd2a34b1fdb2cb51987f544b706e40bec72ae7146cd8580efefebb
                # Upstream v1.30.0's own bounds, re-asserted so bundle
                # refreshes keep the reviewed footprint: 100m/100Mi
                # requested, 100m/200Mi capped — a rounding error against
                # the machine's ~4.2Gi request headroom (ADR-003 D1).
                resources:
                  requests:
                    cpu: 100m
                    memory: 100Mi
                  limits:
                    cpu: 100m
                    memory: 200Mi
