# Vendored upstream bundle (cnpg-1.30.0.yaml from the GitHub release); never
# hand-edit upstream.yaml. Local changes: digest pin (also fed to
# OPERATOR_IMAGE_NAME), baseline PSA, scrape annotations, resource bounds.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - upstream.yaml

images:
  - name: ghcr.io/cloudnative-pg/cloudnative-pg
    newTag: 1.30.0
    digest: sha256:a2701eb97cdd2a34b1fdb2cb51987f544b706e40bec72ae7146cd8580efefebb

patches:
  - target:
      version: v1
      kind: Namespace
      name: cnpg-system
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cnpg-system
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: baseline
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cnpg-controller-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cnpg-controller-manager
        namespace: cnpg-system
      spec:
        template:
          metadata:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "8080"
          spec:
            containers:
              - name: manager
                env:
                  - name: OPERATOR_IMAGE_NAME
                    value: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.0@sha256:a2701eb97cdd2a34b1fdb2cb51987f544b706e40bec72ae7146cd8580efefebb
                # Upstream's values, pinned so a bundle refresh can't drift.
                resources:
                  requests:
                    cpu: 100m
                    memory: 100Mi
                  limits:
                    cpu: 100m
                    memory: 200Mi
