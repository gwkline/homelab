# Vendored upstream bundle (the GitHub release's cnpg-1.30.2.yaml, reformatted
# with oxfmt — the repo formats every file); never hand-edit upstream.yaml.
# Local changes: digest pin (also fed to OPERATOR_IMAGE_NAME), baseline PSA,
# scrape annotations, resource bounds.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - upstream.yaml

images:
  - name: ghcr.io/cloudnative-pg/cloudnative-pg
    newTag: 1.30.2
    digest: sha256:f96f6be3d81ec93819b443c665c575c609342fca840df90d4d87dae314a5b913

patches:
  - target:
      version: v1
      kind: Namespace
      name: cnpg-system
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cnpg-system
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: baseline
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cnpg-controller-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cnpg-controller-manager
        namespace: cnpg-system
      spec:
        template:
          metadata:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "8080"
          spec:
            containers:
              - name: manager
                env:
                  - name: OPERATOR_IMAGE_NAME
                    value: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.2@sha256:f96f6be3d81ec93819b443c665c575c609342fca840df90d4d87dae314a5b913
                # Upstream's values, pinned so a bundle refresh can't drift.
                resources:
                  requests:
                    cpu: 100m
                    memory: 100Mi
                  limits:
                    cpu: 100m
                    memory: 200Mi

components:
  - ../../components/labels
