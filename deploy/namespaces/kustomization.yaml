apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The cluster's namespaces (agents, sandbox, database) with their PSA and
# sigstore include labels. Wrapping the multi-doc file in a Kustomization
# lets the root entry point (clusters/home) compose it — kustomize can only
# reference directories outside its root, never bare files.
resources:
  - namespaces.yaml
