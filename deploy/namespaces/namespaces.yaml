apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Opts into image-signature verification (deploy/image-policy).
    policy.sigstore.dev/include: "true"
---
# Throwaway Jobs (factory, chaos); egress is public-internet only.
# Enforces baseline until the factory worker Job sets runAsNonRoot and a
# seccomp profile; warn and audit already report restricted violations.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    policy.sigstore.dev/include: "true"
---
# Work isolation zone: egress is public-internet only, and the only
# credential is the work-scoped GitHub PAT.
apiVersion: v1
kind: Namespace
metadata:
  name: work
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    policy.sigstore.dev/include: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
