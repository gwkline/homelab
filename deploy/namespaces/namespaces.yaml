apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    # Interactive workloads only — no privileged pods allowed here.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: baseline
    # Opt this namespace into image-signature verification at admission
    # (sigstore policy-controller, issue #91 / ADR-004). Only namespaces
    # with this label are intercepted by the webhook; the policy itself
    # lives in deploy/image-policy/base.
    policy.sigstore.dev/include: "true"
---
# Loop agents live here because nested Docker requires a privileged dind
# sidecar. Isolating them in their own namespace keeps the blast radius of
# that privilege grant contained to throwaway pods.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: baseline
    # Image-signature verification opt-in (see the agents namespace note).
    policy.sigstore.dev/include: "true"
---
# Work-isolation zone (work-t3code): a code runner for employer/work
# repositories. Interactive workloads run here
# behind the same PSA level as `agents`, but the namespace is otherwise
# walled off: default-deny ingress AND egress (deploy/policies/base), with
# egress limited to DNS + the public internet — never the Kubernetes API,
# the LAN, the tailnet, or another homelab service. The only GitHub
# credential synced into this namespace is work-github-token, a PAT scoped
# to the operator's selected work repos (deploy/github-tokens/base/work-github-token.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: work
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: baseline
    # Image-signature verification opt-in (see the agents namespace note).
    policy.sigstore.dev/include: "true"
---
# Dedicated namespace for the PostgreSQL cluster (deploy/postgres). Restricted
# PSA works because CloudNativePG's default pod security context already runs
# non-root with all capabilities dropped (see deploy/postgres/README.md).
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
