# The default ServiceAccounts mount no token. A pod that calls the API gets
# its own ServiceAccount and opts in with automountServiceAccountToken: true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: agents
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: sandbox
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: work
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: database
automountServiceAccountToken: false
