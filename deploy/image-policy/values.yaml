webhook:
  # Image admission must remain available while noncritical work is evicted.
  priorityClass: system-cluster-critical
  failurePolicy: Fail
  # Preserve the existing third-party digest-pinned policy.
  configData:
    no-match-policy: allow
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 16Mi
    limits:
      cpu: 200m
      memory: 512Mi
      ephemeral-storage: 128Mi
# The chart's post-delete hook otherwise fetches a floating kubectl image.
leasescleanup:
  image:
    repository: cgr.dev/chainguard/kubectl
    version: sha256:b209b87e41886d9e83f94472f9ff752744a70e8535ba0cd5ce001415059195e2
commonTolerations:
  - key: node.kubernetes.io/disk-pressure
    operator: Exists
    effect: NoSchedule
