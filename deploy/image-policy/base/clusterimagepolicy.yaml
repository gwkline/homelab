# Homelab images must be signed by CI on main; everything else is unmatched
# and admitted. Enforced only in namespaces labeled policy.sigstore.dev/include.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: homelab-images
spec:
  images:
    - glob: "ghcr.io/gwkline/homelab/**"
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          # Extend this list, never widen it, when a new workflow signs.
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/gwkline/homelab/.github/workflows/ci.yaml@refs/heads/main
      ctlog:
        url: https://rekor.sigstore.dev
