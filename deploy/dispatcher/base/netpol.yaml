# Named egress allowance for the dispatcher (#93). The sandbox-wide egress
# allowlist (deploy/policies/base/networkpolicy.yaml) already grants DNS +
# public internet (GitHub issue polling) to these pods; this adds the one
# private target it needs: the in-cluster Kubernetes API at the
# kubernetes.default ClusterIP (10.43.0.1 under k3s defaults — first IP of
# the service CIDR) so `kubectl` can create Jobs. RBAC (rbac.yaml) scopes
# that identity to sandbox Jobs, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dispatcher-k8s-api
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: dispatch-watcher
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443