# Throwaway loop pod with REAL nested Docker: a docker:dind sidecar daemon
# scoped to this pod only (emptyDir socket — never the host's /var/run).
# Runs in namespace `sandbox` because the sidecar must be privileged; the
# namespace-level Pod Security Admission label is the only place privilege
# is granted, and pods here are ephemeral by design.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loop-example
  namespace: sandbox
spec:
  schedule: "0 9 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: loop-agent
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 120
          # Hard ceiling: a runaway inner build can't starve the node.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Runs as root briefly: waits for the dind daemon, then opens the
            # socket (666) so the unprivileged loop container can use it.
            # Pod-local only — same boundary as the socket itself.
            - name: docker-ready
              image: docker:27-cli
              command:
                - sh
                - -c
                - |
                  i=0
                  while [ "$i" -lt 30 ]; do
                    docker info >/dev/null 2>&1 && break
                    i=$((i+1)); sleep 2
                  done
                  docker info >/dev/null 2>&1 || { echo "dind not ready after 60s" >&2; exit 1; }
                  chmod 666 /var/run/docker.sock
              volumeMounts:
                - name: sock
                  mountPath: /var/run
          containers:
            - name: loop
              image: ghcr.io/gwkline/homelab/loop-agent
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: GITHUB_TOKEN_FILE
                  value: /secrets/token
                - name: GITHUB_WRITER_TOKEN_FILE
                  value: /secrets-writer/token
                - name: WORKSPACE_REPOS
                  valueFrom:
                    configMapKeyRef:
                      name: loop-tasks
                      key: repos
                - name: LOOP_COMMAND
                  valueFrom:
                    configMapKeyRef:
                      name: loop-tasks
                      key: command
                - name: DOCKER_HOST
                  value: unix:///var/run/docker.sock
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: github-token
                  mountPath: /secrets
                  readOnly: true
                - name: github-token-writer
                  mountPath: /secrets-writer
                  readOnly: true
                - name: sock
                  mountPath: /var/run
              resources:
                requests:
                  cpu: "500m"
                  memory: 1Gi
                limits:
                  memory: 4Gi
            - name: dind
              image: docker:27-dind
              command: ["dockerd", "--host=unix:///var/run/docker.sock"]
              securityContext:
                privileged: true # required for nested namespaces/cgroups
              env:
                - name: DOCKER_TLS_CERTDIR # disable TLS: socket stays inside the pod
                  value: ""
              volumeMounts:
                - name: sock
                  mountPath: /var/run
                - name: dind-storage
                  mountPath: /var/lib/docker
              resources:
                requests:
                  cpu: "500m"
                  memory: 1Gi
                limits:
                  memory: 8Gi
          volumes:
            - name: sock
              emptyDir: {}
            - name: dind-storage
              emptyDir:
                sizeLimit: 20Gi
            - name: data
              emptyDir:
                sizeLimit: 5Gi
            - name: github-token
              secret:
                secretName: github-token
                optional: true
            # Optional write-scoped PAT (Contents+PR write on target repos
            # only) enabling loop -> GitHub reporting via gh. Absent by default.
            - name: github-token-writer
              secret:
                secretName: github-token-writer
                optional: true
