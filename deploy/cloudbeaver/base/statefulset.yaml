# All state (users, connections, encrypted credentials) is on the workspace PVC.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudbeaver
  namespace: agents
spec:
  serviceName: cloudbeaver-headless
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 8978
      containers:
        - name: cloudbeaver
          # Upstream doesn't support downgrades; back up the workspace first.
          image: dbeaver/cloudbeaver:26.2.0@sha256:c06c1859700bd9202d9d49ebc10ee2512d745997d05e7ca6423267b227af1ca7
          securityContext:
            runAsNonRoot: true
            runAsUser: 8978
            runAsGroup: 8978
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8978
              name: http
          env:
            # Upstream default is true.
            - name: CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED
              value: "false"
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx768m"
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
            - name: tmp
              mountPath: /tmp
            - name: initial-datasources
              mountPath: /opt/cloudbeaver/conf/initial-data-sources.conf
              subPath: initial-data-sources.conf
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
      initContainers:
        # Root only to chown the volume (local-path ignores fsGroup).
        - name: volume-init
          image: busybox:1.36
          command: ["chown", "-R", "8978:8978", "/opt/cloudbeaver/workspace"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: initial-datasources
          configMap:
            name: cloudbeaver-initial-datasources
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
