# 1Password item (vault homelab): cloudbeaver-admin, fields username and
# password. CloudBeaver reads them only to configure an empty workspace; on a
# configured one, change the password in the admin UI to match.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudbeaver-admin
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: cloudbeaver-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .username | trim }}"
        password: "{{ .password | trim }}"
  data:
    - secretKey: username
      remoteRef:
        key: cloudbeaver-admin/username
    - secretKey: password
      remoteRef:
        key: cloudbeaver-admin/password
