# Credential-free connection seeded only into an empty workspace. To re-seed,
# delete GlobalConfiguration/.dbeaver/data-sources.json and restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbeaver-initial-datasources
  namespace: agents
data:
  initial-data-sources.conf: |
    {
      "folders": {},
      "connections": {
        "factory-postgres": {
          "provider": "postgresql",
          "driver": "postgres-jdbc",
          "name": "Factory PostgreSQL",
          "description": "Factory state/queue DB - least-privilege read-only role",
          "save-password": true,
          "read-only": true,
          "configuration": {
            "host": "postgres-rw.postgres.svc.cluster.local",
            "port": "5432",
            "database": "factory",
            "configurationType": "MANUAL",
            "auth-model": "native"
          }
        }
      }
    }
