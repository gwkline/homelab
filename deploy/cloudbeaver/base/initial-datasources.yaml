# Credential-free connection to the CNPG primary, copied into the workspace
# only on first start (when workspace/.metadata does not exist yet). An
# existing workspace keeps its connections; edit them in the admin UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbeaver-initial-datasources
  namespace: agents
data:
  initial-data-sources.conf: |
    {
      "folders": {},
      "connections": {
        "pg-primary-knowledge": {
          "provider": "postgresql",
          "driver": "postgres-jdbc",
          "name": "Postgres (knowledge)",
          "description": "pg-primary, read-only role cloudbeaver_ro",
          "save-password": true,
          "read-only": true,
          "configuration": {
            "host": "pg-primary-rw.database.svc",
            "port": "5432",
            "database": "knowledge",
            "configurationType": "MANUAL",
            "auth-model": "native"
          }
        }
      }
    }
