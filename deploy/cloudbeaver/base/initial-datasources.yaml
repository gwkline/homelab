# Default connection, seeded into the workspace on first boot by the image's
# run-cloudbeaver-server.sh (only when the workspace has no data-sources.json
# yet). Deliberately credential-free: the operator enters the least-privilege
# role's credentials once, sourced from Secret cloudbeaver-db / the password
# manager; CloudBeaver then stores them encrypted in the workspace. See
# README.md for the full credential chain.
#
# The host is the CNPG read/write Service convention (<cluster>-rw.<ns>).
# Update it when the PostgreSQL cluster lands (#52). Note the seed only runs
# on first boot: to re-seed after changing this ConfigMap, delete the
# workspace's GlobalConfiguration/.dbeaver/data-sources.json and restart the
# pod, or edit the connection in the admin UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbeaver-initial-datasources
  namespace: agents
data:
  initial-data-sources.conf: |
    {
      "folders": {},
      "connections": {
        "factory-postgres": {
          "provider": "postgresql",
          "driver": "postgres-jdbc",
          "name": "Factory PostgreSQL",
          "description": "Factory state/queue DB - least-privilege read-only role",
          "save-password": true,
          "read-only": true,
          "configuration": {
            "host": "postgres-rw.postgres.svc.cluster.local",
            "port": "5432",
            "database": "factory",
            "configurationType": "MANUAL",
            "auth-model": "native"
          }
        }
      }
    }
