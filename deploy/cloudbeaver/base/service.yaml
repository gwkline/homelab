apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver
  namespace: agents
  annotations:
    tailscale.com/hostname: cloudbeaver
    tailscale.com/tags: tag:k8s-operator
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: cloudbeaver
  ports:
    # The panel's Dev Tools health probe expects port 80.
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver-headless
  namespace: agents
spec:
  clusterIP: None
  selector:
    app: cloudbeaver
  ports:
    - name: http
      port: 8978
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-cloudbeaver
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: cloudbeaver
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 8978
---
# Egress: DNS and the CNPG primary only (JDBC drivers ship in the image).
# kube-router filters after DNAT, so pg-primary-rw resolves to the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudbeaver-egress-db-only
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: cloudbeaver
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              cnpg.io/cluster: pg-primary
              cnpg.io/instanceRole: primary
      ports:
        - { protocol: TCP, port: 5432 }
