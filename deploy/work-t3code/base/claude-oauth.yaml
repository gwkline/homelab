# Token from `claude setup-token` (the in-pod login can't complete headless).
# 1Password item: work-claude-oauth/token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: work-claude-oauth
  namespace: work
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: work-claude-oauth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token | trim }}"
  data:
    - secretKey: token
      remoteRef:
        key: work-claude-oauth/token
