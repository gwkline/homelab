# Governs the StatefulSet's pod identity. Headless: DNS resolves to pod IPs
# and the declared port is what Homepage's siteMonitor targets.
apiVersion: v1
kind: Service
metadata:
  name: work-t3code-headless
  namespace: work
spec:
  clusterIP: None
  selector:
    app: work-t3code
  ports:
    - name: http
      port: 3773
      targetPort: http
---
# Tailnet exposure, same pattern as t3code-0:
# https://work-t3code-0.<tailnet>.ts.net via a Tailscale Ingress.
apiVersion: v1
kind: Service
metadata:
  name: work-t3code-0
  namespace: work
spec:
  type: ClusterIP
  selector:
    app: work-t3code
    statefulset.kubernetes.io/pod-name: work-t3code-0
  ports:
    - name: http
      port: 3773
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: work-t3code-0
  namespace: work
  annotations:
    tailscale.com/tags: tag:k8s-operator
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: work-t3code-0
      port:
        number: 3773
  tls:
    - hosts: [work-t3code-0]
