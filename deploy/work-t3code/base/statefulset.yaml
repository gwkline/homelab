# Isolated t3code for work repos: only the work-scoped PAT, no skills-sync,
# no Executor, no ServiceAccount token, public-internet-only egress.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: work-t3code
  namespace: work
spec:
  serviceName: work-t3code-headless
  # Keep at 1: t3state is a single standalone RWO claim (t3state-pvc.yaml).
  replicas: 1
  selector:
    matchLabels:
      app: work-t3code
  template:
    metadata:
      labels:
        app: work-t3code
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: work-t3code
          image: ghcr.io/gwkline/homelab/t3code:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3773
              name: http
          env:
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            # In the Secret so this public repo has no work identifiers.
            # Required: fail closed rather than boot an empty workspace.
            - name: WORKSPACE_REPOS
              valueFrom:
                secretKeyRef:
                  name: work-github-token
                  key: repos
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: work-claude-oauth
                  key: token
            - name: DEPOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: work-depot-token
                  key: token
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: t3state
              mountPath: /home/node/.t3
            - name: work-github-token
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
      initContainers:
        # Root only to chown the volume for uid 1000.
        - name: volume-init
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["chown", "-R", "1000:1000", "/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: work-github-token
          secret:
            secretName: work-github-token
            optional: true
        - name: t3state
          persistentVolumeClaim:
            claimName: t3state-work-t3code-0
  volumeClaimTemplates:
    # Repo workspaces; disposable, they re-clone.
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
