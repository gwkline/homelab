# work-t3code: an isolated t3code runner for employer/work repositories.
#
# Same image as the personal t3code (apps/t3code), deployed as a separate
# StatefulSet in the `work` namespace with a dedicated, narrowly-scoped
# GitHub credential. The isolation contract (see README.md):
#   - Only Secret `work-github-token` is mounted: a fine-grained PAT whose
#     repository access is limited to the operator's selected work repos
#     (repo list and token both live in 1Password — this public repo carries
#     no work identifiers). It cannot read any personal repo, and no
#     personal credential is reachable from this pod.
#   - No skills-sync (private personal skills stay out of work sessions) and
#     no Executor MCP registration (no gateway into the personal cluster's
#     factory tooling).
#   - Egress is public-internet-only at the namespace level
#     (deploy/policies/base): GitHub/npm/model APIs yes; Kubernetes API,
#     LAN, tailnet, and every other homelab service no.
#   - Work PVCs are deliberately absent from deploy/backup/base — work code
#     and work credentials never land in the personal restic/B2 backups.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: work-t3code
  namespace: work
spec:
  serviceName: work-t3code-headless
  # One replica by design: the t3state claim (see volumes) is
  # replica-specific — t3state-work-t3code-0, ReadWriteOnce — so a second
  # replica would have to mount the same PVC. Keep this at 1 (same reasoning
  # as the personal t3code StatefulSet).
  replicas: 1
  selector:
    matchLabels:
      app: work-t3code
  template:
    metadata:
      labels:
        app: work-t3code
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: work-t3code
          # Same digest as the personal t3code StatefulSet — same image,
          # same admission signature check, different namespace/credentials.
          # Renovate bumps this pin with the other homelab image digests.
          image: ghcr.io/gwkline/homelab/t3code@sha256:42ddfbf8b0c60b313bc1aefcf79a950694f653dfe7f7045795d5516a1c2a3333
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3773
              name: http
          env:
            # The ONLY GitHub credential in this pod: Secret work-github-token
            # (ExternalSecret -> 1Password item work-github-writer), a
            # fine-grained PAT scoped to the selected work repos with
            # Contents + Pull requests read/write. The entrypoint bridges it
            # into gh/git for clone AND push; no personal token is mounted.
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            # Workspace repo list rides in the same Secret (key `repos`,
            # one URL per line) instead of a committed ConfigMap, so the
            # public repository carries no work identifiers. Deliberately
            # NOT optional: without the scoped credential the runner must
            # fail closed (pod stays in CreateContainerConfigError until
            # ESO syncs) rather than boot an empty workspace.
            - name: WORKSPACE_REPOS
              valueFrom:
                secretKeyRef:
                  name: work-github-token
                  key: repos
            # Claude Code headless auth (see claude-oauth.yaml): long-lived
            # token minted by `claude setup-token`, read fresh by every
            # claude session. Non-optional on purpose — without it the
            # runner's claude is dead weight, so fail closed like the
            # credential above. Rotating = update the 1Password item, wait
            # for ESO (≤1h), then rollout restart this StatefulSet.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: work-claude-oauth
                  key: token
            # Depot build token (see depot-token.yaml). Optional: the item
            # may be absent — the depot CLI stays inert and the runner
            # boots regardless. Materializes as soon as the 1Password
            # item exists (env then lands on the next rollout restart).
            - name: DEPOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: work-depot-token
                  key: token
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            # t3code state (environment-id, pairings, sessions, agent creds).
            # Standalone PVC declared in t3state-pvc.yaml — deliberately NOT
            # backed up by deploy/backup/base (work credentials stay out of
            # the personal B2 bucket; a lost node means re-pairing the
            # browser session and re-logging the CLIs, not data loss).
            - name: t3state
              mountPath: /home/node/.t3
            - name: work-github-token
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
      initContainers:
        # Runs as root only to fix volume ownership, then exits. Main
        # containers run as uid 1000 regardless of provisioner fsGroup support.
        # No skills-sync init container here by design: the personal private
        # skills repo is authenticated by the personal read token, which this
        # pod does not have — and personal skills stay out of work sessions.
        - name: volume-init
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["chown", "-R", "1000:1000", "/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: work-github-token
          secret:
            secretName: work-github-token
            optional: true
        # Single authoritative claim declaration for the work runner's own
        # state dir. Same reasoning as the personal t3code: no volumeClaim-
        # template for t3state (VCTs are immutable after creation); the claim
        # name carries the replica ordinal and the workload is capped at one
        # replica.
        - name: t3state
          persistentVolumeClaim:
            claimName: t3state-work-t3code-0
  volumeClaimTemplates:
    # /data only (repo workspaces — churn is recoverable, they re-clone).
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
