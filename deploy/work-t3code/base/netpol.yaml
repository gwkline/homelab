apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-work-t3code
  namespace: work
spec:
  podSelector:
    matchLabels:
      app: work-t3code
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3773
