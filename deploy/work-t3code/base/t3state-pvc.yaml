# t3code state: environment id, browser pairings, sessions, agent credentials.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: t3state-work-t3code-0
  namespace: work
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
