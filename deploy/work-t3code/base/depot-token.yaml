# Depot build token for the work runner (optional by design).
#
# Work CI builds images with `depot bake` on Depot-hosted runners; the
# CLI ships in the image, and this token lets runner agents reproduce and
# inspect those builds. Mirrors the github-token-writer pattern: the item
# may not exist yet — the ExternalSecret then stays Ready=False and keeps
# retrying, the documented expected state, and the StatefulSet mounts the
# env optional so the runner boots regardless.
#
# 1Password item contract (docs/secrets-inventory.md B6):
#   vault:  homelab
#   item:   work-depot-token   field: token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: work-depot-token
  namespace: work
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: work-depot-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token | trim }}"
  data:
    - secretKey: token
      remoteRef:
        key: work-depot-token/token
