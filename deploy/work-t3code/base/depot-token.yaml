# Optional: without the work-depot-token item this stays Ready=False and the
# runner boots without DEPOT_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: work-depot-token
  namespace: work
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: work-depot-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token | trim }}"
  data:
    - secretKey: token
      remoteRef:
        key: work-depot-token/token
