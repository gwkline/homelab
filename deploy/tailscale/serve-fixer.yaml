# t3code serve-fixer: ServiceAccount, RBAC, and Deployment for the t3code
# proxy only. The panel fixer has its own ServiceAccount/Role
# (panel-serve-fixer.yaml) so the two mechanisms stay independently
# revocable. Least privilege per issue #32: no pods/log, no write verbs
# other than pods/exec create, and the only cross-namespace read is the
# t3code-0 pod's own IP, name-pinned below. The unavoidable residual —
# pods/exec create stays namespace-scoped, because the operator generates
# proxy pod names (ts-<parent>-<rand>) that RBAC cannot pin — is documented
# in deploy/tailscale/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serve-fixer
  namespace: tailscale
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: serve-fixer
  namespace: tailscale
rules:
  # Discovery only (read-only): proxy pod names are operator-generated, so
  # the fixer must list pods to find the one carrying the t3code
  # parent-resource labels (see serve-fixer-cm.yaml).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The repair primitive (`tailscale serve` inside the t3code proxy pod).
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: serve-fixer
  namespace: tailscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: serve-fixer
subjects:
  - kind: ServiceAccount
    name: serve-fixer
---
# Read-only access to the t3code app pod's IP from the agents namespace,
# pinned to the StatefulSet pod's stable name — the fixer cannot read any
# other workload's pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: serve-fixer-app-reader
  namespace: agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["t3code-0"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: serve-fixer-app-reader
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: serve-fixer-app-reader
subjects:
  - kind: ServiceAccount
    name: serve-fixer
    namespace: tailscale
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3code-serve-fixer
  namespace: tailscale
  labels:
    app.kubernetes.io/name: t3code-serve-fixer
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t3code-serve-fixer
  template:
    metadata:
      labels:
        app: t3code-serve-fixer
    spec:
      serviceAccountName: serve-fixer
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixer
