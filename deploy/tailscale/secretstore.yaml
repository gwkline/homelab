# Namespace-scoped SecretStore for the dedicated homelab 1Password vault
# (one store per namespace — see deploy/github-tokens/base/secretstore.yaml;
# issue #41 covers the ESO install + bootstrap of the service-account token,
# the only manually created secret for this provider).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
  namespace: tailscale
spec:
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          key: token
