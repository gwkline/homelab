apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The operator itself is helm-installed with values.yaml (README.md).
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - operator-oauth.yaml
