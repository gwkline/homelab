apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tailscale stack: the namespace and the operator's 1Password-backed OAuth
# Secret (operator-oauth). The operator itself is helm-installed with
# deploy/tailscale/values.yaml (see README.md).

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - secretstore.yaml
  - operator-oauth.yaml
