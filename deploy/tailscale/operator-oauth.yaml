# Secret operator-oauth, which the chart mounts at /oauth when
# oauth.clientId is unset. 1Password item: tailscale-operator-oauth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    # Name is hardcoded in the chart.
    name: operator-oauth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client_id: "{{ .client_id | trim }}"
        client_secret: "{{ .client_secret | trim }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-operator-oauth/client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale-operator-oauth/client_secret
