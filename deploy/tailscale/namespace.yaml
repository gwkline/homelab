# The LoadBalancer-class proxies run privileged containers (sysctler and
# tailscale) to set up kernel forwarding; Ingress proxies and the operator pass
# baseline.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
