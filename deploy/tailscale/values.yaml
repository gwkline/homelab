# tailscale-operator chart 1.102.3. OAuth stays empty: the chart then mounts
# the ESO-synced Secret operator-oauth. Set proxy tags here, never via
# operatorConfig.extraEnv (duplicate PROXY_TAGS env fails the release).
oauth:
  clientId: ""
  clientSecret: ""

proxyConfig:
  # The OAuth client and tailnet tagOwners must own this tag.
  defaultTags: "tag:k8s-operator"
