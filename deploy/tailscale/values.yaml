# tailscale-operator chart 1.104.7. OAuth stays empty: the chart then mounts
# the ESO-synced Secret operator-oauth. Set proxy tags here, never via
# operatorConfig.extraEnv (duplicate PROXY_TAGS env fails the release).
oauth:
  clientId: ""
  clientSecret: ""

# Images match the chart's appVersion. The chart renders `repository@digest`
# whenever a digest is set; the tag records which release it is.
operatorConfig:
  image:
    repository: tailscale/k8s-operator
    tag: v1.104.7
    digest: sha256:51ba104ff02afcc39f93189415c8b2f44fb6037e8592d626bfa52c3c8afc02f6
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Every UI is reached through it (deploy/policies/base/priorityclasses.yaml).
  priorityClassName: homelab-platform

proxyConfig:
  # The OAuth client and tailnet tagOwners must own this tag.
  defaultTags: "tag:k8s-operator"
  image:
    repository: tailscale/tailscale
    tag: v1.104.7
    digest: sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
  # deploy/tailscale/proxyclass.yaml: resource bounds for every proxy.
  defaultProxyClass: homelab
