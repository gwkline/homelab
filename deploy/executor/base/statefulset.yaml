# One process over a SQLite file in /data (state and generated encryption keys).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: executor
  namespace: agents
spec:
  serviceName: executor
  replicas: 1
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: executor
          image: ghcr.io/usefulsoftwareco/executor-selfhost:1.6.7@sha256:c8dd83a5dba8ac992dfe1ded4aa65ae4e7f52ec31fddbe2af5b49ffebe5bbfa7
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 4788
              name: http
          env:
            # Browser logins require the exact browser origin.
            - name: TAILNET_NAME
              valueFrom:
                configMapKeyRef:
                  name: homepage-env
                  key: tailnet-name
                  optional: true
            - name: EXECUTOR_WEB_BASE_URL
              value: https://executor.$(TAILNET_NAME)
            # Optional headless admin; otherwise first-run setup in the browser.
            - name: EXECUTOR_BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: executor-admin
                  key: email
                  optional: true
            - name: EXECUTOR_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: executor-admin
                  key: password
                  optional: true
            # Upstream defaults, pinned as intent.
            - name: EXECUTOR_ALLOW_LOCAL_NETWORK
              value: "false"
            - name: EXECUTOR_ALLOW_STDIO_MCP
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
