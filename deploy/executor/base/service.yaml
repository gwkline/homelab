# The panel's health check probes port 8080.
apiVersion: v1
kind: Service
metadata:
  name: executor
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: executor
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# https://executor.<tailnet>: web UI and /mcp for laptop clients.
apiVersion: v1
kind: Service
metadata:
  name: executor-tailnet
  namespace: agents
  annotations:
    tailscale.com/hostname: executor
    tailscale.com/tags: tag:k8s-operator
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: executor
  ports:
    - name: https
      port: 443
      targetPort: http
