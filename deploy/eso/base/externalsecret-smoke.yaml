# Provider-independent smoke test: syncs one key from the fake SecretStore
# into a real Kubernetes Secret. Proves the controller reconciles end to end
# without any external credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-smoke
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: eso-placeholder
  target:
    name: eso-smoke-output
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: smoke-password
