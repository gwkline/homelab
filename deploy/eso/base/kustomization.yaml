apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - eso.yaml
  - metrics.yaml

# Every workload's credentials come through ESO, so its pods are platform
# priority (deploy/policies/base/priorityclasses.yaml). The PriorityClass
# must exist before this base is applied (docs/rebuild-runbook.md 3.2).
patches:
  - target:
      group: apps
      kind: Deployment
      namespace: external-secrets
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: homelab-platform
  # The 1Password SDK provider is memory-heavy: a controller restart
  # reconciles every ExternalSecret at once and peaks above the bundle's
  # 256Mi limit (OOMKilled in a loop on 2026-10-08).
  - target:
      group: apps
      kind: Deployment
      namespace: external-secrets
      name: external-secrets
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi

components:
  - ../../components/labels
