# Placeholder SecretStore until real provider credentials land via issue #41.
#
# Uses the ESO "fake" provider (static key/value pairs, no credentials) so the
# operator has a live reconciliation loop to prove health. When 1Password
# Connect credentials exist, add a second SecretStore (or ClusterSecretStore)
# with provider.onePasswordSDK / onepassword-connect pointing at a Secret
# holding the real token, and repoint ExternalSecrets at it. Do NOT edit this
# file to carry real credentials — it is intentionally fake-only.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: eso-placeholder
  namespace: external-secrets
spec:
  provider:
    fake:
      data:
        - key: smoke-password
          value: eso-smoke-ok
