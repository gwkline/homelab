# Placeholder SecretStore from issue #38, kept intentionally on the ESO "fake"
# provider (static key/value pairs, no credentials) so the operator has a live
# reconciliation loop to prove health without any external dependency.
# The real 1Password SDK stores for issue #41 live next to their consumers:
# deploy/github-tokens/base/secretstore.yaml (agents, sandbox) and
# deploy/tailscale/secretstore.yaml. Do NOT edit this file to carry real
# credentials — it is intentionally fake-only.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: eso-placeholder
  namespace: external-secrets
spec:
  provider:
    fake:
      data:
        - key: smoke-password
          value: eso-smoke-ok
