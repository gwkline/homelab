# Provider-independent smoke store: the ESO "fake" provider (static
# key/value pairs, no credentials) gives the operator a live reconciliation
# loop that proves controller health with zero external credentials
# (issue #38).
#
# The real provider path (issue #41) is the `onepasswordSDK` SecretStore
# `onepassword` per namespace (deploy/github-tokens/base/secretstore.yaml,
# deploy/tailscale/secretstore.yaml) with its own smoke ExternalSecret
# (deploy/github-tokens/base/onepassword-smoke.yaml). This fake store stays
# alongside it as a credential-free canary. Do NOT edit this file to carry
# real credentials — it is intentionally fake-only.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: eso-placeholder
  namespace: external-secrets
spec:
  provider:
    fake:
      data:
        - key: smoke-password
          value: eso-smoke-ok
