apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    # Interactive workloads only — no privileged pods allowed here.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
---
# Loop agents live here because nested Docker requires a privileged dind
# sidecar. Isolating them in their own namespace keeps the blast radius of
# that privilege grant contained to throwaway pods.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
