# Headlamp: read-only cluster web UI, tailnet-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      automountServiceAccountToken: true # deliberate exception, scoped by rbac.yaml
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.45.0
          args:
            - -in-cluster
            # Every user acts as the read-only SA. Upstream calls this unsafe
            # without an auth proxy; the tailnet is that proxy.
            - -unsafe-use-service-account-token
          securityContext:
            runAsNonRoot: true
            runAsUser: 100 # headlamp user baked into the upstream image
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 4466
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
