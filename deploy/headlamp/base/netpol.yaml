# Workload-owned exposure rule. Default-deny ingress lives in policies/base;
# the only path in is the Tailscale operator's proxies. Tailnet identity is
# the auth layer, same model as every other UI here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-headlamp
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: headlamp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 4466
---
# Egress narrowed below the namespace baseline (agents egress is otherwise
# open): the Headlamp backend needs DNS and the Kubernetes API — nothing
# else. The API is the kubernetes.default ClusterIP (10.43.0.1 under k3s
# defaults — first IP of the service CIDR), same allowance as dispatcher.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-egress
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: headlamp
  policyTypes: [Egress]
  egress:
    - to: # DNS: kube-dns pods only (k3s coredns carries this label)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to: # Kubernetes API: in-cluster ClusterIP AND the node IP the external
        # kubeconfig uses. kube-router enforces netpol on the FORWARD path, and
        # post-DNAT egress sees the node IP — allowing only 10.43.0.1 leaves
        # the backend dialing 192.168.1.2:443 refused. Both ports: 443 is the
        # ClusterIP service port, 6443 the node's API port.
        - ipBlock:
            cidr: 10.43.0.1/32
        - ipBlock:
            cidr: 192.168.1.2/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
