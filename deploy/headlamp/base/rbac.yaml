# Read-only: no secrets or ConfigMaps (some hold credentials), no
# exec/attach/portforward, no node/service proxy, no debug or log endpoints.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-readonly
rules:
  - apiGroups: [""]
    resources:
      [
        "pods",
        "pods/status",
        "pods/log",
        "events",
        "namespaces",
        "nodes",
        "services",
      ]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # Health, version and discovery only; "*" would also allow /debug/pprof
  # and /logs.
  - nonResourceURLs:
      ["/healthz", "/livez", "/readyz", "/version", "/api", "/apis"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-readonly
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: agents
