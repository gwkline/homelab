# Hermes' Kubernetes identity, after routing factory orchestration through
# the Executor MCP gateway (#82): hermes no longer creates or deletes
# Kubernetes workloads at all — factory work is requested via the governed
# Executor tools (see executor.yaml + cluster-guide.yaml). What remains is
# read-only and separately justified below. It cannot touch secrets, CRDs,
# or other namespaces' workloads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: agents
---
# Self-visibility: lets hermes report on the workloads that host it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-self-viewer
  namespace: agents
rules:
  - apiGroups: ["", "apps", "batch"]
    resources:
      [
        "pods",
        "pods/log",
        "services",
        "statefulsets",
        "jobs",
        "cronjobs",
        "configmaps",
      ]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-self-viewer
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-self-viewer
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: agents
---
# Cluster health (retained, justified): read-only nodes + metrics so hermes
# can answer "is the cluster healthy?" without writing anything. Nodes expose
# no secret material via get/list/watch; every write path stays with the
# operator and the panel.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-cluster-reader
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: agents
---
# Shared sandbox workload verbs for automation that still writes Jobs
# directly (dispatcher, panel). Hermes is deliberately NOT bound to this
# role anymore (#82): its factory orchestration goes through Executor,
# which holds the Kubernetes credentials host-side.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loop-manager
  namespace: sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
