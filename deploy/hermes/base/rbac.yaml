# Hermes' Kubernetes identity, after routing factory orchestration through
# the Executor MCP gateway (#82): hermes no longer creates or deletes
# Kubernetes workloads at all — factory work is requested via the governed
# Executor tools (see executor.yaml + cluster-guide.yaml). What remains is
# read-only and separately justified below. It cannot touch secrets, CRDs,
# or other namespaces' workloads.
#
# Issue #26 — hermes' permissions are documented here, separately from the
# other principals. CronJob mutation is NOT required: the last write path
# was removed in #82, and hermes has no Role granting create/patch/delete
# on Jobs or CronJobs in any namespace. The shared `loop-manager` Role that
# used to live here is gone — dispatcher and panel define purpose-scoped
# Roles in their own bases (deploy/dispatcher/base, deploy/panel/base).
# One-time cleanup after applying this change:
#   kubectl -n sandbox delete role loop-manager
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: agents
---
# Self-visibility: lets hermes report on the workloads that host it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-self-viewer
  namespace: agents
rules:
  - apiGroups: ["", "apps", "batch"]
    resources:
      [
        "pods",
        "pods/log",
        "services",
        "statefulsets",
        "jobs",
        "cronjobs",
        "configmaps",
      ]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-self-viewer
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-self-viewer
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: agents
---
# Cluster health: read-only nodes + metrics so hermes can answer "is the
# cluster healthy?" without writing anything. Nodes expose no secret
# material via get/list/watch; every write path stays with the operator,
# the panel, and the Executor gateway.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-cluster-reader
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: agents
