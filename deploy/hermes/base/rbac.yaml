# Read-only. Factory work goes through Executor, never the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-self-viewer
  namespace: agents
rules:
  - apiGroups: ["", "apps", "batch"]
    resources:
      [
        "pods",
        "pods/log",
        "services",
        "statefulsets",
        "jobs",
        "cronjobs",
        "configmaps",
      ]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-self-viewer
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-self-viewer
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-cluster-reader
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: agents
