apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: agents
spec:
  serviceName: hermes-headless
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      # Hermes intentionally holds a ServiceAccount token. Its RBAC (rbac.yaml)
      # scopes that identity to managing throwaway Jobs/CronJobs in `sandbox`
      # — nothing else, anywhere.
      serviceAccountName: hermes
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: volume-init
          image: busybox:1.36
          command: ["chown", "-R", "1000:1000", "/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /data
        # Skills sync: clone gwkline/.dotfiles at SYNC_REF and run the repo's
        # own `dot install` (allowlist manifest + secret scan) into
        # $HERMES_HOME/skills. Degrades explicitly on failure (#81): records
        # skills-sync/status.json and exits 0 — the gateway starts on stale
        # skills rather than refusing to boot during a GitHub outage.
        - name: skills-sync
          image: ghcr.io/gwkline/homelab/hermes
          imagePullPolicy: Always
          command: ["/opt/hermes/.venv/bin/python3", "/config/skills-sync.py"]
          env:
            - name: HERMES_HOME
              value: /data/hermes
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: SYNC_REF
              valueFrom:
                configMapKeyRef:
                  name: hermes-skills-sync
                  key: ref
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: github-token
              mountPath: /secrets
              readOnly: true
            - name: skills-sync-config
              mountPath: /config
              readOnly: true
      containers:
        - name: hermes
          image: ghcr.io/gwkline/homelab/hermes
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /data/home
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: WORKSPACE_REPOS
              valueFrom:
                configMapKeyRef:
                  name: hermes-workspaces
                  key: repos
            - name: HERMES_COMMAND
              valueFrom:
                configMapKeyRef:
                  name: hermes-workspaces
                  key: command
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: guide
              mountPath: /data/guide
              readOnly: true
            - name: github-token
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: github-token
          secret:
            secretName: github-token
            optional: true
        - name: guide
          configMap:
            name: hermes-cluster-guide
        - name: skills-sync-config
          configMap:
            name: hermes-skills-sync
            items:
              - key: sync.py
                path: skills-sync.py
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
