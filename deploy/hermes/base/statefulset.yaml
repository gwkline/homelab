apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: agents
spec:
  serviceName: hermes-headless
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      # Hermes' ServiceAccount token is NOT for factory orchestration (#82):
      # that now goes through the Executor MCP endpoint with its own client
      # identity (EXECUTOR_* below, credentials host-side in Executor). The
      # token only backs the read-only RBAC in rbac.yaml — self-visibility
      # and cluster-health reads.
      serviceAccountName: hermes
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: volume-init
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["chown", "-R", "1000:1000", "/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /data
        # Skills sync (#81): apps/shared/skills-lib.sh clones the private
        # skills repo at the pinned commit from hermes-skills-sync (token
        # answered via throwaway GIT_ASKPASS — nothing lands in Git config),
        # verifies the pin, and installs only the allowlisted skill paths
        # into the generated store $HERMES_HOME/skills-generated, then links
        # them into $HERMES_HOME/skills. The link step only manages its own
        # symlinks — a pre-existing real entry from the earlier `dot install`
        # era is reported and left untouched (remove it manually once, if a
        # collision is reported). Degrades explicitly on failure: records
        # skills-sync/status.json and always exits 0 — the gateway starts on
        # stale skills rather than refusing to boot during a GitHub outage;
        # run-hermes.sh prints the fresh/stale line loudly at boot.
        - name: skills-sync
          image: ghcr.io/gwkline/homelab/hermes@sha256:af23d67fc4baf8821cb2e777dcf1892cdb98a5836ca7e5187b938562e7deda17
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              if sh /usr/local/lib/skills-lib.sh; then
                echo "[skills-sync] OK"
              else
                echo "[skills-sync] FAILED (degraded) — see ${HERMES_HOME}/skills-sync/status.json; pod continues on stale skills" >&2
              fi
              exit 0
          env:
            - name: HOME
              value: /tmp
            - name: HERMES_HOME
              value: /data/hermes
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: SKILLS_REF
              valueFrom:
                configMapKeyRef:
                  name: hermes-skills-sync
                  key: ref
            - name: SKILLS_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: hermes-skills-sync
                  key: allowlist
            - name: SKILLS_TARGET
              value: /data/hermes/skills-generated
            - name: SKILLS_STATUS_FILE
              value: /data/hermes/skills-sync/status.json
            - name: SKILLS_LINK_DIRS
              value: /data/hermes/skills
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: github-token
              mountPath: /secrets
              readOnly: true
      containers:
        - name: hermes
          image: ghcr.io/gwkline/homelab/hermes@sha256:af23d67fc4baf8821cb2e777dcf1892cdb98a5836ca7e5187b938562e7deda17
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /data/home
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            # gh CLI + git credential helpers read GH_TOKEN; the token is the
            # same fine-grained PAT the factory uses (secret github-token).
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: WORKSPACE_REPOS
              valueFrom:
                configMapKeyRef:
                  name: hermes-workspaces
                  key: repos
            - name: HERMES_COMMAND
              valueFrom:
                configMapKeyRef:
                  name: hermes-workspaces
                  key: command
                  optional: true
            # Executor MCP gateway (#82): factory orchestration happens
            # through these governed tools — create/inspect/cancel/retry Run
            # — never through direct Kubernetes writes. The token is
            # optional so the gateway boots before Executor is deployed;
            # see deploy/hermes/base/README.md for provisioning.
            - name: EXECUTOR_MCP_URL
              valueFrom:
                configMapKeyRef:
                  name: hermes-executor
                  key: mcp-url
            - name: EXECUTOR_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: hermes-executor
                  key: client-id
            - name: EXECUTOR_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: executor-client
                  key: token
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: guide
              mountPath: /data/guide
              readOnly: true
            - name: github-token
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: github-token
          secret:
            secretName: github-token
            optional: true
        - name: guide
          configMap:
            name: hermes-cluster-guide
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
