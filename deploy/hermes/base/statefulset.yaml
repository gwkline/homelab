apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: agents
spec:
  serviceName: hermes-headless
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: volume-init
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["chown", "-R", "1000:1000", "/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /data
        # Installs the allowlisted skills at the pinned ref. Always exits 0:
        # on failure the gateway starts on stale skills.
        - name: skills-sync
          image: ghcr.io/gwkline/homelab/hermes:latest
          command:
            - sh
            - -c
            - |
              if sh /usr/local/lib/skills-lib.sh; then
                echo "[skills-sync] OK"
              else
                echo "[skills-sync] FAILED (degraded) — see ${HERMES_HOME}/skills-sync/status.json; pod continues on stale skills" >&2
              fi
              exit 0
          env:
            - name: HOME
              value: /tmp
            - name: HERMES_HOME
              value: /data/hermes
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: SKILLS_REF
              valueFrom:
                configMapKeyRef:
                  name: hermes-skills-sync
                  key: ref
            - name: SKILLS_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: hermes-skills-sync
                  key: allowlist
            - name: SKILLS_TARGET
              value: /data/hermes/skills-generated
            - name: SKILLS_STATUS_FILE
              value: /data/hermes/skills-sync/status.json
            - name: SKILLS_LINK_DIRS
              value: /data/hermes/skills
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: github-token
              mountPath: /secrets
              readOnly: true
      containers:
        - name: hermes
          image: ghcr.io/gwkline/homelab/hermes:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # On the PVC so CLI logins (.claude, .codex) survive rollouts.
            - name: HOME
              value: /data/home
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: WORKSPACE_REPOS
              valueFrom:
                configMapKeyRef:
                  name: hermes-workspaces
                  key: repos
            - name: HERMES_COMMAND
              valueFrom:
                configMapKeyRef:
                  name: hermes-workspaces
                  key: command
                  optional: true
            - name: EXECUTOR_MCP_URL
              valueFrom:
                configMapKeyRef:
                  name: hermes-executor
                  key: mcp-url
            - name: EXECUTOR_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: hermes-executor
                  key: client-id
            - name: EXECUTOR_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: executor-client
                  key: token
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: guide
              mountPath: /data/guide
              readOnly: true
            - name: github-token
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: github-token
          secret:
            secretName: github-token
            optional: true
        - name: guide
          configMap:
            name: hermes-cluster-guide
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
