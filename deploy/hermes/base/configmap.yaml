apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-workspaces
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: homelab
data:
  # Cloned on start, one URL per line.
  repos: |
    https://github.com/gwkline/homelab.git
  # Exec'd by run-hermes.sh; set to "sleep infinity" to debug.
  command: |
    hermes gateway run
