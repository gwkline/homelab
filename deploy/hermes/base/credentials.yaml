# 1Password item (vault homelab); field label = Secret key = env var name:
#   openrouter/OPENROUTER_API_KEY (also builds the factory's opencode auth)
#
# The StatefulSet also reads TELEGRAM_BOT_TOKEN and DISCORD_BOT_TOKEN from
# optional Secrets hermes-telegram and hermes-discord. No chat bot exists in
# 1Password yet, so nothing syncs them. To turn a gateway on, create item
# telegram-bot (or discord-bot) with that field and add an ExternalSecret
# shaped like the one below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-openrouter
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-openrouter
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY | trim }}"
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openrouter/OPENROUTER_API_KEY
