# Model-provider and messaging-gateway credentials for the hermes gateway
# (issue #42), synced from the dedicated homelab 1Password vault. One named
# ExternalSecret per credential: an item that is absent (or mid-rotation)
# never blocks the others, and each reports its own Ready condition.
#
# Secret keys are exactly the env var names hermes reads — the same contract
# as its ~/.hermes/.env — so the pod consumes them with a plain envFrom and
# no value is ever copied into config.yaml or the PVC:
#   https://hermes-agent.nousresearch.com/docs/reference/environment-variables
#
# Prerequisite: the namespace-scoped SecretStore `onepassword` reports Ready
# in agents (deploy/github-tokens/base/secretstore.yaml, issue #41).
#
# 1Password item contract (issues #39/#42):
#   vault: homelab
#   item: openrouter     field: OPENROUTER_API_KEY   — hermes LLM calls
#   item: telegram-bot   field: TELEGRAM_BOT_TOKEN   — Telegram adapter
#   item: discord-bot    field: DISCORD_BOT_TOKEN    — Discord adapter
#   Field labels == Secret keys == env var names: one name per value
#   everywhere. The openrouter key is the same credential embedded in the
#   opencode-auth item's auth.json (coding CLIs); rotate both together.
#
# OPTIONAL BY DESIGN: if an item is missing from the vault, its
# ExternalSecret reports Ready=False and keeps retrying (expected state),
# while the StatefulSet references the Secret with envFrom optional: true —
# the gateway still boots (degradation contract, same as github-token-writer)
# and run-hermes.sh logs a loud WARNING when no credentials are present.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-openrouter
  namespace: agents
spec:
  # Rotation in 1Password reaches the cluster within this interval (plus a
  # ~5m provider cache). env vars never update in a running pod — restart
  # the StatefulSet to pick rotated values up (see README.md).
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: hermes-openrouter
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Trim guards against a trailing newline in the 1Password field —
        # a stray newline breaks the API key (same guard as github-token).
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY | trim }}"
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openrouter
        property: OPENROUTER_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-telegram
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: hermes-telegram
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN | trim }}"
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: telegram-bot
        property: TELEGRAM_BOT_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-discord
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: hermes-discord
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN | trim }}"
  data:
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: discord-bot
        property: DISCORD_BOT_TOKEN
