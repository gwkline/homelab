# 1Password items (vault homelab); field label = Secret key = env var name:
#   openrouter/OPENROUTER_API_KEY (same key as opencode-auth; rotate together)
#   telegram-bot/TELEGRAM_BOT_TOKEN
#   discord-bot/DISCORD_BOT_TOKEN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-openrouter
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: hermes-openrouter
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY | trim }}"
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openrouter/OPENROUTER_API_KEY
