apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t3code
  namespace: agents
spec:
  serviceName: t3code-headless
  replicas: 1
  selector:
    matchLabels:
      app: t3code
  template:
    metadata:
      labels:
        app: t3code
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: t3code
          image: ghcr.io/gwkline/homelab/t3code@sha256:44eadb74b150da72ea43d4210edab86e0d6759f49763a8354999a665d56231bd
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3773
              name: http
          env:
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: WORKSPACE_REPOS
              valueFrom:
                configMapKeyRef:
                  name: t3code-workspaces
                  key: repos
          volumeMounts:
            - name: data
              mountPath: /data
            # t3code state (environment-id, pairings, sessions, agent creds).
            # Standalone PVC (not a VCT — those are immutable after creation)
            # so pairing survives pod replacement; without this, every rollout
            # orphans the browser session.
            - name: t3state
              mountPath: /home/node/.t3
            - name: github-token
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
      initContainers:
        # Runs as root only to fix volume ownership, then exits. Main
        # containers run as uid 1000 regardless of provisioner fsGroup support.
        - name: volume-init
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["chown", "-R", "1000:1000", "/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: github-token
          secret:
            secretName: github-token
            optional: true
        - name: t3state
          persistentVolumeClaim:
            claimName: t3state-t3code-0
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    # Small dedicated volume for t3code's own state dir (env-id, pairings,
    # sessions). Kept separate from /data so repo churn never risks state.
    - metadata:
        name: t3state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
