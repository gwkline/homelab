apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t3code
  namespace: agents
spec:
  serviceName: t3code-headless
  # Keep at 1: t3state is a single standalone RWO claim (t3state-pvc.yaml).
  replicas: 1
  selector:
    matchLabels:
      app: t3code
  template:
    metadata:
      labels:
        app: t3code
    spec:
      serviceAccountName: t3code-readonly
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 60
      containers:
        - name: t3code
          image: ghcr.io/gwkline/homelab/t3code:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3773
              name: http
          env:
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: WORKSPACE_REPOS
              valueFrom:
                configMapKeyRef:
                  name: t3code-workspaces
                  key: repos
            - name: EXECUTOR_MCP_URL
              valueFrom:
                configMapKeyRef:
                  name: t3code-executor
                  key: mcp-url
            - name: EXECUTOR_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: t3code-executor
                  key: client-id
            - name: EXECUTOR_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: executor-client
                  key: token
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: t3state
              mountPath: /home/node/.t3
            - name: github-token
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 6Gi
              ephemeral-storage: 8Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
      initContainers:
        # Installs the allowlisted skills at the pinned ref. Always exits 0:
        # on failure the pod starts on stale skills.
        - name: skills-sync
          image: ghcr.io/gwkline/homelab/t3code:latest
          command:
            - sh
            - -c
            - |
              if sh /usr/local/lib/skills-lib.sh; then
                echo "[skills-sync] OK"
              else
                echo "[skills-sync] FAILED (degraded) — see ${SKILLS_STATUS_FILE}; pod continues on stale skills" >&2
              fi
              exit 0
          env:
            - name: HOME
              value: /tmp
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: SKILLS_REF
              valueFrom:
                configMapKeyRef:
                  name: t3code-skills-sync
                  key: ref
            - name: SKILLS_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: t3code-skills-sync
                  key: allowlist
            - name: SKILLS_TARGET
              value: /data/skills-generated
            - name: SKILLS_STATUS_FILE
              value: /data/skills-sync/status.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: github-token
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: github-token
          secret:
            secretName: github-token
            optional: true
        # Standalone claim: volumeClaimTemplates are immutable, so a volume
        # added to the existing StatefulSet has to be one. local-path can't
        # resize it either way.
        - name: t3state
          persistentVolumeClaim:
            claimName: t3state-t3code-0
  volumeClaimTemplates:
    # Repo clones (they re-clone) and the agent CLIs' saved state: logins,
    # config and the OpenCode database. Losing it logs every CLI out.
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
