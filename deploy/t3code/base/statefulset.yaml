apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t3code
  namespace: agents
spec:
  serviceName: t3code-headless
  # One replica by design: the t3state claim (see volumes) is
  # replica-specific — t3state-t3code-0, ReadWriteOnce — so a second replica
  # would have to mount the same PVC. Scaling out needs per-replica claims
  # (a volumeClaimTemplate), deliberately not used here; keep this at 1.
  replicas: 1
  selector:
    matchLabels:
      app: t3code
  template:
    metadata:
      labels:
        app: t3code
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: t3code
          image: ghcr.io/gwkline/homelab/t3code@sha256:44eadb74b150da72ea43d4210edab86e0d6759f49763a8354999a665d56231bd
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3773
              name: http
          env:
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: WORKSPACE_REPOS
              valueFrom:
                configMapKeyRef:
                  name: t3code-workspaces
                  key: repos
          volumeMounts:
            - name: data
              mountPath: /data
            # t3code state (environment-id, pairings, sessions, agent creds).
            # Backed by the standalone PVC t3state-t3code-0 — the only claim
            # declaration for this volume (declared in t3state-pvc.yaml, see
            # volumes below). The PVC survives pod replacement, so pairing
            # survives rollouts; without it, every rollout orphans the browser
            # session. Contains credentials — backed up nightly
            # (deploy/backup/base, tag `t3state`); restore recipe in
            # runbook section 11.
            - name: t3state
              mountPath: /home/node/.t3
            - name: github-token
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
      initContainers:
        # Runs as root only to fix volume ownership, then exits. Main
        # containers run as uid 1000 regardless of provisioner fsGroup support.
        - name: volume-init
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["chown", "-R", "1000:1000", "/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /data
        # Skills sync (#81): apps/shared/skills-lib.sh clones the private
        # skills repo at the pinned commit from t3code-skills-sync (token
        # answered via throwaway GIT_ASKPASS — nothing lands in Git config),
        # verifies the pin, and installs only the allowlisted skill paths
        # into the generated store /data/skills-generated. Linking into the
        # CLIs' skill dirs happens in init-workspace.sh AFTER the agent-state
        # restore, so a snapshot file can never write through a fresh sync
        # symlink. Degrades explicitly on failure: records
        # /data/skills-sync/status.json and always exits 0 — the server
        # starts on stale skills; init-workspace.sh prints the warning.
        - name: skills-sync
          # Same digest as the main container above (issue #91): admission
          # verification binds to digests, and skills-lib.sh must match the
          # server that links the skills it syncs.
          image: ghcr.io/gwkline/homelab/t3code@sha256:44eadb74b150da72ea43d4210edab86e0d6759f49763a8354999a665d56231bd
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              if sh /usr/local/lib/skills-lib.sh; then
                echo "[skills-sync] OK"
              else
                echo "[skills-sync] FAILED (degraded) — see ${SKILLS_STATUS_FILE}; pod continues on stale skills" >&2
              fi
              exit 0
          env:
            - name: HOME
              value: /tmp
            - name: GITHUB_TOKEN_FILE
              value: /secrets/token
            - name: SKILLS_REF
              valueFrom:
                configMapKeyRef:
                  name: t3code-skills-sync
                  key: ref
            - name: SKILLS_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: t3code-skills-sync
                  key: allowlist
            - name: SKILLS_TARGET
              value: /data/skills-generated
            - name: SKILLS_STATUS_FILE
              value: /data/skills-sync/status.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: github-token
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: github-token
          secret:
            secretName: github-token
            optional: true
        # Single authoritative claim declaration for t3code's own state dir
        # (env-id, pairings, sessions). The claim is created by
        # t3state-pvc.yaml in this kustomization — deliberately NOT a
        # volumeClaimTemplate: VCTs are immutable after creation (a storage
        # bump could never be applied without recreating the StatefulSet), and
        # a same-named VCT would let the controller override this explicit
        # volume. The claim name carries the replica ordinal (t3state-t3code-0)
        # and is ReadWriteOnce — keep spec.replicas at 1; multi-replica would
        # need per-replica claims, which is deliberately out of scope.
        # One-time migration for clusters still carrying the old dual
        # declaration (explicit volume + t3state VCT): removing a
        # volumeClaimTemplate cannot be applied in place (the API forbids
        # spec changes outside replicas/template/updateStrategy/
        # persistentVolumeClaimRetentionPolicy/minReadySeconds), so delete and
        # recreate the StatefulSet while the claim keeps its data:
        #   kubectl -n agents delete statefulset t3code --cascade=orphan
        #   kubectl apply -k deploy/t3code/base
        #   kubectl -n agents rollout restart statefulset t3code
        # Orphaned pods keep serving and are adopted as-is; the claim
        # t3state-t3code-0 is untouched, so pairings and sessions survive.
        # Replace the pod once to prove pairing state survives.
        - name: t3state
          persistentVolumeClaim:
            claimName: t3state-t3code-0
  volumeClaimTemplates:
    # /data only (repo workspaces — churn is recoverable, they re-clone).
    # t3state's claim lives in t3state-pvc.yaml, not here: see volumes.
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
