apiVersion: v1
kind: Service
metadata:
  name: t3code-headless
  namespace: agents
spec:
  clusterIP: None
  selector:
    app: t3code
  ports:
    - name: http
      port: 3773
      targetPort: http
---
# https://t3code-0.<tailnet>.ts.net (TLS terminated by the Tailscale Ingress).
apiVersion: v1
kind: Service
metadata:
  name: t3code-0
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: t3code
    statefulset.kubernetes.io/pod-name: t3code-0
  ports:
    - name: http
      port: 3773
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: t3code-0
  namespace: agents
  annotations:
    tailscale.com/tags: tag:k8s-operator
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: t3code-0
      port:
        number: 3773
  tls:
    - hosts: [t3code-0]
