# Governs the StatefulSet's pod identity. Headless: DNS resolves to pod IPs
# and the declared port is what Homepage's siteMonitor targets (issue #14).
apiVersion: v1
kind: Service
metadata:
  name: t3code-headless
  namespace: agents
spec:
  clusterIP: None
  selector:
    app: t3code
  ports:
    - name: http
      port: 3773
      targetPort: http
---
# Per-replica tailnet exposure via the Tailscale operator.
# Each replica gets https://<hostname>.<tailnet>.ts.net with automatic certs.
# Duplicate this block (selector + hostname annotation) per replica,
# or generate in an overlay when scaling beyond a few.
apiVersion: v1
kind: Service
metadata:
  name: t3code-0
  namespace: agents
  annotations:
    tailscale.com/hostname: t3code-0
    # Operator defaults proxy devices to tag:k8s; our OAuth client is only
    # allowed tag:k8s-operator (see deploy/tailscale/README.md).
    tailscale.com/tags: tag:k8s-operator
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: t3code
    statefulset.kubernetes.io/pod-name: t3code-0
  ports:
    - name: https
      port: 443
      targetPort: http
