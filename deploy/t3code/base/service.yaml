# Governs the StatefulSet's pod identity. Headless: DNS resolves to pod IPs
# and the declared port is what Homepage's siteMonitor targets (issue #14).
apiVersion: v1
kind: Service
metadata:
  name: t3code-headless
  namespace: agents
spec:
  clusterIP: None
  selector:
    app: t3code
  ports:
    - name: http
      port: 3773
      targetPort: http
---
# Per-replica tailnet exposure: https://t3code-0.<tailnet>.ts.net. The
# Tailscale Ingress terminates TLS with a tailnet cert and proxies (including
# websockets) to this Service's ClusterIP, so pod replacement needs no
# proxy reconfiguration. Duplicate the Service + Ingress pair per replica.
apiVersion: v1
kind: Service
metadata:
  name: t3code-0
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: t3code
    statefulset.kubernetes.io/pod-name: t3code-0
  ports:
    - name: http
      port: 3773
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: t3code-0
  namespace: agents
  annotations:
    # Our OAuth client may only assign tag:k8s-operator.
    tailscale.com/tags: tag:k8s-operator
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: t3code-0
      port:
        number: 3773
  tls:
    - hosts: [t3code-0]
