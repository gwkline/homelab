apiVersion: v1
kind: ConfigMap
metadata:
  name: t3code-skills-sync
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: homelab
data:
  # Pinned commit of gwkline/.dotfiles (private skills repo, #81). The sync
  # verifies that the fetched HEAD equals this SHA and records both in
  # /data/skills-sync/status.json. Updates are opt-in: bumping this pin (or
  # the allowlist below) is a reviewed PR, never automatic. A tag or branch
  # name also works (resolved commit is recorded), but a full SHA is the
  # reproducibility contract.
  ref: |
    445e4255288732efb00c8878151610c2669f5e93
  # Homelab-side allowlist: only these skill paths (relative to skills/ in
  # the source repo) are installed — fetched code never runs unreviewed
  # (#69). One <category>/<skill> per line; # comments allowed.
  allowlist: |
    autonomous-ai-agents/searching-coding-agent-history
    devops/homelab-cluster-bringup
    software-development/homelab-k3s-ops
    software-development/poteto-mode
