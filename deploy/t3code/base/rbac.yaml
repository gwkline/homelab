# Read-only cluster view for t3 agent sessions (operator direction
# 2026-10-06): agents building dashboards / auditing deployments need
# live cluster state and logs, not just repo manifests. Get/list only —
# no watch/exec/patch/create/delete, and NO secrets access anywhere
# (grafana-admin, work tokens, tailscale OAuth all stay invisible to
# agent sessions). The work runner deliberately has NO ServiceAccount
# token (see deploy/work-t3code: automountServiceAccountToken: false,
# no serviceAccountName) — this grant is personal-runner only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3code-readonly
  namespace: agents
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: t3code-cluster-reader
  labels:
    app.kubernetes.io/part-of: homelab
rules:
  # Core state + logs: pods, pod logs, events, nodes, namespaces,
  # services, configmaps (non-secret config visibility), PVCs.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "namespaces", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  # Workload rollouts for deployment/statefulset auditing.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  # CronJobs/Jobs (factory cadence inspection).
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
  # Live usage metrics (dashboard context).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: t3code-cluster-reader
  labels:
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: t3code-cluster-reader
subjects:
  - kind: ServiceAccount
    name: t3code-readonly
    namespace: agents
