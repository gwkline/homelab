# Read-only cluster view for personal t3 sessions: get/list only, no secrets
# or ConfigMaps (some hold credentials), no exec, no writes. The work runner
# has no ServiceAccount token at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3code-readonly
  namespace: agents
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: t3code-cluster-reader
  labels:
    app.kubernetes.io/part-of: homelab
rules:
  - apiGroups: [""]
    resources:
      [
        "pods",
        "pods/log",
        "events",
        "nodes",
        "namespaces",
        "services",
        "persistentvolumeclaims",
      ]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: t3code-cluster-reader
  labels:
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: t3code-cluster-reader
subjects:
  - kind: ServiceAccount
    name: t3code-readonly
    namespace: agents
