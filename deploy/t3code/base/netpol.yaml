# Workload-owned exposure rule. Default-deny lives in policies/base; this
# declares the one path allowed in: Tailscale operator proxies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-t3code
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: t3code
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3773
    # Homepage siteMonitor (issue #14): the only in-cluster path to :3773 —
    # pod-scoped, so other agents pods stay denied by default-deny-ingress.
    - from:
        - podSelector:
            matchLabels:
              app: homepage
      ports:
        - protocol: TCP
          port: 3773
