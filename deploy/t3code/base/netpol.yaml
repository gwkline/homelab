apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-t3code
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: t3code
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3773
    # Homepage siteMonitor.
    - from:
        - podSelector:
            matchLabels:
              app: homepage
      ports:
        - protocol: TCP
          port: 3773
