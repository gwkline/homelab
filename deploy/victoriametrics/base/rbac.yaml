# Read-only scrape identity: node metrics via the API-server proxy plus discovery.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics-scrape
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # kubelet /metrics and cAdvisor through /api/v1/nodes/<name>/proxy.
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics-scrape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics-scrape
subjects:
  - kind: ServiceAccount
    name: victoriametrics
    namespace: agents
