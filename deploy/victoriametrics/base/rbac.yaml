# Two identities for the metrics stack (issue #44), both read-only:
#
# victoria-metrics: scrapes kubelet/cAdvisor through the apiserver proxy —
# that is what `nodes/proxy` + `nodes/metrics` buy, per ADR-003 D8.2. Plus
# pods/services/endpoints list-watch for in-cluster discovery headroom. This
# is a deliberate, audited addition to the "pods can't touch Kubernetes"
# exception list (main README) — no secrets, no writes, nothing node-local.
#
# kube-state-metrics: read-only list/watch of the object kinds whose state
# it exposes as metrics (jobs, deployments, PVCs…). No secrets, no writes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoria-metrics-scraper
rules:
  # kubernetes_sd_configs role: node needs node list; nodes/proxy + nodes/metrics
  # authorize the /api/v1/nodes/<name>/proxy/metrics[/cadvisor] GETs.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/metrics"]
    verbs: ["get"]
  # Discovery headroom per ADR-003 D8.2 (pod/service/endpoints SD).
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoria-metrics-scraper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoria-metrics-scraper
subjects:
  - kind: ServiceAccount
    name: victoria-metrics
    namespace: agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: agents
