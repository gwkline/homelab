# Read-only scrape identity: node discovery plus the kubelet's /metrics paths.
# No nodes/proxy: the kubelet authorizes exec, attach and host logs on it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics-scrape
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # The kubelet maps /metrics and /metrics/cadvisor to nodes/metrics.
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics-scrape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics-scrape
subjects:
  - kind: ServiceAccount
    name: victoriametrics
    namespace: agents
