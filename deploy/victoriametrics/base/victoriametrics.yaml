# Single node with built-in scraping (no vmagent). local-path does not enforce
# the PVC size; -storage.minFreeDiskSpaceBytes is the disk guard (ADR-005 D3).
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-scrape
  namespace: agents
  labels:
    app: victoriametrics
data:
  # Node metrics come straight from the kubelet at the node's InternalIP:10250
  # (node discovery's default address). The kubelet serving cert is signed by
  # the cluster CA and lists the node IP, so the SA's ca.crt verifies it.
  promscrape.yml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      - job_name: kubelet
        scheme: https
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.agents.svc:8080"]

      # ESO's controller: ExternalSecret Ready conditions for alerting.
      - job_name: external-secrets
        static_configs:
          - targets: ["external-secrets-metrics.external-secrets.svc:8080"]

      - job_name: victoriametrics
        static_configs:
          - targets: ["localhost:8428"]
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: agents
  labels:
    app: victoriametrics
spec:
  type: ClusterIP
  selector:
    app: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  namespace: agents
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      serviceAccountName: victoriametrics
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: victoriametrics
          # Flags change between versions; bump deliberately.
          image: victoriametrics/victoria-metrics:v1.154.1@sha256:c7884f32920dd45a9d86542a717227e63af03e060e53bbf8031e6e6fd0e1e05d
          args:
            - -storageDataPath=/var/lib/victoria-metrics
            - -retentionPeriod=30d
            - -promscrape.config=/etc/vm/promscrape.yml
            # Read-only below this much free space on the node disk. Must stay
            # above the kubelet's nodefs eviction threshold (10% of the disk,
            # bootstrap/k3s-config.yaml), so VM stops writing before the node
            # hits DiskPressure.
            - -storage.minFreeDiskSpaceBytes=15GB
          ports:
            - name: http
              containerPort: 8428
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/vm
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/victoria-metrics
      volumes:
        - name: config
          configMap:
            name: victoriametrics-scrape
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      priorityClassName: homelab-platform
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Not a limit: local-path ignores it. ~4GB per 30d at this scale.
            # Not backed up.
            storage: 15Gi
