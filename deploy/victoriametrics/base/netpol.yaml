# Ingress: Grafana -> VictoriaMetrics and VictoriaMetrics -> kube-state-metrics
# only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-victoriametrics
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: victoriametrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 8428
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-victoriametrics-to-kube-state-metrics
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: kube-state-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: victoriametrics
      ports:
        - protocol: TCP
          port: 8080
---
# Additive to agents-egress-default: the kubelet on each node's InternalIP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoriametrics-egress-kubelet
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: victoriametrics
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.0.0/16 # node/LAN
      ports:
        - { protocol: TCP, port: 10250 }
