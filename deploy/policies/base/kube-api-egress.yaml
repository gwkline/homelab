# Workloads in agents-egress-default (networkpolicy.yaml) that call the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-egress-kube-api
  namespace: agents
  labels:
    homelab.gwkline.io/kube-api-egress: "true"
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - alloy
          - deployer
          - kube-state-metrics
          - panel
          - victoriametrics
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
---
