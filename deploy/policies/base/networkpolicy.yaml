# Default-deny ingress in both namespaces. Egress stays open for now —
# agents need the internet by design; revisit egress allowlists once
# workloads are stable (documented decision, see README security section).
#
# Per-workload exposure rules live beside each workload (e.g.
# deploy/t3code/base/netpol.yaml) so one apply brings up everything it needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: agents
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress]
