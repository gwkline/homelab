# Default-deny ingress in both namespaces. Egress stays open for now —
# agents need the internet by design; revisit egress allowlists once
# workloads are stable (documented decision, see README security section).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: agents
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Only Tailscale operator proxy pods (which run in the tailscale namespace)
# may reach t3code servers. Hermes needs no inbound at all — access is via
# kubectl exec and the agent's outbound gateway connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-t3code
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: t3code
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3773
