# Proves egress NetworkPolicy is enforced: a pod that only default-deny-egress
# selects (the public-only policies exclude it) must reach nothing. A failed
# run means enforcement is broken in that namespace (docs/egress-policy.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: egress-canary
  namespace: sandbox
  labels:
    app.kubernetes.io/name: egress-canary
spec:
  schedule: "*/30 * * * *"
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: egress-canary
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      # Failed runs stay a day, long enough for the alert to see them.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: egress-canary
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
              env:
                # A public IP, the API Service VIP and the LAN gateway; each
                # accepts connections when reachable.
                - name: TARGETS
                  value: "1.1.1.1:80 10.43.0.1:443 192.168.1.1:80"
              command:
                - sh
                - -c
                - |
                  # Policy applies ~0.5 s after the pod starts; test after it.
                  sleep 5
                  open=""
                  for t in $TARGETS; do
                    if nc -z -w 3 "${t%:*}" "${t#*:}"; then open="$open $t"; fi
                  done
                  if [ -n "$open" ]; then
                    echo "egress-canary: reachable under default-deny:$open"
                    exit 1
                  fi
                  echo "egress-canary: blocked $TARGETS"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
