# Deliberately malicious: picks a ServiceAccount outside the approved set.
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-denied-service-account
  namespace: sandbox
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: operator-override
      automountServiceAccountToken: false
      containers:
        - name: loop
          image: ghcr.io/gwkline/homelab/loop-agent:latest
          resources:
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
