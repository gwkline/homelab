# Deliberately malicious: cpu limit above the ceiling.
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-denied-cpu-limit-ceiling
  namespace: sandbox
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: loop
          image: ghcr.io/gwkline/homelab/loop-agent:latest
          resources:
            limits: { cpu: "8", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
