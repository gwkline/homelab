# Deliberately malicious: claims a persistent volume from the node.
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-denied-pvc
  namespace: sandbox
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: loop
          image: ghcr.io/gwkline/homelab/loop-agent:latest
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: something }
