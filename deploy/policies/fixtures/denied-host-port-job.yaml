# Deliberately malicious: binds a container to a host port.
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-denied-host-port
  namespace: sandbox
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: loop
          image: ghcr.io/gwkline/homelab/loop-agent:latest
          ports:
            - { containerPort: 8080, hostPort: 8080 }
          resources:
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
