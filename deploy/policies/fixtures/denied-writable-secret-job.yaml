# Deliberately malicious: writable secret mount (token could be swapped).
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-denied-writable-secret
  namespace: sandbox
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: loop
          image: ghcr.io/gwkline/homelab/loop-agent:latest
          volumeMounts:
            - { name: github-token, mountPath: /secrets }
          resources:
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: github-token
          secret: { secretName: github-token, optional: true }
