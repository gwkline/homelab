# The exact shape the factory orchestrator spawns (apps/factory/orchestrator/run.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-allowed-worker
  namespace: sandbox
  labels:
    factory.gwkline.io/profile: code-pr
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        factory.gwkline.io/profile: code-pr
    spec:
      restartPolicy: Never
      serviceAccountName: factory-worker
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: ghcr.io/gwkline/homelab/factory/worker:latest
          imagePullPolicy: Always
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef: { name: github-token, key: token }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "2", memory: 12Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
