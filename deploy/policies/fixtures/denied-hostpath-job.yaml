# Deliberately malicious: mounts the docker socket via hostPath.
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-denied-hostpath
  namespace: sandbox
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: loop
          image: ghcr.io/gwkline/homelab/loop-agent:latest
          volumeMounts:
            - { name: docker-sock, mountPath: /var/run/docker.sock }
          resources:
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: docker-sock
          hostPath: { path: /var/run/docker.sock, type: Socket }
