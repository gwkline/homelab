# Deliberately malicious: memory limit above the ceiling.
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-denied-mem-limit-ceiling
  namespace: sandbox
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: loop
          image: ghcr.io/gwkline/homelab/loop-agent:latest
          resources:
            limits: { memory: 32Gi }
          securityContext:
            allowPrivilegeEscalation: false
