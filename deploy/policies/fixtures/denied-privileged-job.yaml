# Deliberately malicious: privileged container (the dind escape hatch).
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-denied-privileged
  namespace: sandbox
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: dind
          image: ghcr.io/gwkline/homelab/loop-agent:latest
          resources:
            limits: { memory: 4Gi }
          securityContext:
            privileged: true
