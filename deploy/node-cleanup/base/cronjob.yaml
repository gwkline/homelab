# Weekly: deletes Evicted pods and Succeeded pods older than 24h, cluster-wide.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-cleanup
spec:
  schedule: "23 6 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: node-cleanup
        spec:
          serviceAccountName: node-cleanup
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: ghcr.io/gwkline/homelab/loop-agent:latest
              # loop-agent ships kubectl and GNU date.
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["sh", "/etc/node-cleanup/cleanup.sh"]
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: cleanup-script
                  mountPath: /etc/node-cleanup
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: cleanup-script
              configMap:
                name: node-cleanup-script
