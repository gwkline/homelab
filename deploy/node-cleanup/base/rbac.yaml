# Cluster-wide pod delete: debris lands in every namespace. cleanup.sh only
# targets Evicted pods and Succeeded pods older than 24h.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-cleanup
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-cleanup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-cleanup
subjects:
  - kind: ServiceAccount
    name: node-cleanup
    namespace: agents
