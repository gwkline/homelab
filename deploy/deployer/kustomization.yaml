apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - rbac.yaml
  - cronjob.yaml

# A fixed name: each Job mounts whatever script is current when it starts.
configMapGenerator:
  - name: deployer-script
    namespace: agents
    files:
      - deploy.sh
      - lib.sh
    options:
      disableNameSuffixHash: true
