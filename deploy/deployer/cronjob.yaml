# Every 5 minutes: run deploy.sh, mounted from the deployer-script ConfigMap.
# Changes to this directory, the script included, need a manual apply.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deployer
  namespace: agents
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Inside the 5-minute schedule, with room for the 150s rollout wait.
      activeDeadlineSeconds: 280
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: deployer
        spec:
          restartPolicy: Never
          serviceAccountName: deployer
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: deployer
              image: ghcr.io/gwkline/homelab/loop-agent:latest
              command: ["sh", "/opt/deployer/deploy.sh"]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: script, mountPath: /opt/deployer, readOnly: true }
          volumes:
            - { name: tmp, emptyDir: {} }
            - { name: script, configMap: { name: deployer-script } }
