apiVersion: v1
kind: ServiceAccount
metadata:
  name: work-docker-watch
  namespace: agents
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: work-docker-watch
  namespace: work
rules:
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [work-t3code-0]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: work-docker-watch
  namespace: work
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: work-docker-watch
subjects:
  - kind: ServiceAccount
    name: work-docker-watch
    namespace: agents
---
# A host-only, metadata-only authority. No token is mounted in work or guest.
apiVersion: v1
kind: Secret
metadata:
  name: work-docker-watch-token
  namespace: agents
  annotations:
    kubernetes.io/service-account.name: work-docker-watch
type: kubernetes.io/service-account-token
