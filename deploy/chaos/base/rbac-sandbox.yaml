# Pod delete in agents and sandbox only (see also rbac-agents.yaml). Target
# exclusions live in run.sh: RBAC is the blast radius, the script is the aim.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-monkey
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-monkey
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-monkey
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-monkey
subjects:
  - kind: ServiceAccount
    name: chaos-monkey
    namespace: sandbox
