apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace transformer here: rbac.yaml holds the sandbox panel-sandbox-runs
# Role/RoleBinding, which a base-wide `namespace: agents` would silently move
# into agents (caught by the manifest smoke permission probes, issue #16).
# Every resource declares its namespace explicitly.

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - rbac.yaml
  - cluster-reader.yaml
  - deployment.yaml
  - externalsecret.yaml
  - service.yaml
  - stats-pvc.yaml
  - stats-cronjob.yaml
