# 1Password item panel-auth (vault homelab); format in apps/panel/server/auth.ts.
#   users:  name=tailscale-login pairs that may act through the UI
#   tokens: name=token pairs, one per machine caller (openssl rand -hex 32)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: panel-auth
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: panel-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        users: "{{ .users | trim }}"
        tokens: "{{ .tokens | trim }}"
  data:
    - secretKey: users
      remoteRef:
        key: panel-auth/users
    - secretKey: tokens
      remoteRef:
        key: panel-auth/tokens
