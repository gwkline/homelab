# Exactly the calls apps/panel/server/k8s.ts makes. sandbox: list and delete
# Jobs, and create the Job a factory run clones from its orchestrator CronJob;
# read and patch CronJobs (schedules card). agents: Service health checks and
# the panel Ingress (tailnet discovery). No secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: panel
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: panel-sandbox-runs
  namespace: sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: panel-sandbox-runs
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: panel-sandbox-runs
subjects:
  - kind: ServiceAccount
    name: panel
    namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: panel-agents-viewer
  namespace: agents
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["panel"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: panel-agents-viewer
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: panel-agents-viewer
subjects:
  - kind: ServiceAccount
    name: panel
    namespace: agents
