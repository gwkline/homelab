# Weekly factory-stats snapshots; outlives the GitHub-derived 8-week window.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: panel-stats
  namespace: agents
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
