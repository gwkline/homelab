# Weekly poke so quiet weeks still land in the factory-stats trend history.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-stats-snapshot
  namespace: agents
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  # Late Sunday, so the snapshot captures the nearly complete week.
  schedule: "53 23 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: factory-stats-snapshot
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: snapshot
              image: ghcr.io/gwkline/homelab/panel:latest
              command:
                - node
                - -e
                - >-
                  fetch('http://panel-http.agents.svc.cluster.local:3000/api/factory/stats/rollup').then((r) => { if (!r.ok) { throw new Error('factory stats rollup failed: ' + r.status); } return r.json(); }).then((j) => { console.log('factory stats snapshot upserted, persisted:', j.persisted); }).catch((e) => { console.error(e); process.exit(1); });
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
