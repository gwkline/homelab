apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panel
  template:
    metadata:
      labels:
        app: panel
    spec:
      # The backend's whole purpose: reading sandbox state and creating Jobs
      # with this identity. Scoped by rbac.yaml.
      serviceAccountName: panel
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: panel
          image: ghcr.io/gwkline/homelab/panel:latest
          env:
            - name: FACTORY_REPO
              value: gwkline/homelab
            # Weekly factory-stats snapshot artifact (issue #186): one JSON
            # file on the panel-stats PVC, upserted per ISO week.
            - name: FACTORY_STATS_PATH
              value: /data/factory-stats/snapshots.json
            # Knowledge proxy target (the retrieval service's in-cluster
            # ClusterIP; /api/knowledge/* proxies /v1/sources, sync, and
            # search). Token from the optional knowledge-api-token mount —
            # if the 1Password item is not synced yet the panel still boots
            # and the knowledge endpoints answer 503/401 (degraded, never
            # fatal), matching the github-token-writer pattern.
            - name: KNOWLEDGE_API_BASE
              value: http://knowledge-retrieval-http.agents.svc.cluster.local:3000
            - name: KNOWLEDGE_API_TOKEN_FILE
              value: /secrets-knowledge/token
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: github-token
              mountPath: /secrets
              readOnly: true
            - name: knowledge-token
              mountPath: /secrets-knowledge
              readOnly: true
            - name: stats
              mountPath: /data
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
      volumes:
        - name: github-token
          secret:
            secretName: github-token
            items:
              - key: token
                path: token
        - name: knowledge-token
          secret:
            # Optional: without the 1Password item the panel still boots and
            # the knowledge endpoints degrade (see the env comment above).
            secretName: knowledge-api-token
            optional: true
            items:
              - key: token
                path: token
        - name: stats
          persistentVolumeClaim:
            claimName: panel-stats
