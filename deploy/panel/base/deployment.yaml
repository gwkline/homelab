apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panel
  template:
    metadata:
      labels:
        app: panel
    spec:
      priorityClassName: homelab-platform
      serviceAccountName: panel
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: panel
          image: ghcr.io/gwkline/homelab/panel:latest
          env:
            - name: FACTORY_REPO
              value: gwkline/homelab
            - name: FACTORY_STATS_PATH
              value: /data/factory-stats/snapshots.json
            - name: KNOWLEDGE_API_BASE
              value: http://knowledge-retrieval-http.agents.svc.cluster.local:3000
            - name: KNOWLEDGE_API_TOKEN_FILE
              value: /secrets-knowledge/token
            # Tailscale-User-Login is trusted only on this port; see service.yaml.
            - name: PANEL_TAILNET_PORT
              value: "3001"
            - name: PANEL_AUTH_DIR
              value: /secrets-panel-auth
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: tailnet
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: github-token
              mountPath: /secrets
              readOnly: true
            - name: knowledge-token
              mountPath: /secrets-knowledge
              readOnly: true
            - name: panel-auth
              mountPath: /secrets-panel-auth
              readOnly: true
            - name: stats
              mountPath: /data
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
      volumes:
        - name: github-token
          secret:
            secretName: github-token
            items:
              - key: token
                path: token
        - name: knowledge-token
          secret:
            # Optional: knowledge endpoints degrade without it.
            secretName: knowledge-api-token
            optional: true
            items:
              - key: token
                path: token
        - name: panel-auth
          secret:
            # Optional: without it the panel is read-only.
            secretName: panel-auth
            optional: true
        - name: stats
          persistentVolumeClaim:
            claimName: panel-stats
