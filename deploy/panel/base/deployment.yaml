apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panel
  template:
    metadata:
      labels:
        app: panel
    spec:
      # The backend's whole purpose: reading sandbox state and creating Jobs
      # with this identity. Scoped by rbac.yaml.
      serviceAccountName: panel
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: panel
          image: ghcr.io/gwkline/homelab/panel
          env:
            - name: FACTORY_REPO
              value: gwkline/launchpad
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: github-token
              mountPath: /secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
      volumes:
        - name: github-token
          secret:
            secretName: github-token
            items:
              - key: token
                path: token
