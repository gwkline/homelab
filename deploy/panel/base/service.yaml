apiVersion: v1
kind: Service
metadata:
  name: panel
  namespace: agents
  annotations:
    tailscale.com/hostname: panel
    # Required so proxy devices carry tag:k8s-operator regardless of the
    # operator's default tag (see deploy/tailscale/README.md).
    tailscale.com/tags: tag:k8s-operator
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: panel
  ports:
    - name: https
      port: 443
      targetPort: http
---
# Internal plaintext HTTP for in-cluster monitoring (Homepage siteMonitor,
# issue #14). The tailscale Service above stays 443-only; this ClusterIP is
# reachable solely by the Homepage pod via allow-tailscale-to-panel below.
apiVersion: v1
kind: Service
metadata:
  name: panel-http
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: panel
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Workload-owned exposure rule; default-deny lives in policies/base.
# Tailnet identity is the auth layer, same model as every other service here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-panel
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: panel
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3000
    # Homepage siteMonitor (issue #14): the only in-cluster path to :3000 —
    # pod-scoped, so other agents pods stay denied by default-deny-ingress.
    - from:
        - podSelector:
            matchLabels:
              app: homepage
      ports:
        - protocol: TCP
          port: 3000
    # factory-stats-snapshot CronJob (issue #186): weekly rollup trigger, the
    # only other in-cluster path to :3000 — pod-scoped like Homepage above.
    - from:
        - podSelector:
            matchLabels:
              app: factory-stats-snapshot
      ports:
        - protocol: TCP
          port: 3000
