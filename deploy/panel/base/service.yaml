# In-cluster HTTP: Homepage siteMonitor, the stats CronJob, Executor, and the
# backend of the tailnet Ingress below.
apiVersion: v1
kind: Service
metadata:
  name: panel-http
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: panel
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Tailnet exposure: https://panel.<tailnet>.ts.net. The panel discovers the
# tailnet suffix from this Ingress's status (apps/panel/server/devtools.ts).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel
  namespace: agents
  annotations:
    tailscale.com/tags: tag:k8s-operator
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: panel-http
      port:
        number: 3000
  tls:
    - hosts: [panel]
---
# Workload-owned exposure rule; default-deny lives in policies/base.
# Tailnet identity is the auth layer, same model as every other service here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-panel
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: panel
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3000
    # Homepage siteMonitor (issue #14): the only in-cluster path to :3000 —
    # pod-scoped, so other agents pods stay denied by default-deny-ingress.
    - from:
        - podSelector:
            matchLabels:
              app: homepage
      ports:
        - protocol: TCP
          port: 3000
    # factory-stats-snapshot CronJob (issue #186): weekly rollup trigger —
    # pod-scoped like Homepage above.
    - from:
        - podSelector:
            matchLabels:
              app: factory-stats-snapshot
      ports:
        - protocol: TCP
          port: 3000
    # Executor MCP gateway (issue #84): the ONLY host-side caller of the
    # factory API (deploy/executor/factory-openapi.json). Pod-scoped like the
    # rules above, so MCP agents (hermes, t3code) can reach the factory
    # surface solely through Executor's policy/approval layer — their pods
    # stay denied to :3000 by default-deny-ingress.
    - from:
        - podSelector:
            matchLabels:
              app: executor
      ports:
        - protocol: TCP
          port: 3000
