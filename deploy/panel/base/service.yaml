apiVersion: v1
kind: Service
metadata:
  name: panel-http
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: panel
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: tailnet
      port: 3001
      targetPort: tailnet
---
# The panel reads its tailnet suffix from this Ingress's status. It targets
# the tailnet port, where the panel trusts Tailscale-User-Login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel
  namespace: agents
  annotations:
    tailscale.com/tags: tag:k8s-operator
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: panel-http
      port:
        number: 3001
  tls:
    - hosts: [panel]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-panel
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: panel
  policyTypes: [Ingress]
  ingress:
    # The tailnet port takes only the panel's own Tailscale proxy, which
    # replaces any client-sent Tailscale-User-* headers with WhoIs identity.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: panel
              tailscale.com/parent-resource-ns: agents
              tailscale.com/parent-resource-type: ingress
      ports:
        - protocol: TCP
          port: 3001
    - from:
        - podSelector:
            matchLabels:
              app: homepage
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: factory-stats-snapshot
      ports:
        - protocol: TCP
          port: 3000
    # Executor is the only path agents (hermes, t3code) have to the factory API.
    - from:
        - podSelector:
            matchLabels:
              app: executor
      ports:
        - protocol: TCP
          port: 3000
