apiVersion: v1
kind: Service
metadata:
  name: panel-http
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: panel
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# The panel reads its tailnet suffix from this Ingress's status.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel
  namespace: agents
  annotations:
    tailscale.com/tags: tag:k8s-operator
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: panel-http
      port:
        number: 3000
  tls:
    - hosts: [panel]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-panel
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: panel
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: homepage
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: factory-stats-snapshot
      ports:
        - protocol: TCP
          port: 3000
    # Executor is the only path agents (hermes, t3code) have to the factory API.
    - from:
        - podSelector:
            matchLabels:
              app: executor
      ports:
        - protocol: TCP
          port: 3000
