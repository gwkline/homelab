# The embedding sidecar both knowledge services call (their
# KNOWLEDGE_EMBEDDING_* env points here). Cluster-internal only: ingress is
# netpol-gated to the two knowledge pods, so no token is wired — the netpol
# is the trust boundary, and any token would live in the same manifests its
# only two callers read.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-embedder
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-embedder
  template:
    metadata:
      labels:
        app: knowledge-embedder
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knowledge-embedder
          image: ghcr.io/gwkline/homelab/knowledge-embedder:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            # The image bakes the model in; nothing needs to write. The
            # Memory-backed /tmp covers node/ONNX scratch writes.
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # A pod idles near 450MiB RSS. Peak memory is the fp32 batch
            # arena (attention scores scale batch x heads x seq^2; a batch
            # of nine ~500-token chunks measured 1.4GiB locally), bounded by
            # the engine's CONCURRENCY=1/BATCH=8; 1536Mi leaves long-tail
            # 512-token chunks headroom without inviting node pressure.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 1536Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            # 503 until the model has loaded (~10s on the node).
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            # In-process ONNX inference blocks the event loop for the length
            # of a batch (~2.5s at batch 16 on agent-1). The default 1s
            # timeout killed the pod mid-replay when probes stacked inside
            # batches; 10s spans any single batch, and only a wedged process
            # misses three in a row.
            timeoutSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
