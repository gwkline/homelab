apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-ingest
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-ingest
  template:
    metadata:
      labels:
        app: knowledge-ingest
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knowledge-ingest
          image: ghcr.io/gwkline/homelab/knowledge:latest
          command: ["node", "dist/ingest.js"]
          env:
            - name: KNOWLEDGE_INGEST_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knowledge-db
                  key: databaseUrl
            # Read-only PAT for private git sources; used for clone/fetch only.
            - name: GIT_SOURCE_TOKEN_FILE
              value: /secrets-github/token
            - name: KNOWLEDGE_INGEST_TOKEN_FILE
              value: /secrets/token
            - name: TMPDIR
              value: /tmp/git-cache
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3100
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: knowledge-token
              mountPath: /secrets
              readOnly: true
            - name: github-token
              mountPath: /secrets-github
              readOnly: true
            - name: git-cache
              mountPath: /tmp/git-cache
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
      volumes:
        - name: knowledge-token
          secret:
            secretName: knowledge-api-token
            items:
              - key: token
                path: token
        - name: github-token
          secret:
            secretName: github-token
            items:
              - key: token
                path: token
        # Blobless bare clones; past the limit the pod is evicted and the
        # cache rebuilt, rather than filling the node's disk.
        - name: git-cache
          emptyDir:
            sizeLimit: 2Gi
