# Tailnet endpoint; in-cluster consumers use knowledge-retrieval-http.
apiVersion: v1
kind: Service
metadata:
  name: knowledge-retrieval
  namespace: agents
  annotations:
    tailscale.com/hostname: knowledge
    tailscale.com/tags: tag:k8s-operator
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: knowledge-retrieval
  ports:
    - name: https
      port: 443
      targetPort: http
