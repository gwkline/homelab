apiVersion: v1
kind: Service
metadata:
  name: knowledge-ingest
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: knowledge-ingest
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-retrieval-http
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: knowledge-retrieval
  ports:
    - name: http
      port: 3000
      targetPort: http
