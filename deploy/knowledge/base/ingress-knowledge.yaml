# https://knowledge.<tailnet>.ts.net (TLS terminated by the Tailscale Ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge
  namespace: agents
  annotations:
    tailscale.com/tags: tag:k8s-operator
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: knowledge-retrieval-http
      port:
        number: 3000
  tls:
    - hosts: [knowledge]
