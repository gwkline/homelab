# 1Password items (vault homelab):
#   knowledge-db: username=knowledge_owner, password. The same item sets the
#     role's password (deploy/postgres/base/owner-secrets.yaml).
#   knowledge-api-token: token = shared bearer for ingest, retrieval, panel
#     (openssl rand -base64 32).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowledge-db
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: knowledge-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .username | trim }}"
        password: "{{ .password | trim }}"
        databaseUrl: "postgresql://{{ .username | trim }}:{{ .password | trim }}@pg-primary-rw.database.svc:5432/knowledge"
  data:
    - secretKey: username
      remoteRef:
        key: knowledge-db/username
    - secretKey: password
      remoteRef:
        key: knowledge-db/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowledge-api-token
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: knowledge-api-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token | trim }}"
  data:
    - secretKey: token
      remoteRef:
        key: knowledge-api-token/token
