# Knowledge service credentials (ADR-002 vertical). Two ExternalSecrets from
# the dedicated homelab vault; consumers fail closed without them.
#
# 1Password item contracts:
#
#   knowledge-db (vault `homelab`):
#     item:   knowledge-db
#     fields: username = knowledge_owner, password = the SAME password as the
#             basic-auth Secret `pg-primary-knowledge-owner` in the database
#             namespace (deploy/postgres/README.md — CNPG applies the role
#             password from that Secret). Keep the two in sync on rotation:
#             update this item, then recreate the database-namespace Secret
#             and let the operator reconcile. The template below composes the
#             service DATABASE_URL keys from the fields.
#
#   knowledge-api-token (vault `homelab`):
#     item:   knowledge-api-token
#     field:  token = the shared internal bearer for the knowledge API pair.
#             The retrieval and ingest services both verify it, the retrieval
#             service uses it to authenticate the ingest passthrough, and the
#             panel mounts it for its server-side proxy. Any high-entropy
#     random string; generate with `openssl rand -base64 32`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowledge-db
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: knowledge-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Trim guards against trailing newlines in 1Password fields.
        username: "{{ .username | trim }}"
        password: "{{ .password | trim }}"
        databaseUrl: "postgresql://{{ .username | trim }}:{{ .password | trim }}@pg-primary-rw.database.svc:5432/knowledge"
  data:
    - secretKey: username
      remoteRef:
        key: knowledge-db/username
    - secretKey: password
      remoteRef:
        key: knowledge-db/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowledge-api-token
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: knowledge-api-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token | trim }}"
  data:
    - secretKey: token
      remoteRef:
        key: knowledge-api-token/token
