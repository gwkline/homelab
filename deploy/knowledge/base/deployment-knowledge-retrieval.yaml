apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-retrieval
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-retrieval
  template:
    metadata:
      labels:
        app: knowledge-retrieval
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knowledge-retrieval
          image: ghcr.io/gwkline/homelab/knowledge-retrieval:latest
          env:
            - name: KNOWLEDGE_RETRIEVAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knowledge-db
                  key: databaseUrl
            - name: KNOWLEDGE_RETRIEVAL_TOKEN_FILE
              value: /secrets/token
            # Read-only token: /v1/search only. Absent until provisioned.
            - name: KNOWLEDGE_RETRIEVAL_SEARCH_TOKEN_FILE
              value: /secrets-search/token
            - name: KNOWLEDGE_INGEST_BASE_URL
              value: http://knowledge-ingest.agents.svc.cluster.local:3100
            - name: KNOWLEDGE_INGEST_TOKEN_FILE
              value: /secrets/token
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: knowledge-token
              mountPath: /secrets
              readOnly: true
            - name: knowledge-search-token
              mountPath: /secrets-search
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            # Unauthenticated; checks the database and schema version, so the
            # pod leaves the Service while Postgres is down.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: knowledge-token
          secret:
            secretName: knowledge-api-token
            items:
              - key: token
                path: token
        - name: knowledge-search-token
          secret:
            secretName: knowledge-search-token
            optional: true
            items:
              - key: token
                path: token
