# Auto-deploy watcher: applies the git-pinned workload manifests on an
# interval (issue #35). Namespaced to `agents` — the watchlist targets live
# there, and applying manifests is a strictly smaller grant than the old
# cluster-wide rollout-restart role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-deploy
  namespace: agents
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-deploy
  namespace: agents
  labels:
    app.kubernetes.io/part-of: homelab
rules:
  # kubectl apply of workload manifests: get to diff, create/update/patch to
  # land the (digest-pinned) image bumps Renovate merges.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-deploy
  namespace: agents
  labels:
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auto-deploy
subjects:
  - kind: ServiceAccount
    name: auto-deploy
    namespace: agents
