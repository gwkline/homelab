apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-deploy
  namespace: agents
  labels:
    app.kubernetes.io/name: auto-deploy
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-deploy
  template:
    metadata:
      labels:
        app: auto-deploy
    spec:
      serviceAccountName: auto-deploy
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watcher
          # Digest-pinned per verify.sh's latest-tag rule (issue #91). The
          # watcher needs only sh/kubectl/curl; bump the digest when loop-agent
          # ships changes those tools depend on.
          image: ghcr.io/gwkline/homelab/loop-agent@sha256:331ed63c3ff4e781c10c1044c1c5ad475c5d6d8d6a3d3e02bed05a3f6a6e12a3
          command: ["/bin/sh", "/config/watch.sh"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: auto-deploy
            defaultMode: 0755
