apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-deploy
  namespace: agents
  labels:
    app.kubernetes.io/name: auto-deploy
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-deploy
  template:
    metadata:
      labels:
        app: auto-deploy
    spec:
      serviceAccountName: auto-deploy
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watcher
          # Digest-pinned: the watcher runs exactly the loop-agent build this
          # commit was verified against (issue #35). Renovate keeps the pin
          # current as CI republishes.
          image: ghcr.io/gwkline/homelab/loop-agent@sha256:e941bae94d9a59ea1c3034c3529ba633b3074ef0be5480b580a415c0e1fdfa70
          command: ["/bin/sh", "/config/watch.sh"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            # Fine-grained read PAT so the watcher can clone private repos;
            # anonymous clone still works while this repo is public (secret
            # is synced by ExternalSecrets, optional here by design).
            - name: github-token
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: auto-deploy
            defaultMode: 0755
        - name: github-token
          secret:
            secretName: github-token
            optional: true
