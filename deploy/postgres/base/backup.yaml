# v1 backup coverage (audit 2026-11-19 A1, #358): nightly pg_dump of the
# knowledge database, custom format, to a dedicated PVC on the same disk as
# the data it protects. Offsite base backups + WAL archiving stay open on
# #53; the remaining PVCs (hermes home, t3code state) stay open on #358.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backup
  namespace: database
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # A budget, not a ceiling: local-path does not enforce it (ADR-005 D3).
      # Retention in the CronJob keeps actual usage far below this.
      storage: 5Gi
  storageClassName: local-path
---
# The backup pod reaches only DNS and the SQL port. Ingress to the instance
# needs no change: allow-sql-clients already admits same-namespace clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-egress
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: pg-backup
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: database
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: pg-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-backup
              # The operand pin from base/cluster-image-catalog.yaml: pg_dump
              # major must match the server. Bump the two together.
              image: ghcr.io/cloudnative-pg/postgresql:18.7-202611122305-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              env:
                - name: PGHOST
                  value: pg-primary-rw.database.svc
                - name: PGDATABASE
                  value: knowledge
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: pg-primary-knowledge-owner
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pg-primary-knowledge-owner
                      key: password
                - name: PGSSLMODE
                  value: verify-full
                - name: PGSSLROOTCERT
                  value: /certs/ca.crt
                - name: RETENTION_DAYS
                  value: "14"
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: ca
                  mountPath: /certs
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  set -eu
                  ts="$(date -u +%Y%m%d%H%M%S)"
                  out="/backup/knowledge-$ts.dump"
                  pg_dump --format=custom --file="$out.tmp"
                  # A dump that cannot be read back is not a backup.
                  pg_restore --list "$out.tmp" >/dev/null
                  mv "$out.tmp" "$out"
                  echo "backup ok $out sha256:$(sha256sum "$out" | cut -d' ' -f1) $(du -h "$out" | cut -f1)"
                  keep=$((RETENTION_DAYS + 1))
                  ls -1t /backup/knowledge-*.dump | tail -n +"$keep" | while read -r old; do
                    rm -f "$old"
                  done
                  echo "kept $(ls -1 /backup/knowledge-*.dump | wc -l) dump(s)"
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: pg-backup
            - name: ca
              secret:
                secretName: pg-primary-ca
                defaultMode: 0400
            - name: tmp
              emptyDir: {}
