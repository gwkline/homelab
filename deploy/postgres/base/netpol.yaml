apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: database
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# CNPG operator: instance manager status API (8000) and metrics (9187).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-primary
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 9187 }
---
# Named SQL clients in agents, plus same-namespace peers for replication. A
# new client is added here and gets its own egress rule to pg-primary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sql-clients
  namespace: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-primary
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [cloudbeaver, knowledge-ingest, knowledge-retrieval]
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
---
# Instance egress: DNS and peers for replication. The Kubernetes API comes
# from pg-primary-kube-api in deploy/policies/base/kube-api-egress.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-instance-egress
  namespace: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-primary
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
