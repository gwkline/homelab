apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: database
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# CNPG operator: instance manager status API (8000) and metrics (9187).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-primary
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 9187 }
---
# SQL clients from agents and sandbox (sandbox pods also need their own egress
# rule), plus same-namespace peers for replication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sql-clients
  namespace: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-primary
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
---
# Instance egress: DNS, the Kubernetes API, and peers for replication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-instance-egress
  namespace: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-primary
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # kube-router filters after DNAT, so the API is matched by both its
    # ClusterIP and the node's real endpoint. Update if the node IP changes.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
        - ipBlock:
            cidr: 192.168.1.2/32
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
