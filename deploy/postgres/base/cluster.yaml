# Single instance on the durable server node: fast recovery, not HA.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-primary
  namespace: database
spec:
  # Scale to 3 only with a second failure domain.
  instances: 1

  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18

  enableSuperuserAccess: false

  postgresql:
    # pg_textsearch requires preload; not a CNPG-managed library.
    shared_preload_libraries:
      - pg_textsearch
    extensions:
      - name: pgvector
      # Mounted as an ImageVolume; ABI must match the operand (PG 18, trixie).
      - name: pg-textsearch
        image:
          reference: ghcr.io/gwkline/homelab/pg-textsearch@sha256:8076cc6902d6ebadbd66419988bd0612a3ca93ed0601eb6a5edd21857bca2790

  bootstrap:
    initdb:
      dataChecksums: true

  # Not a limit: local-path ignores the size (ADR-005 D3).
  storage:
    size: 20Gi
    storageClass: local-path

  priorityClassName: homelab-platform

  # local-path pins data to a node; agent nodes are rebuilt freely, so pin to
  # the durable server node.
  affinity:
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      # No CPU limit: throttling wrecks Postgres tail latency.
      memory: 2Gi

  # The password comes from the basic-auth Secret in owner-secrets.yaml.
  managed:
    roles:
      - name: knowledge_owner
        login: true
        superuser: false
        connectionLimit: 20
        passwordSecret:
          name: pg-primary-knowledge-owner
