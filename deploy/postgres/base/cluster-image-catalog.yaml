# Digest-pinned PostgreSQL 18 operand catalog with the pgvector extension.
#
# Trimmed on 2026-09-02 from the official CloudNativePG catalog
# (https://github.com/cloudnative-pg/artifacts, image-catalogs-extensions/
# catalog-minimal-trixie.yaml, dated 20260831): only the major-18 entry and
# the pgvector extension this repo uses are kept. SHA256 digests make the
# operand and extension images immutable; update this file only through a
