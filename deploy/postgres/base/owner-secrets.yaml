# Owner-role password for the managed role in cluster.yaml. 1Password owns it:
# rotate by editing the item, and CNPG applies the new password to the role on
# its next reconcile. knowledge-db is the same item the knowledge services
# connect with, so both sides always agree.
#   knowledge-db: username=knowledge_owner, password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-primary-knowledge-owner
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pg-primary-knowledge-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username | trim }}"
        password: "{{ .password | trim }}"
  data:
    - secretKey: username
      remoteRef:
        key: knowledge-db/username
    - secretKey: password
      remoteRef:
        key: knowledge-db/password
