# CNPG only creates a PDB at >= 3 instances. This lets a healthy primary be
# evicted for drains but blocks evicting an unhealthy one. Delete before
# scaling to 3.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pg-primary-pdb
  namespace: database
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      cnpg.io/cluster: pg-primary
