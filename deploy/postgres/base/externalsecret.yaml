# 1Password item pg-primary-b2 (vault homelab): a Backblaze application key
# scoped to the backup bucket and the pg-primary/ file-name prefix, with
# capabilities listBuckets, listAllBucketNames, readFiles, writeFiles,
# deleteFiles (delete is what the retention policy uses).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-primary-b2
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: pg-primary-b2
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: pg-primary-b2/ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: pg-primary-b2/ACCESS_SECRET_KEY
