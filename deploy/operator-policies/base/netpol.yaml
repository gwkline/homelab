# Default-deny ingress for the operator namespaces and `default`. Only the
# admission webhooks take inbound connections; they are called by the API
# server, which is not a pod, so their ports are open to any source. The one
# operator metrics port scraped is the ESO controller's, which
# deploy/eso/base/metrics.yaml opens to VictoriaMetrics. Kubelet probes are
# node-local traffic, which kube-router always admits.
# `tailscale` is left open: its proxies take direct WireGuard UDP from new
# tailnet peers, and denying it would push every UI through DERP relays.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 10250 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook
  namespace: cnpg-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 9443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cosign-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook
  namespace: cosign-system
spec:
  podSelector:
    matchLabels:
      control-plane: policy-controller-webhook
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: default
spec:
  podSelector: {}
  policyTypes: [Ingress]
