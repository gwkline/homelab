# Grafana's admin login. 1Password item grafana-admin, field admin-password.
# Grafana's database is an emptyDir, so a rotated password takes effect on the
# next pod start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-password: "{{ .password | trim }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin/admin-password
