# Grafana — UI over the metrics (VictoriaMetrics) + logs (Loki) stack (issue #44).
#
# Single replica, anonymous Viewer behind the tailnet (tailnet identity is
# the auth gate; read-only posture mirrors headlamp). Datasources are
# provisioned from datasources.yaml in this directory — the Loki copy of
# deploy/loki/base/grafana-datasource.yaml plus this issue's VictoriaMetrics
# datasource — mounted as files so Grafana picks them up without a sidecar.
# Dashboards are provisioned from dashboard-files.yaml; alert rules from
# alerting.yaml (provisioned alerting, evaluated in-Grafana). All ephemeral
# (emptyDir); provisioning is the source of truth.
#
# Image is digest-pinned (tag + digest together); bump deliberately.
# Runs as uid 1000 (repo convention): GF_PATHS_* below keep every writable
# path inside the data emptyDir, since the image's baked-in dirs
# (/var/log/grafana, root-owned) are not writable by uid 1000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: grafana
          # grafana/grafana:13.2.1 (multi-arch manifest, 2026-09-02).
          image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_PATHS_DATA
              value: /var/lib/grafana
            - name: GF_PATHS_LOGS
              value: /var/lib/grafana/log
            - name: GF_PATHS_PLUGINS
              value: /var/lib/grafana/plugins
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            # Read-only UI behind the tailnet: anonymous Viewer, no login
            # form. To enable management, flip DISABLE_LOGIN_FORM and set
            # GF_SECURITY_ADMIN_PASSWORD from a Secret.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            # Login form ON so Gavin can administer (dashboards/alerts).
            # Password lives in the grafana-admin Secret, created once via:
            #   kubectl create secret generic grafana-admin -n agents \
            #     --from-literal=admin-password='<pw>'
            # (kept out of git; ESO/1Password owns it long-term, issue #38).
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "false"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources/loki.yaml
              subPath: loki.yaml
              readOnly: true
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources/vm.yaml
              subPath: vm.yaml
              readOnly: true
            - name: provisioning-alerting
              mountPath: /etc/grafana/provisioning/alerting
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
              subPath: provider.yaml
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
      volumes:
        # Dashboards/preferences are ephemeral; the Loki datasource is
        # provisioned (datasources.yaml), so core function survives restarts.
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: provisioning-datasources
          configMap:
            name: grafana-datasources
        - name: provisioning-alerting
          configMap:
            name: grafana-alerting
        - name: provisioning-dashboards
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
