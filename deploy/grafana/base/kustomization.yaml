apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - deployment.yaml
  - service.yaml
  - datasources.yaml
  - dashboards-provider.yaml
  - alerting.yaml
  - netpol.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/homelab-factory-jobs.json
      - dashboards/homelab-logs.json
      - dashboards/homelab-nodes.json
      - dashboards/homelab-postgres.json
      - dashboards/homelab-tailscale.json
      - dashboards/homelab-workloads.json
    options:
      disableNameSuffixHash: true
