apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - deployment.yaml
  - service.yaml
  - netpol.yaml
  - ntfy-secret.yaml

# Hash-suffixed names, so any dashboard or provisioning change rolls Grafana.
# Its database is an emptyDir, so the new pod holds exactly what these files
# define and deleted rules disappear.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/homelab-factory-jobs.json
      - dashboards/homelab-logs.json
      - dashboards/homelab-nodes.json
      - dashboards/homelab-postgres.json
      - dashboards/homelab-tailscale.json
      - dashboards/homelab-workloads.json
  - name: grafana-datasources
    files:
      - provisioning/datasources/loki.yaml
      - provisioning/datasources/victoriametrics.yaml
  - name: grafana-dashboard-provider
    files:
      - provisioning/dashboards/provider.yaml
  - name: grafana-alerting
    files:
      - provisioning/alerting/contact-points.yaml
      - provisioning/alerting/rules.yaml
