# Provisioned dashboards (issue #44; factory-jobs/postgres/tailscale/chaos
# came from #285). Source of truth is
# deploy/grafana/base/dashboards/*.json; this ConfigMap is generated from
# those files (re-generate when they change). Mounted at
# /etc/grafana/dashboards (see deployment.yaml).
#
# NOTE: #285 briefly shipped homelab-logs.json with the dashboard JSON
# pasted three times into one scalar (invalid JSON — Grafana logged
# provisioning errors on every restart); this file carries the single-JSON
# form. Regenerating? Emit exactly one JSON document per key.
#
# Dashboards:
#   homelab-logs.json       — log volume, live tail, error counters (Loki)
#   homelab-factory-jobs.json — factory CronJob/Job pipeline health (#285)
#   homelab-postgres.json   — CNPG pg-primary k8s-level health (#285)
#   homelab-tailscale.json  — operator, ts-* proxies, serve-fixers (#285)
#   homelab-chaos.json      — chaos-monkey kill/recovery timeline (#285)
#   homelab-nodes.json      — node saturation: CPU/memory vs allocatable,
#                             Ready/DiskPressure/MemoryPressure, pods per node
#   homelab-workloads.json  — pod restarts, failed Jobs, PVC usage,
#                             application availability (deployments/statefulsets)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: agents
data:
  homelab-logs.json: |
    {
      "annotations": { "list": [] },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "description": "Log lines per second across homelab namespaces.",
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (namespace) (rate({namespace=~\".+\"}[$__auto]))",
              "refId": "A"
            }
          ],
          "title": "Log volume by namespace",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "description": "Live tail of the agents namespace (panel, headlamp, workers).",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 8 },
          "id": 2,
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"agents\"}",
              "refId": "A"
            }
          ],
          "title": "Agents namespace logs",
          "type": "logs"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "description": "Lines mentioning error/fail/exception in the last hour.",
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 20 },
          "id": 3,
          "options": {},
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({namespace=~\".+\"} |~ \"(?i)error|fail|exception\" [1h]))",
              "refId": "A"
            }
          ],
          "title": "Error lines (1h)",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["homelab", "loki"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Homelab Logs",
      "uid": "homelab-logs",
      "version": 1
    }
  homelab-factory-jobs.json: |
    {"annotations": {"list": []}, "editable": false, "fiscalYearStartMonth": 0, "graphTooltip": 0, "panels": [{"gridPos": {"h": 5, "w": 24, "x": 0, "y": 0}, "id": 1, "options": {"content": "# Factory pipeline health\n\nThe factory (`deploy/factory`) runs CronJobs in the **sandbox** namespace \u2014 orchestrator (`*/10`), collector (hourly `:05`), reviewer, security, sweeper, reclaimer, and the launchpads \u2014 that spawn sandbox Jobs and keep the live PR/issue ledger on GitHub. Finished Jobs are GC'd after 24h; a failed tick stays failed (`backoffLimit: 0`) so it is visible here.\n\n**Datasources:** metric panels use the *Metrics datasource* variable at the top of the page \u2014 pick VictoriaMetrics (or any Prometheus-compatible datasource); it is deliberately **not pinned** so this dashboard works with whichever metrics backend is provisioned. The ledger logs panel at the bottom is pinned to the provisioned Loki (`uid: loki`), where every `job_name=\"...\"` link jumps straight to that run's full logs.", "mode": "markdown"}, "title": "About this dashboard", "type": "text"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Jobs with pods currently running in sandbox.", "fieldConfig": {"defaults": {}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 0, "y": 5}, "id": 2, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(kube_job_status_active{namespace=\"sandbox\"})", "refId": "A"}], "title": "Active Jobs", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Jobs that reached Succeeded in the last 24h.", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 6, "y": 5}, "id": 3, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(increase(kube_job_status_succeeded{namespace=\"sandbox\"}[24h]))", "refId": "A"}], "title": "Succeeded Jobs (24h)", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Failed sandbox Jobs in the last 24h \u2014 a failed factory tick stays failed (backoffLimit: 0).", "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 3}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 12, "y": 5}, "id": 4, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(increase(kube_job_status_failed{namespace=\"sandbox\"}[24h]))", "refId": "A"}], "title": "Failed Jobs (24h)", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Suspended factory CronJobs \u2014 should always be 0.", "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 18, "y": 5}, "id": 5, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(kube_cronjob_spec_suspend{namespace=\"sandbox\"})", "refId": "A"}], "title": "Suspended CronJobs", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Sandbox Jobs by status over time: currently active plus succeeded/failed completions.", "fieldConfig": {"defaults": {"min": 0, "unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 9}, "id": 6, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(kube_job_status_active{namespace=\"sandbox\"})", "legendFormat": "active", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(increase(kube_job_status_succeeded{namespace=\"sandbox\"}[$__auto]))", "legendFormat": "succeeded", "refId": "B"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(increase(kube_job_status_failed{namespace=\"sandbox\"}[$__auto]))", "legendFormat": "failed", "refId": "C"}], "title": "Jobs by status over time (sandbox)", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Failed-job rate by Job name (top 8, 1h window). VictoriaMetrics renames kube-state-metrics' job label to exported_job (scrape-job label wins).", "fieldConfig": {"defaults": {"min": 0, "unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 9}, "id": 7, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "desc"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "topk(8, sum by (exported_job) (increase(kube_job_status_failed{namespace=\"sandbox\"}[1h])))", "legendFormat": "{{exported_job}}", "refId": "A"}], "title": "Failed Jobs by name (1h)", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Wall-clock duration of finished sandbox Jobs (completion time minus start time). Spikes are stuck runs. Only Jobs still within the k8s TTL (24h) are visible.", "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 17}, "id": 8, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "desc"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "topk(8, kube_job_status_completion_time{namespace=\"sandbox\"} - kube_job_status_start_time{namespace=\"sandbox\"})", "legendFormat": "{{exported_job}}", "refId": "A"}], "title": "Job durations (finished Jobs)", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Each series ramps from 0 since that CronJob's last scheduled run; a value persisting above the cron interval (10 min for the orchestrator, 1 h for collector/reclaimer) means a missed fire.", "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 17}, "id": 9, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "desc"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "time() - kube_cronjob_status_last_schedule_time{namespace=\"sandbox\"}", "legendFormat": "{{cronjob}}", "refId": "A"}], "title": "Seconds since last CronJob fire", "type": "timeseries"}, {"datasource": {"type": "loki", "uid": "loki"}, "description": "Logs from the factory CronJob pods (collector, sweeper, ...) \u2014 the PR/issue ledger activity as it is posted to GitHub. The live ledger is GitHub labels; finished Job objects are GC'd after 24h.", "gridPos": {"h": 10, "w": 24, "x": 0, "y": 25}, "id": 10, "options": {"showTime": true, "sortOrder": "Descending", "wrapLogMessage": true}, "targets": [{"datasource": {"type": "loki", "uid": "loki"}, "expr": "{namespace=\"sandbox\", job_name=~\"factory-.*\"}", "refId": "A"}], "title": "Factory ledger activity (Loki)", "type": "logs"}], "refresh": "30s", "schemaVersion": 39, "tags": ["homelab", "factory", "metrics"], "templating": {"list": [{"current": {"selected": true, "text": "VictoriaMetrics", "value": "victoriametrics"}, "hide": 0, "includeAll": false, "label": "Metrics datasource", "multi": false, "name": "DS_METRICS", "options": [], "query": "prometheus", "refresh": 1, "regex": "", "skipUrlSync": false, "type": "datasource"}]}, "time": {"from": "now-6h", "to": "now"}, "timepicker": {}, "timezone": "", "title": "Homelab Factory Jobs", "uid": "homelab-factory-jobs", "version": 1}
  homelab-postgres.json: |
    {"annotations": {"list": []}, "editable": false, "fiscalYearStartMonth": 0, "graphTooltip": 0, "panels": [{"gridPos": {"h": 5, "w": 24, "x": 0, "y": 0}, "id": 1, "options": {"content": "# CNPG / Postgres health (k8s level)\n\nPostgres runs as the CloudNativePG `Cluster` **pg-primary** (`deploy/postgres`, namespace **database**, single instance \u2014 not HA). This dashboard is deliberately k8s-level only: **no postgres exporter is deployed on main** \u2014 `deploy/postgres/base/netpol.yaml` already reserves scrape access for one on port 9187, so pg-level panels (connections, replication lag, cache hit rate) can be added here once an exporter lands. Tracked as a gap in `deploy/grafana/base/README.md`.\n\n**Datasource:** every panel uses the *Metrics datasource* variable at the top of the page \u2014 pick VictoriaMetrics (or any Prometheus-compatible datasource); it is deliberately **not pinned** so this dashboard works with whichever metrics backend is provisioned.", "mode": "markdown"}, "title": "About this dashboard", "type": "text"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Containers reporting Ready in the database namespace \u2014 for pg-primary this should equal the instance count.", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 0, "y": 5}, "id": 2, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(kube_pod_status_ready{namespace=\"database\", condition=\"true\"})", "refId": "A"}], "title": "Ready containers", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Container restarts across the postgres cluster pods in the last 24h.", "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 6, "y": 5}, "id": 3, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"database\"}[24h]))", "refId": "A"}], "title": "Restarts (24h)", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Pods currently Running in the database namespace.", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 12, "y": 5}, "id": 4, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(kube_pod_status_phase{namespace=\"database\", phase=\"Running\"})", "refId": "A"}], "title": "Running pods", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Fullest postgres PVC (pg_wal + data). Fires homelab-pvc-nearly-full at >90%.", "fieldConfig": {"defaults": {"max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 90}]}, "unit": "percent"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 18, "y": 5}, "id": 5, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "max(100 * (1 - kubelet_volume_stats_available_bytes{namespace=\"database\"} / kubelet_volume_stats_capacity_bytes{namespace=\"database\"}))", "refId": "A"}], "title": "Max PVC usage", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "CPU used by each postgres pod vs its requested CPU.", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 9}, "id": 6, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"database\", container!=\"\"}[5m]))", "legendFormat": "{{pod}} used", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=\"database\", resource=\"cpu\", unit=\"core\"})", "legendFormat": "{{pod}} requested", "refId": "B"}], "title": "CPU usage vs requests", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Memory working set of each postgres pod vs its requested memory.", "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 9}, "id": 7, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"database\", container!=\"\"})", "legendFormat": "{{pod}} used", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=\"database\", resource=\"memory\", unit=\"byte\"})", "legendFormat": "{{pod}} requested", "refId": "B"}], "title": "Memory working set vs requests", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Container restarts per postgres pod over the last 24h \u2014 CrashLoop or OOM churn shows up here first.", "fieldConfig": {"defaults": {"min": 0, "unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 17}, "id": 8, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "desc"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"database\"}[24h]))", "legendFormat": "{{pod}}", "refId": "A"}], "title": "Restarts by pod (24h)", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Consumed capacity per postgres PVC from kubelet volume stats.", "fieldConfig": {"defaults": {"max": 100, "min": 0, "unit": "percent"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 17}, "id": 9, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "desc"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "100 * (1 - kubelet_volume_stats_available_bytes{namespace=\"database\"} / kubelet_volume_stats_capacity_bytes{namespace=\"database\"})", "legendFormat": "{{persistentvolumeclaim}}", "refId": "A"}], "title": "PVC usage (%)", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Current volume capacity vs what the PVC spec requested \u2014 CNPG resizes PVCs when the Cluster spec grows.", "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 25}, "id": 10, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"database\"}", "legendFormat": "{{persistentvolumeclaim}} capacity", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=\"database\"}", "legendFormat": "{{persistentvolumeclaim}} requested", "refId": "B"}], "title": "PVC capacity vs requested", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Pod phase in the database namespace over time \u2014 pg-primary-1 plus CNPG's own pods in cnpg-system are excluded (this namespace only).", "fieldConfig": {"defaults": {"min": 0, "unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 25}, "id": 11, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum by (phase) (kube_pod_status_phase{namespace=\"database\"})", "legendFormat": "{{phase}}", "refId": "A"}], "title": "Pod phase over time", "type": "timeseries"}], "refresh": "30s", "schemaVersion": 39, "tags": ["homelab", "postgres", "metrics"], "templating": {"list": [{"current": {"selected": true, "text": "VictoriaMetrics", "value": "victoriametrics"}, "hide": 0, "includeAll": false, "label": "Metrics datasource", "multi": false, "name": "DS_METRICS", "options": [], "query": "prometheus", "refresh": 1, "regex": "", "skipUrlSync": false, "type": "datasource"}]}, "time": {"from": "now-6h", "to": "now"}, "timepicker": {}, "timezone": "", "title": "Homelab Postgres", "uid": "homelab-postgres", "version": 1}
  homelab-tailscale.json: |
    {"annotations": {"list": []}, "editable": false, "fiscalYearStartMonth": 0, "graphTooltip": 0, "panels": [{"gridPos": {"h": 5, "w": 24, "x": 0, "y": 0}, "id": 1, "options": {"content": "# Tailscale operator, proxies, and serve-fixers\n\nThe **tailscale** namespace runs the Tailscale Kubernetes operator, the `ts-*` proxy StatefulSets it provisions for exposed Services, and the serve-fixer Deployments (t3code, panel, work) that re-apply `tailscale serve` when app pod IPs drift \u2014 the 502-after-rollout workaround (`deploy/tailscale/README.md`).\n\n**Datasources:** metric panels use the *Metrics datasource* variable at the top of the page \u2014 pick VictoriaMetrics (or any Prometheus-compatible datasource); it is deliberately **not pinned**. The two log panels are pinned to the provisioned Loki (`uid: loki`).", "mode": "markdown"}, "title": "About this dashboard", "type": "text"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Pods currently Running in the tailscale namespace (operator, serve-fixers, ts-* proxies).", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 0, "y": 5}, "id": 2, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "expr": "sum(kube_pod_status_phase{namespace=\"tailscale\", phase=\"Running\"})", "refId": "A"}], "title": "Running pods", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${DS_METRICS}"}, "description": "Container restarts across operator, serve-fixers, and proxies in the last 24h.", "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 6, "y": 5}, "id": 3, "options": {"colorMode": "value", "graphMode": "no