apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.agents.svc:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 2000
      derivedFields:
        - name: Job run logs
          matcherRegex: 'job_name="([^"]+)"'
          datasourceUid: loki
          url: '{job_name="$${__value.raw}"}'
        - name: Pod logs
          matcherRegex: 'pod="([^"]+)"'
          datasourceUid: loki
          url: '{pod="$${__value.raw}"}'
