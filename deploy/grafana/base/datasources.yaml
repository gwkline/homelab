apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: agents
data:
  victoriametrics.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoriametrics.agents.svc:8428
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 30s
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.agents.svc:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 2000
          derivedFields:
            - name: Job run logs
              matcherRegex: 'job_name="([^"]+)"'
              datasourceUid: loki
              url: '{job_name="${__value.raw}"}'
            - name: Pod logs
              matcherRegex: 'pod="([^"]+)"'
              datasourceUid: loki
              url: '{pod="${__value.raw}"}'
