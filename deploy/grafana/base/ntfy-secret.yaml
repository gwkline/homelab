# The alert contact point's topic URL. 1Password item grafana-ntfy, field
# url: https://ntfy.sh/<topic>, with an unguessable topic
# (`openssl rand -hex 16`). Subscribe to the same topic in the ntfy app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-ntfy
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: grafana-ntfy
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        url: "{{ .url | trim }}"
  data:
    - secretKey: url
      remoteRef:
        key: grafana-ntfy/url
