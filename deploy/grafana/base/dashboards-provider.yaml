# Dashboard provider: tells Grafana to load provisioned dashboards from
# /etc/grafana/dashboards (mounted from the grafana-dashboards ConfigMap).
# Mounted as a file at
# /etc/grafana/provisioning/dashboards/provider.yaml (see deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: agents
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: homelab
        orgId: 1
        folder: Homelab
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
