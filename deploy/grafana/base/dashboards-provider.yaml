apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: agents
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: homelab
        orgId: 1
        folder: Homelab
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
