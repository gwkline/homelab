apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Runs in `agents` because PVCs are namespaced: a pod in any other namespace
# cannot mount t3code/hermes volumes, so the backup job must live where they
# do. The namespace-scoped `onepassword` SecretStore already exists here.
namespace: agents

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - externalsecret.yaml
  - cronjob.yaml
