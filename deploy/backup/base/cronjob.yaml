# Nightly encrypted backups of the stateful PVCs to object storage.
#
# DISABLED BY DEFAULT. Nothing deploys this until you apply this directory
# (runbook section 11). Applying it also materializes the backup-target
# Secret from 1Password via the backup-target ExternalSecret — no manual
# secret creation step.
#
# Runs in `agents` because the PVCs are namespaced: a pod anywhere else
# cannot mount them. Same-node assumption still applies: the PVCs use the
# local-path provisioner, which pins them to the node where their pods run.
# RWO volumes can be mounted by other pods only on that same node, so this
# CronJob must stay co-located. On a single-node cluster that is automatic;
# if you later add nodes and a workload moves, pin this CronJob with a
# nodeSelector to match.
#
# Repos themselves are not precious (git re-clones); agent home dirs, hermes
# memory, t3code's own state (pairings, environment-id, sessions),
# and executor state are. The t3state snapshot additionally carries agent
# credentials and browser pairing material — the restic repository password
# is the only thing protecting it, so treat every restored copy as secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: restic-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: restic/restic:0.18.0@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120
              # Idempotent: initializes the repo on first ever run, then
              # snapshots + prunes every night. Each source gets its own tag
              # so snapshots are independently restorable and identifiable.
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  restic snapshots --quiet >/dev/null 2>&1 || restic init
                  for dir in /mnt/t3code /mnt/t3state /mnt/hermes /mnt/executor; do
                    [ -d "$dir" ] || { echo "skip missing $dir"; continue; }
                    echo "==> backing up ${dir}"
                    restic backup "$dir" --tag "$(basename "$dir")"
                  done
                  # Group retention by source path, not by the pod's per-run
                  # hostname restic would otherwise group by: every run is a
                  # fresh pod name, so without this each snapshot is its own
                  # group and nothing ever prunes. Keeps the policy per source
                  # — t3state stays distinct from the repo data in /mnt/t3code.
                  restic forget --group-by paths --keep-daily 7 --keep-weekly 5 --keep-monthly 6 --prune
                  echo "==> backup complete"
              envFrom:
                - secretRef:
                    name: backup-target
              volumeMounts:
                - name: t3code-data
                  mountPath: /mnt/t3code
                  readOnly: true
                - name: t3state-data
                  mountPath: /mnt/t3state
                  readOnly: true
                - name: hermes-data
                  mountPath: /mnt/hermes
                  readOnly: true
                - name: executor-data
                  mountPath: /mnt/executor
                  readOnly: true
              resources:
                requests:
                  cpu: "200m"
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: t3code-data
              persistentVolumeClaim:
                claimName: t3code-data-t3code-0
                readOnly: true
            - name: t3state-data
              persistentVolumeClaim:
                claimName: t3state-t3code-0
                readOnly: true
            - name: hermes-data
              persistentVolumeClaim:
                claimName: hermes-data-hermes-0
                readOnly: true
            # Executor's database+keys (deploy/executor/base). Referenced by
            # claim name, so enabling backups implies executor is deployed.
            - name: executor-data
              persistentVolumeClaim:
                claimName: executor-data-executor-0
                readOnly: true
