# Materializes the backup-target Secret (consumed via envFrom by the restic
# CronJob) from the homelab vault in 1Password. The vault item is the source
# of truth; the cluster only holds a synced copy, and no secret value is ever
# committed here.
#
# Prerequisites, in order:
#   1. External Secrets Operator is installed with the 1Password SDK provider
#      and the service-account token secret bootstrapped (see the ESO/1Password
#      setup runbook).
#   2. A namespace-scoped SecretStore named `onepassword` exists in `agents`
#      and reports Ready. One already does — deploy/github-tokens/base/
#      secretstore.yaml creates it — so nothing new to apply here.
#   3. The vault contains item `restic-backup` with four text fields named
#      exactly like the secretKeys below (RESTIC_REPOSITORY, B2_ACCOUNT_ID,
#      B2_ACCOUNT_KEY, RESTIC_PASSWORD). Enter values only in 1Password —
#      never in git, issues, or logs.
#
# Lives in `agents` (not its own namespace): the CronJob mounting the stateful
# PVCs must be co-located with them, and the Secret must live where the
# CronJob reads it.
#
# Emergency fallback: if ESO or the vault is down during a rebuild,
# scripts/create-backup-secret.sh still creates the Secret by hand. See
# runbook section 11 for when that is acceptable and what happens afterward.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-target
spec:
  # Rotating a field in the 1Password item converges into the cluster within
  # this interval. Read runbook section 11 BEFORE touching RESTIC_PASSWORD:
  # changing it in the vault alone makes existing snapshots unreadable.
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: SecretStore
  target:
    name: backup-target
    # ESO owns the Secret: manual edits to backup-target are reconciled back
    # to the vault state at the next refresh.
    creationPolicy: Owner
    # Keep the materialized credentials if this ExternalSecret is ever
    # deleted by accident; losing them means losing access to the backups.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Trim guards against a trailing newline entering a field via
        # copy-paste in 1Password — an invisible byte that would make every
        # restic auth fail (same guarantee github-token.yaml applies).
        RESTIC_REPOSITORY: "{{ .RESTIC_REPOSITORY | trim }}"
        B2_ACCOUNT_ID: "{{ .B2_ACCOUNT_ID | trim }}"
        B2_ACCOUNT_KEY: "{{ .B2_ACCOUNT_KEY | trim }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD | trim }}"
  data:
    # secretKey == the exact env var restic expects == the 1Password field
    # label, so there is only one name for each value everywhere.
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: restic-backup
        property: RESTIC_REPOSITORY
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: restic-backup
        property: B2_ACCOUNT_ID
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: restic-backup
        property: B2_ACCOUNT_KEY
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic-backup
        property: RESTIC_PASSWORD
