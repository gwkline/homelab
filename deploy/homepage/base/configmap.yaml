apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: agents
data:
  settings.yaml: |
    title: homelab
    theme: dark
    color: teal
    headerStyle: clean
    layout:
      Agents:
        style: row
  services.yaml: |
    - Agents:
        - Factory Panel:
            icon: mdi-view-dashboard
            description: launch runs, watch jobs
            href: https://panel.${HOMEPAGE_VAR_TAILNET_NAME}
            # panel-http: internal ClusterIP Service declaring the app's
            # plaintext HTTP port (panel's tailscale Service is 443-only).
            siteMonitor: http://panel-http.agents.svc.cluster.local:3000
        - T3 Code:
            icon: mdi-console
            description: Interactive agent servers
            href: https://t3code-0.${HOMEPAGE_VAR_TAILNET_NAME}
            siteMonitor: http://t3code-headless.agents.svc.cluster.local:3773
        - Hermes:
            icon: mdi-brain
            description: Orchestrator - messaging gateway or kubectl exec
            href: https://github.com/gwkline/homelab#hermes
  widgets.yaml: |
    - resources:
        backend: resources
        cpu: true
        memory: true
        expanded: true
---
# The single place the tailnet DNS suffix is configured (homepage substitutes
# HOMEPAGE_VAR_* env vars into config hrefs). Set it to your tailnet's suffix,
# e.g. tailabc1234.ts.net (discover with:
# kubectl get svc t3code-0 -n agents -o jsonpath='{.status.loadBalancer.ingress[0].hostname}').
# Do not commit a personal tailnet name — scripts/verify.sh rejects it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-env
  namespace: agents
data:
  tailnet-name: "<tailnet>"
