# Homepage dashboard. State is just its config, so a Deployment (not
# StatefulSet) with an emptyDir config dir seeded from the ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed the writable config dir from git-reviewed ConfigMap content.
        - name: config-init
          image: busybox:1.36
          command: ["sh", "-c", "cp /cfg-source/* /app/config/ && chown -R 1000:1000 /app/config"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: cfg-source
              mountPath: /cfg-source
              readOnly: true
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.1.2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          env:
            # Next.js 16 rejects unknown Host headers. Reachability is already
            # gated by tailnet identity + NetworkPolicy, so any host is fine.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
            # Tailnet DNS suffix for service hrefs — the single documented
            # configuration value (see deploy/tailscale/README.md).
            - name: HOMEPAGE_VAR_TAILNET_NAME
              valueFrom:
                configMapKeyRef:
                  name: homepage-env
                  key: tailnet-name
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
      volumes:
        - name: cfg-source
          configMap:
            name: homepage-config
        - name: config
          emptyDir:
            sizeLimit: 64Mi
