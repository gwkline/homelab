apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Homepage writes into its config dir, so it gets a copy rather than
        # the read-only ConfigMap mount.
        - name: config-init
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "cp /cfg-source/* /app/config/"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cfg-source
              mountPath: /cfg-source
              readOnly: true
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.1.2@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          env:
            # Next.js rejects unknown Host headers; the tailnet gates access.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
            # ConfigMap homepage-env is created on the cluster, never in git
            # (deploy/tailscale/README.md). Optional, so homepage still starts
            # without it; the links are then unresolved.
            - name: HOMEPAGE_VAR_TAILNET_NAME
              valueFrom:
                configMapKeyRef:
                  name: homepage-env
                  key: tailnet-name
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
      volumes:
        - name: cfg-source
          configMap:
            name: homepage-config
        - name: config
          emptyDir:
            sizeLimit: 64Mi
