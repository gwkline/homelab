apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app: homepage
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-homepage
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: homepage
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3000
