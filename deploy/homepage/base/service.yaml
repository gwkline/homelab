apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: agents
  annotations:
    tailscale.com/hostname: homepage
    tailscale.com/tags: tag:k8s-operator
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: homepage
  ports:
    - name: https
      port: 443
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-homepage
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: homepage
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3000
