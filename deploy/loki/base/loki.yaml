# Loki — log store for the cluster (issue #47).
#
# Single-binary filesystem mode, exactly one machine's worth of state on one
# PVC. The PVC size below IS the hard disk ceiling; the limits_config block
# keeps ingestion and cardinality underneath it. Alloy (alloy.yaml in this
# directory) pushes logs in; Grafana (deploy/grafana/base, #44) queries.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: agents
  labels:
    app: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      log_level: info

    common:
      instance_addr: 127.0.0.1
      path_prefix: /var/lib/loki
      storage:
        filesystem:
          chunks_directory: /var/lib/loki/chunks
          rules_directory: /var/lib/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /var/lib/loki/tsdb-index
        cache_location: /var/lib/loki/tsdb-cache

    compactor:
      working_directory: /var/lib/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    limits_config:
      # Retention: 30 days — comfortably outlives the 7-day
      # ttlSecondsAfterFinished on sandbox Jobs, which is the point of
      # this stack: a finished/TTL-deleted run stays debuggable.
      retention_period: 720h
      # Soft guardrails under the 10Gi PVC ceiling: throttle bursty agents,
      # cap stream cardinality, refuse replayed ancient logs.
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
      max_global_streams_per_user: 50000
      max_query_series: 500
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: false

    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: agents
  labels:
    app: loki
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
---
# Headless service the StatefulSet pins its identity to.
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
  namespace: agents
  labels:
    app: loki
spec:
  clusterIP: None
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: agents
spec:
  serviceName: loki-headless
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      initContainers:
        # Same pattern as hermes: the local-path provisioner hands us a
        # hostPath-backed directory, so fix ownership once before the
        # unprivileged loki user (10001) writes to it.
        - name: volume-init
          image: busybox:1.36
          command: ["chown", "-R", "10001:10001", "/var/lib/loki"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/loki
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          args: ["-config.file=/etc/loki/config/loki.yaml"]
          ports:
            - name: http
              containerPort: 3100
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # The hard ceiling for logs on this machine: a PVC cannot grow
            # past its request. 30-day retention normally keeps usage far
            # below; when it does fill, writes fail loudly instead of the
            # disk growing — see deploy/loki/README.md.
            storage: 10Gi
