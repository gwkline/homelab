# Workload-owned exposure rule for Loki (default-deny lives in policies/base).
# Loki is reached only from inside the `agents` namespace: the alloy collector
# pushes, Grafana (#44) queries, operators port-forward for ad-hoc queries.
# It is deliberately not exposed to the tailnet — Grafana fronts it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agents-to-loki
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3100
