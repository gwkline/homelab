# Alloy pushes and Grafana queries; nothing else in the cluster reaches Loki,
# which runs without auth. kubectl port-forward enters through the kubelet and
# still works.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agents-to-loki
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: alloy
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 3100
