# knowledge-api-token for orchestrator pods in sandbox (same item as agents).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowledge-api-token
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: knowledge-api-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token | trim }}"
  data:
    - secretKey: token
      remoteRef:
        key: knowledge-api-token/token
