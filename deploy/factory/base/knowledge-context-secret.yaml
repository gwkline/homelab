# Knowledge-context bearer token for factory orchestrator pods (#86):
# same 1Password item the agents-namespace knowledge services and the panel
# use (see deploy/knowledge/base/externalsecret.yaml for the item contract).
# Synced into sandbox so orchestrator pods can mount it cross-namespace-safe.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowledge-api-token
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: knowledge-api-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token | trim }}"
  data:
    - secretKey: token
      remoteRef:
        key: knowledge-api-token/token
