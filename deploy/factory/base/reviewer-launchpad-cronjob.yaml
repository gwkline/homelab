apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-reviewer-launchpad
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
    factory.gwkline.io/component: reviewer
spec:
  # Reviewer instance for gwkline/launchpad factory PRs (branch convention
  # factory/issue-<N>/<profile>). Same policy as homelab: CI-as-gate
  # auto-merge, factory-authored PRs only, green checks required.
  # Staggered off the homelab reviewer (35,55) and collector (:05).
  schedule: "15,45 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 0
      template:
        metadata:
          labels:
            factory.gwkline.io/profile: reviewer
        spec:
          restartPolicy: Never
          serviceAccountName: factory-reviewer
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: reviewer
              image: ghcr.io/gwkline/homelab/factory/reviewer@sha256:35e1d611b974d4a141583ebee005c3aaa908eac931fe837df314314b3e7d0edb
              imagePullPolicy: Always
              env:
                - name: FACTORY_REPO
                  value: gwkline/launchpad
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
                # Write path — same as homelab: CI-as-gate auto-merge
                # (factory-authored PRs, green checks required).
                - name: FACTORY_REVIEWER_AUTO_MERGE
                  value: "true"
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: {} }
