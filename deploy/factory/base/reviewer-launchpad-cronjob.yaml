apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-reviewer-launchpad
  namespace: sandbox
  labels:
    factory.gwkline.io/component: reviewer
spec:
  # gwkline/launchpad instance of factory-reviewer.
  schedule: "15,45 * * * *"
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            factory.gwkline.io/profile: reviewer
        spec:
          serviceAccountName: factory-reviewer
          automountServiceAccountToken: false
          containers:
            - name: reviewer
              image: ghcr.io/gwkline/homelab/factory/reviewer:latest
              env:
                - name: FACTORY_REPO
                  value: gwkline/launchpad
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
                # Squash-merge factory PRs once CI is green. Admission is the
                # gate: only `factory`-labelled issues become PRs.
                - name: FACTORY_REVIEWER_AUTO_MERGE
                  value: "true"
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
