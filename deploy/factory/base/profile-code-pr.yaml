# Callers supply only repo/task inputs; the profile fixes everything else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-profile-code-pr
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
    factory.gwkline.io/profile: code-pr
data:
  profile.json: |
    {
      "name": "code-pr",
      "version": 1,
      "image": "ghcr.io/gwkline/homelab/factory/worker:latest",
      "serviceAccount": "factory-worker",
      "activeDeadlineSeconds": 3600,
      "backoffLimit": 0,
      "ttlSecondsAfterFinished": 3600,
      "resources": { "requests": {"cpu": "1", "memory": "1Gi"},
                     "limits":   {  "cpu": "4",     "memory": "12Gi"} },
      "envAllowlist": ["WORKER_CMD", "VERIFY_COMMAND"],
      "netpolName": "allow-factory-worker"
    }
---
# Worker egress: GitHub and package registries by IP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-factory-worker
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      factory.gwkline.io/profile: code-pr
  policyTypes: [Ingress, Egress]
  ingress: [] # nothing may connect TO a worker
  egress:
    - to: # GitHub + git clones over HTTPS
        - ipBlock: { cidr: 140.82.112.0/20 } # github.com
        - ipBlock: { cidr: 185.199.108.0/22 } # raw.githubusercontent
        - ipBlock: { cidr: 185.199.108.0/22 } # objects.githubusercontent (fastly)
    - to: # container registries (npm, ghcr, crates.io)
        - ipBlock: { cidr: 104.16.0.0/12 }
        - ipBlock: { cidr: 18.214.0.0/16 } # index.crates.io
        - ipBlock: { cidr: 108.138.128.0/17 } # static.crates.io CDN
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - ipBlock: { cidr: 10.43.0.1/32 }
      ports: [{ protocol: TCP, port: 443 }]
---
# Workers get no Kubernetes API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-worker
  namespace: sandbox
automountServiceAccountToken: false
