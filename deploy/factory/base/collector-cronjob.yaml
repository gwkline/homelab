apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-collector
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
    factory.gwkline.io/component: collector
spec:
  # Durable GitHub issue collector (#78): polls the allowlisted repos and
  # admits eligible issues into the factory by adding factory/queued — the
  # label IS the Run's ledger record (one issue + one label event = one Run,
  # ADR-002). Idempotent: repeated polls and Job TTL deletion cannot
  # duplicate work, because eligibility reads the live GitHub ledger, not
  # Kubernetes objects.
  schedule: "5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      # 24h: finished Jobs GCd; live ledger is GitHub labels, not Job objects.
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 900
      backoffLimit: 0
      template:
        metadata:
          labels:
            factory.gwkline.io/profile: collector
        spec:
          restartPolicy: Never
          serviceAccountName: factory-collector
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: collector
              image: ghcr.io/gwkline/homelab/factory/collector:latest
              env:
                # ── Declarative work selection (#78) ──────────────────────
                - name: FACTORY_REPOS
                  value: gwkline/homelab,gwkline/launchpad
                # Optional label gate; empty = every open, non-PR issue
                # without a factory lifecycle label is eligible.
                - name: FACTORY_ELIGIBILITY_LABEL
                  value: ""
                # RunProfile recorded on collected Runs (orchestrator default).
                - name: FACTORY_DEFAULT_PROFILE
                  value: code-pr
                # Eligibility-rule version; part of the Run idempotency key.
                # Bump only when the eligibility semantics change (see
                # apps/factory/collector/README.md).
                - name: FACTORY_RULE_VERSION
                  value: v1
                # Polling cursor (ISO-8601). Empty = full scan; the collector
                # prints the next cursor in its summary line every tick.
                - name: FACTORY_SINCE
                  value: ""
                - name: FACTORY_COLLECTOR_DRY_RUN
                  value: "false"
                # ── GitHub access: short-lived App installation token (#70)
                # with a transitional PAT fallback (see docs/github-app.md).
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      { name: github-app, key: app-id, optional: true }
                - name: GITHUB_APP_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      { name: github-app, key: installation-id, optional: true }
                - name: GITHUB_APP_PRIVATE_KEY_FILE
                  value: /secrets/github-app/private-key
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: true }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - {
                    name: github-app,
                    mountPath: /secrets/github-app,
                    readOnly: true,
                  }
          volumes:
            - { name: tmp, emptyDir: {} }
            - name: github-app
              secret:
                secretName: github-app
                optional: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-collector
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-collector
  namespace: sandbox
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-collector
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-collector
subjects:
  - { kind: ServiceAccount, name: factory-collector, namespace: sandbox }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-factory-collector
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      factory.gwkline.io/profile: collector
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - ipBlock: { cidr: 140.82.112.0/20 }
        - ipBlock: { cidr: 185.199.108.0/22 }
        - ipBlock: { cidr: 104.16.0.0/12 }
      ports: [{ protocol: TCP, port: 443 }]
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
