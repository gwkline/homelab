apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-sweeper
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
    factory.gwkline.io/component: sweeper
spec:
  # Stalled-PR sweep (#242): converts stale ci-red factory PRs into queueable
  # fix issues when the medic gave up, pings green PRs older than 7d once,
  # and warns about base drift. Never closes or merges PRs — the human stays
  # the merge gate. All sweep state is derived from GitHub markers, so ticks
  # are idempotent.
  schedule: "48 * * * *" # hourly, clear of collector (:05), reclaimer (:25), reviewer (:35,:55)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 900
      backoffLimit: 0
      template:
        metadata:
          labels:
            # Carries the reviewer profile label on purpose: the sweeper lives
            # in the reviewer image and inherits allow-factory-reviewer egress
            # (GitHub API + DNS only).
            factory.gwkline.io/profile: reviewer
        spec:
          restartPolicy: Never
          serviceAccountName: factory-reviewer
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: sweeper
              image: ghcr.io/gwkline/homelab/factory/reviewer@sha256:35e1d611b974d4a141583ebee005c3aaa908eac931fe837df314314b3e7d0edb
              imagePullPolicy: Always
              command: ["/reviewer/run-sweeper.sh"]
              env:
                - name: FACTORY_REPOS
                  value: gwkline/homelab,gwkline/launchpad
                - name: GH_CONFIG_DIR
                  value: /tmp/gh
                - name: FACTORY_SWEEP_DRY_RUN
                  value: "false"
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: {} }
