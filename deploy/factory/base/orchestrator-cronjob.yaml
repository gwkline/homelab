apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-orchestrator
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
    factory.gwkline.io/component: orchestrator
spec:
  # One issue per tick; Forbid skips overlapping ticks.
  concurrencyPolicy: Forbid
  schedule: "*/10 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3900 # 65 min: covers 3600s worker + publish overhead
      backoffLimit: 0 # a failed tick stays failed — visible
      template:
        metadata:
          labels:
            factory.gwkline.io/component: orchestrator
        spec:
          restartPolicy: Never
          serviceAccountName: factory-orchestrator
          automountServiceAccountToken: true # needs k8s API to spawn worker Jobs
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: orchestrator
              image: ghcr.io/gwkline/homelab/factory/orchestrator:latest
              env:
                - name: FACTORY_REPO
                  value: gwkline/homelab
                # The Service VIP is unreachable from sandbox pods; use the
                # node endpoint, which allow-factory-orchestrator permits.
                - name: KUBERNETES_SERVICE_HOST
                  value: 192.168.1.2
                - name: KUBERNETES_SERVICE_PORT
                  value: "6443"
                - name: OPENCODE_AUTH_B64
                  valueFrom:
                    secretKeyRef: { name: factory-opencode-auth, key: auth-b64 }
                - name: KNOWLEDGE_SEARCH_URL
                  # Fail-open: a retrieval outage never fails a run.
                  value: http://knowledge-retrieval-http.agents.svc.cluster.local:3000/v1/search
                - name: KNOWLEDGE_TOKEN_FILE
                  value: /secrets-knowledge/token
                - name: KNOWLEDGE_NAMESPACE
                  value: homelab-docs
                - name: WORKER_CMD
                  value: "opencode run"
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: home, mountPath: /home/nonroot }
                - name: knowledge-token-for-briefs
                  mountPath: /secrets-knowledge
                  readOnly: true
          volumes:
            - { name: tmp, emptyDir: {} }
            - { name: home, emptyDir: {} }
            - name: knowledge-token-for-briefs
              secret:
                secretName: knowledge-api-token
                items:
                  - key: token
                    path: token
---
# Jobs and pods in sandbox only; no secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-orchestrator
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-orchestrator
  namespace: sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"] # kubectl cp for patch retrieval
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["configmaps"] # worker image comes from the profile
    resourceNames: ["factory-profile-code-pr", "factory-profile-security"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-orchestrator
  namespace: sandbox
roleRef:
  {
    apiGroup: rbac.authorization.k8s.io,
    kind: Role,
    name: factory-orchestrator,
  }
subjects:
  - { kind: ServiceAccount, name: factory-orchestrator, namespace: sandbox }
---
# Covers both orchestrator CronJobs and panel-spawned runs (the panel clones
# this pod template). Orchestrators need the API server, which the sandbox
# public-only policy blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-factory-orchestrator
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  podSelector:
    matchLabels:
      factory.gwkline.io/component: orchestrator
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: # GitHub API + git + CDN
        - ipBlock: { cidr: 140.82.112.0/20 }
        - ipBlock: { cidr: 185.199.108.0/22 }
        - ipBlock: { cidr: 104.16.0.0/12 }
      ports: [{ protocol: TCP, port: 443 }]
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: # Service VIP
        - ipBlock: { cidr: 10.43.0.1/32 }
      ports: [{ protocol: TCP, port: 443 }]
    - to: # API server node endpoint
        - ipBlock: { cidr: 192.168.1.2/32 }
      ports: [{ protocol: TCP, port: 6443 }]
    - to: # knowledge retrieval
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
          podSelector:
            matchLabels:
              app: knowledge-retrieval
      ports: [{ protocol: TCP, port: 3000 }]
