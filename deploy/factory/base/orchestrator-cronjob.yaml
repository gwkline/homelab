apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-orchestrator
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
    factory.gwkline.io/component: orchestrator
spec:
  # Single-instance by construction: overlapping ticks are skipped (ADR-009).
  concurrencyPolicy: Forbid
  schedule: "*/10 * * * *" # every 10 min: near-zero-latency pickup (empty tick ≈ 5s);
    # one issue per tick, so frequent ticks drain the queue without overlap (Forbid)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 24h: finished Jobs GCd; live ledger is GitHub labels, not Job objects.
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3900 # 65 min: covers 3600s worker + publish overhead
      backoffLimit: 0 # a failed tick stays failed — visible
      template:
        metadata:
          labels:
            factory.gwkline.io/component: orchestrator
        spec:
          restartPolicy: Never
          serviceAccountName: factory-orchestrator
          automountServiceAccountToken: true # needs k8s API to spawn worker Jobs
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: orchestrator
              image: ghcr.io/gwkline/homelab/factory/orchestrator@sha256:c6ef5b781ab80b5ca5c632bcdc30e56fbc99cdfcfda87640a22bee6776168969
              imagePullPolicy: Always
              env:
                - name: FACTORY_REPO
                  value: gwkline/homelab # self-iteration target per operator
                # The in-cluster kubernetes Service VIP is unreachable from
                # isolated sandbox pods on the current node (same as the
                # reconciler): point kubectl at the API server's node endpoint
                # explicitly — allow-factory-orchestrator (below) permits it.
                - name: KUBERNETES_SERVICE_HOST
                  value: 192.168.1.2
                - name: KUBERNETES_SERVICE_PORT
                  value: "6443"
                - name: OPENCODE_AUTH_B64
                  valueFrom:
                    secretKeyRef: { name: factory-opencode-auth, key: auth-b64 }
                - name: KNOWLEDGE_SEARCH_URL
                  # #86 knowledge context: cited retrieval into worker briefs.
                  # Fail-open contract — an outage never fails a run.
                  value: http://knowledge-retrieval-http.agents.svc.cluster.local:3000/v1/search
                - name: KNOWLEDGE_TOKEN_FILE
                  value: /secrets-knowledge/token
                - name: KNOWLEDGE_NAMESPACE
                  value: homelab-docs
                - name: WORKER_CMD
                  value: "opencode run"
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: home, mountPath: /home/nonroot }
                - name: knowledge-token-for-briefs
                  mountPath: /secrets-knowledge
                  readOnly: true
          volumes:
            - { name: tmp, emptyDir: {} }
            - { name: home, emptyDir: {} }
            - name: knowledge-token-for-briefs
              secret:
                secretName: knowledge-api-token
                items:
                  - key: token
                    path: token
---
# Orchestrator RBAC: create/watch Jobs in sandbox ONLY. No secrets, no other
# namespaces, no write anywhere else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-orchestrator
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-orchestrator
  namespace: sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"] # kubectl cp for patch retrieval
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["configmaps"] # read-only: resolve worker image from the profile (single source of truth)
    resourceNames: ["factory-profile-code-pr", "factory-profile-security"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-orchestrator
  namespace: sandbox
roleRef:
  {
    apiGroup: rbac.authorization.k8s.io,
    kind: Role,
    name: factory-orchestrator,
  }
subjects:
  - { kind: ServiceAccount, name: factory-orchestrator, namespace: sandbox }
---
# Orchestrator egress: same shape as allow-factory-reconciler. Without a
# profile label the orchestrator pod fell into sandbox-egress-public-only,
# which excepts 10.0.0.0/8 — so once netpol enforcement settled on the pod,
# EVERY kubectl call (worker-image resolution, Job spawn, patch extraction)
# failed with "connection refused" to the API server, and every tick died
# after picking an issue (2026-10-06: six queued issues stuck for days).
# Applies to both orchestrator CronJobs and panel-spawned runs — all carry
# factory.gwkline.io/component=orchestrator (the panel clones the CronJob
# pod template, so the label rides along).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-factory-orchestrator
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  podSelector:
    matchLabels:
      factory.gwkline.io/component: orchestrator
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: # GitHub API + git + CDN
        - ipBlock: { cidr: 140.82.112.0/20 }
        - ipBlock: { cidr: 185.199.108.0/22 }
        - ipBlock: { cidr: 104.16.0.0/12 }
      ports: [{ protocol: TCP, port: 443 }]
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: # in-cluster Service VIP (kubectl), belt-and-braces alongside the
        # node-endpoint env override above
        - ipBlock: { cidr: 10.43.0.1/32 }
      ports: [{ protocol: TCP, port: 443 }]
    - to: # API server node endpoint (KUBERNETES_SERVICE_HOST override)
        - ipBlock: { cidr: 192.168.1.2/32 }
      ports: [{ protocol: TCP, port: 6443 }]
    - to: # #86 knowledge context: the retrieval service in agents
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
          podSelector:
            matchLabels:
              app: knowledge-retrieval
      ports: [{ protocol: TCP, port: 3000 }]
