apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-security
  namespace: sandbox
  labels:
    factory.gwkline.io/component: security
    factory.gwkline.io/profile: security
spec:
  # Per-issue security runs go through the panel (profile=security).
  schedule: "15 */6 * * *"
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            factory.gwkline.io/profile: security
        spec:
          serviceAccountName: factory-security
          automountServiceAccountToken: false
          # Only the clone step holds the GitHub token (ADR-001 D6).
          initContainers:
            - name: clone
              image: ghcr.io/gwkline/homelab/factory/security:latest
              command: ["/usr/local/bin/prepare"]
              env:
                - name: FACTORY_REPO
                  value: gwkline/homelab
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: clone-tmp, mountPath: /tmp }
                - { name: work, mountPath: /work }
          containers:
            - name: security
              image: ghcr.io/gwkline/homelab/factory/security:latest
              env:
                - name: FACTORY_REPO
                  value: gwkline/homelab
                - name: FACTORY_SECURITY_MODE
                  value: nightly
              resources:
                requests: { cpu: 500m, memory: 1Gi }
                limits: { cpu: "2", memory: 4Gi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: home, mountPath: /home/node }
                - { name: task, mountPath: /task }
                - { name: work, mountPath: /work }
                - { name: out, mountPath: /out }
          volumes:
            - { name: clone-tmp, emptyDir: {} }
            - { name: home, emptyDir: {} }
            - { name: task, emptyDir: {} }
            - { name: work, emptyDir: {} }
            - { name: out, emptyDir: {} }
