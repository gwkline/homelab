apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-orchestrator-launchpad
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
    factory.gwkline.io/component: orchestrator
spec:
  # gwkline/launchpad instance; reuses factory-orchestrator's SA, RBAC, netpol.
  concurrencyPolicy: Forbid
  schedule: "7,17,27,37,47,57 * * * *" # offset from the homelab orchestrator
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3900 # 65 min: covers 3600s worker + publish overhead
      backoffLimit: 0 # a failed tick stays failed — visible
      template:
        metadata:
          labels:
            factory.gwkline.io/component: orchestrator
        spec:
          restartPolicy: Never
          serviceAccountName: factory-orchestrator
          automountServiceAccountToken: true # needs k8s API to spawn worker Jobs
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: orchestrator
              image: ghcr.io/gwkline/homelab/factory/orchestrator:latest
              env:
                - name: FACTORY_REPO
                  value: gwkline/launchpad
                # See orchestrator-cronjob.yaml.
                - name: KUBERNETES_SERVICE_HOST
                  value: 192.168.1.2
                - name: KUBERNETES_SERVICE_PORT
                  value: "6443"
                - name: KNOWLEDGE_SEARCH_URL
                  value: http://knowledge-retrieval-http.agents.svc.cluster.local:3000/v1/search
                - name: KNOWLEDGE_TOKEN_FILE
                  value: /secrets-knowledge/token
                - name: KNOWLEDGE_NAMESPACE
                  value: launchpad-docs
                - name: WORKER_CMD
                  value: "opencode run"
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: knowledge-token-for-briefs
                  mountPath: /secrets-knowledge
                  readOnly: true
                - { name: tmp, mountPath: /tmp }
                - { name: home, mountPath: /home/nonroot }
          volumes:
            - name: knowledge-token-for-briefs
              secret:
                secretName: knowledge-api-token
                items:
                  - key: token
                    path: token
            - { name: tmp, emptyDir: {} }
            - { name: home, emptyDir: {} }
