apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-orchestrator-launchpad
  namespace: sandbox
  labels:
    factory.gwkline.io/component: orchestrator
spec:
  # gwkline/launchpad instance; reuses factory-orchestrator's SA, RBAC, netpol.
  schedule: "7,17,27,37,47,57 * * * *" # offset from the homelab orchestrator
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3900 # 65 min: covers 3600s worker + publish overhead
      template:
        metadata:
          labels:
            factory.gwkline.io/component: orchestrator
        spec:
          serviceAccountName: factory-orchestrator
          automountServiceAccountToken: true # needs k8s API to spawn worker Jobs
          containers:
            - name: orchestrator
              image: ghcr.io/gwkline/homelab/factory/orchestrator:latest
              env:
                - name: FACTORY_REPO
                  value: gwkline/launchpad
                - name: KNOWLEDGE_SEARCH_URL
                  value: http://knowledge-retrieval-http.agents.svc.cluster.local:3000/v1/search
                - name: KNOWLEDGE_TOKEN_FILE
                  value: /secrets-knowledge/token
                - name: KNOWLEDGE_NAMESPACE
                  value: launchpad-docs
                - name: WORKER_CMD
                  value: "opencode run"
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              volumeMounts:
                - name: knowledge-token-for-briefs
                  mountPath: /secrets-knowledge
                  readOnly: true
                - { name: tmp, mountPath: /tmp }
                - { name: home, mountPath: /home/nonroot }
          volumes:
            - name: knowledge-token-for-briefs
              secret:
                secretName: knowledge-api-token
                items:
                  - key: token
                    path: token
            - { name: home, emptyDir: { sizeLimit: 256Mi } }
