apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-medic
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
    factory.gwkline.io/component: medic
spec:
  # Queues one repair per tick for a ci-red factory PR. Runs just after the
  # reviewer so it sees fresh verdicts.
  schedule: "41 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 900
      backoffLimit: 0
      template:
        metadata:
          labels:
            # Reviewer label on purpose: inherits allow-factory-reviewer egress.
            factory.gwkline.io/component: medic
            factory.gwkline.io/profile: reviewer
        spec:
          restartPolicy: Never
          serviceAccountName: factory-reviewer
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: medic
              image: ghcr.io/gwkline/homelab/factory/reviewer:latest
              # Override the image's reviewer entrypoint.
              command: ["/reviewer/run-medic.sh"]
              env:
                - name: FACTORY_REPO
                  value: gwkline/homelab
                - name: GH_CONFIG_DIR
                  value: /tmp/gh
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
                - name: FACTORY_MEDIC_MAX_ATTEMPTS
                  value: "3"
                - name: FACTORY_MEDIC_MAX_CONCURRENT
                  value: "1"
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: {} }
