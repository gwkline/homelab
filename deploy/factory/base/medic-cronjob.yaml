apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-medic
  namespace: sandbox
  labels:
    factory.gwkline.io/component: medic
spec:
  # Queues one repair per tick for a ci-red factory PR. Runs just after the
  # reviewer so it sees fresh verdicts.
  schedule: "41 * * * *"
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            # Reviewer label on purpose: inherits allow-factory-reviewer egress.
            factory.gwkline.io/component: medic
            factory.gwkline.io/profile: reviewer
        spec:
          serviceAccountName: factory-reviewer
          automountServiceAccountToken: false
          containers:
            - name: medic
              image: ghcr.io/gwkline/homelab/factory/reviewer:latest
              # Override the image's reviewer entrypoint.
              command: ["/reviewer/run-medic.sh"]
              env:
                - name: FACTORY_REPO
                  value: gwkline/homelab
                - name: GH_CONFIG_DIR
                  value: /tmp/gh
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      { name: github-token, key: token, optional: false }
                - name: FACTORY_MEDIC_MAX_ATTEMPTS
                  value: "3"
                - name: FACTORY_MEDIC_MAX_CONCURRENT
                  value: "1"
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
