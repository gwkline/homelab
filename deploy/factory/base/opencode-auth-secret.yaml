# opencode auth.json for orchestrator-spawned worker Jobs, base64-encoded,
# built from the same OpenRouter key hermes uses (1Password item openrouter),
# so rotating the key is one 1Password edit.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-opencode-auth
  namespace: sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: factory-opencode-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        auth-b64: '{{ dict "openrouter" (dict "type" "api" "key" (.key | trim)) | toJson | b64enc }}'
  data:
    - secretKey: key
      remoteRef:
        key: openrouter/OPENROUTER_API_KEY
