# Factory reviewer profile — harness-agnostic (gh + jq only, no model API).
# Sibling to code-pr / security; read-only v1, auto-promote behind flag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-profile-reviewer
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: homelab
    factory.gwkline.io/profile: reviewer
data:
  profile.json: |
    {
      "name": "reviewer",
      "version": 1,
      "image": "ghcr.io/gwkline/homelab/factory/reviewer@sha256:35e1d611b974d4a141583ebee005c3aaa908eac931fe837df314314b3e7d0edb",
      "serviceAccount": "factory-reviewer",
      "activeDeadlineSeconds": 900,
      "backoffLimit": 1,
      "ttlSecondsAfterFinished": 3600,
      "resources": { "requests": {"cpu": "100m", "memory": "128Mi"},
                     "limits":   {  "cpu": "500m",  "memory": "512Mi"} },
      "envAllowlist": ["FACTORY_REPO", "FACTORY_REVIEWER_DRY_RUN", "FACTORY_REVIEWER_AUTO_MERGE"],
      "netpolName": "allow-factory-reviewer"
    }
---
# Reviewer egress: GitHub API + git + DNS only. Deny-all ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-factory-reviewer
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      factory.gwkline.io/profile: reviewer
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        # github.com API + git (140.82.112.0/20), raw.githubusercontent/codeload (185.199.108.0/22)
        - ipBlock: { cidr: 140.82.112.0/20 }
        - ipBlock: { cidr: 185.199.108.0/22 }
        # objects.githubusercontent.com (release asset CDN for gh binary is build-time only; runtime needs none)
        - ipBlock: { cidr: 104.16.0.0/12 }
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
# Least-privilege SA — no k8s API access at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-reviewer
  namespace: sandbox
automountServiceAccountToken: false
